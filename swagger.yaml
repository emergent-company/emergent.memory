basePath: /
definitions:
  domain_agentcompat.APIError:
    properties:
      error:
        $ref: '#/definitions/domain_agentcompat.APIErrorDetail'
    type: object
  domain_agentcompat.APIErrorDetail:
    properties:
      code:
        type: string
      message:
        type: string
      param:
        type: string
      type:
        type: string
    type: object
  domain_agentcompat.ChatCompletionRequest:
    properties:
      frequency_penalty:
        type: number
      max_completion_tokens:
        type: integer
      max_tokens:
        type: integer
      messages:
        items:
          $ref: '#/definitions/domain_agentcompat.ChatMessage'
        type: array
      metadata:
        additionalProperties:
          type: string
        description: Metadata is stored as run trigger_metadata.
        type: object
      model:
        description: 'Model selects the agent: "agent:<name>" or bare "<name>".'
        type: string
      parallel_tool_calls:
        type: boolean
      presence_penalty:
        type: number
      reasoning_effort:
        type: string
      response_format:
        allOf:
        - $ref: '#/definitions/domain_agentcompat.ResponseFormat'
        description: ResponseFormat lets the client request JSON output.
      seed:
        type: integer
      stop:
        items:
          type: string
        type: array
      stream:
        description: Streaming.
        type: boolean
      stream_options:
        $ref: '#/definitions/domain_agentcompat.StreamOptions'
      system_fingerprint:
        description: |-
          SystemFingerprint is overloaded as a run-resume token.
          When the server pauses an agent run waiting for client tool execution
          it sets SystemFingerprint = "run_<runID>". The client must echo this
          value back in the next request to resume the same run.
        type: string
      temperature:
        description: LLM sampling params — passed through to the underlying model.
        type: number
      tool_choice:
        items:
          type: integer
        type: array
      tools:
        description: |-
          Client-supplied tools. When present the agent can call these and the
          response will include tool_calls for the client to execute.
          Internal (memory_*) tools are always available alongside these.
        items:
          $ref: '#/definitions/domain_agentcompat.ClientToolDef'
        type: array
      top_p:
        type: number
      user:
        description: User is an opaque identifier for abuse-detection, forwarded to
          the run.
        type: string
    type: object
  domain_agentcompat.ChatCompletionResponse:
    properties:
      choices:
        items:
          $ref: '#/definitions/domain_agentcompat.Choice'
        type: array
      created:
        description: unix seconds
        type: integer
      id:
        type: string
      model:
        type: string
      object:
        description: '"chat.completion"'
        type: string
      system_fingerprint:
        type: string
      usage:
        $ref: '#/definitions/domain_agentcompat.Usage'
    type: object
  domain_agentcompat.ChatMessage:
    properties:
      content:
        type: string
      name:
        type: string
      role:
        description: system | user | assistant | tool
        type: string
      tool_call_id:
        description: Tool result sent by the caller in a follow-up request.
        type: string
      tool_calls:
        description: Tool calls produced by the assistant (finish_reason == "tool_calls").
        items:
          $ref: '#/definitions/domain_agentcompat.ToolCall'
        type: array
    type: object
  domain_agentcompat.Choice:
    properties:
      finish_reason:
        description: '"stop" | "tool_calls" | "length"'
        type: string
      index:
        type: integer
      message:
        $ref: '#/definitions/domain_agentcompat.ChatMessage'
    type: object
  domain_agentcompat.ClientToolDef:
    properties:
      function:
        $ref: '#/definitions/domain_agentcompat.FunctionDef'
      type:
        description: '"function"'
        type: string
    type: object
  domain_agentcompat.FunctionCall:
    properties:
      arguments:
        description: JSON string
        type: string
      name:
        type: string
    type: object
  domain_agentcompat.FunctionDef:
    properties:
      description:
        type: string
      name:
        type: string
      parameters:
        description: JSON Schema object
        items:
          type: integer
        type: array
      strict:
        type: boolean
    type: object
  domain_agentcompat.Model:
    properties:
      created:
        description: unix seconds (agent createdAt)
        type: integer
      id:
        description: '"agent:<name>"'
        type: string
      object:
        description: '"model"'
        type: string
      owned_by:
        type: string
    type: object
  domain_agentcompat.ModelList:
    properties:
      data:
        items:
          $ref: '#/definitions/domain_agentcompat.Model'
        type: array
      object:
        description: '"list"'
        type: string
    type: object
  domain_agentcompat.ResponseFormat:
    properties:
      json_schema:
        description: when type=="json_schema"
        items:
          type: integer
        type: array
      type:
        description: '"text" | "json_object" | "json_schema"'
        type: string
    type: object
  domain_agentcompat.StreamOptions:
    properties:
      include_usage:
        type: boolean
    type: object
  domain_agentcompat.ToolCall:
    properties:
      function:
        $ref: '#/definitions/domain_agentcompat.FunctionCall'
