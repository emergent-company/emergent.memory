          parentSpanId (empty on the root span).
        items:
          $ref: '#/definitions/domain_agents.RunTraceSpan'
        type: array
      startedAt:
        type: string
      status:
        $ref: '#/definitions/domain_agents.AgentRunStatus'
      stepCount:
        type: integer
      summary:
        additionalProperties: {}
        type: object
      tokenUsage:
        allOf:
        - $ref: '#/definitions/domain_agents.RunTokenUsage'
        description: Token usage aggregated from kb.llm_usage_events for this run.
      tools:
        items:
          type: string
        type: array
      traceId:
        description: Observability linkage
        type: string
      triggerMetadata:
        additionalProperties: {}
        description: TriggerMetadata is the structured metadata passed at trigger
          time (e.g. title, context).
        type: object
      workspace:
        allOf:
        - $ref: '#/definitions/domain_agents.RunWorkspaceDTO'
        description: Workspace/sandbox details for this run (when applicable).
    type: object
  domain_agents.AgentRunStatus:
    enum:
