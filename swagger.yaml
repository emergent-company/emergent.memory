          description: Invalid request
          schema:
            $ref: '#/definitions/github_com_emergent-company_emergent_memory_pkg_apperror.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_emergent-company_emergent_memory_pkg_apperror.Error'
      security:
      - bearerAuth: []
      summary: Upsert graph relationship
      tags:
      - graph
