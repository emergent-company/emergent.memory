host: localhost:5300
info:
  contact:
    email: support@emergent-company.ai
    name: Memory Team
    url: https://emergent-company.ai
  description: Memory Knowledge Base API - AI-powered knowledge management system
  license:
    name: Proprietary
  title: Memory API
  version: 0.80.0
paths:
  /.well-known/oauth-protected-resource:
    get:
      description: Returns OAuth 2.0 Protected Resource Metadata per RFC 9728. Signals
        that the MCP server accepts bearer token authentication without an OAuth authorization
        flow.
      produces:
      - application/json
      responses:
        "200":
          description: Protected resource metadata
          schema:
            additionalProperties: true
            type: object
      summary: OAuth Protected Resource Metadata
      tags:
      - mcp
  /acp/v1/agents/{name}/runs/{runId}/events:
    get:
      description: 'Returns all persisted ACP SSE events for an agent run: run lifecycle
        events (run.created, run.in-progress, run.completed, run.failed), trajectory
        events (tool calls with full input/output, thought chunks), and message parts.
        Useful for reconstructing what the agent did step-by-step or replaying a run.
        This endpoint also serves as the resource-server URL referenced in session
        history.'
      parameters:
      - description: ACP slug name of the agent
        in: path
        name: name
        required: true
        type: string
      - description: UUID of the agent run
        in: path
        name: runId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain_agents.ACPSSEEvent'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_emergent-company_emergent_memory_pkg_apperror.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_emergent-company_emergent_memory_pkg_apperror.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_emergent-company_emergent_memory_pkg_apperror.Error'
      security:
      - bearerAuth: []
      summary: Get run event log
      tags:
      - acp
  /acp/v1/sessions:
    get:
      description: Returns a list of all ACP sessions for the project, ordered by
        creation time descending.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain_agents.ACPSessionObject'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_emergent-company_emergent_memory_pkg_apperror.Error'
      security:
      - bearerAuth: []
      summary: List ACP sessions
      tags:
      - acp
  /acp/v1/sessions/{sessionId}:
    get:
      description: Returns an ACP session descriptor. The `history` field contains
        an ordered list of URL references (one per run) pointing to GET /acp/v1/agents/:name/runs/:runId/events.
        Clients fetch each URL to reconstruct full message history for that run. MP
        acts as both ACP server and resource server — history URLs resolve back to
        this server.
      parameters:
      - description: ACP session ID
        in: path
        name: sessionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain_agents.ACPSessionObject'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_emergent-company_emergent_memory_pkg_apperror.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_emergent-company_emergent_memory_pkg_apperror.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_emergent-company_emergent_memory_pkg_apperror.Error'
      security:
      - bearerAuth: []
      summary: Get ACP session
      tags:
      - acp
  /acp/v1/sessions/{sessionId}/archive:
    patch:
      parameters:
      - description: Session ID
        in: path
        name: sessionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain_agents.ACPSessionObject'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_emergent-company_emergent_memory_pkg_apperror.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_emergent-company_emergent_memory_pkg_apperror.Error'
      summary: Archive a session
      tags:
      - ACP Sessions
  /acp/v1/sessions/{sessionId}/unarchive:
    patch:
      parameters:
      - description: Session ID
        in: path
        name: sessionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain_agents.ACPSessionObject'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_emergent-company_emergent_memory_pkg_apperror.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_emergent-company_emergent_memory_pkg_apperror.Error'
      summary: Unarchive a session
      tags:
      - ACP Sessions
