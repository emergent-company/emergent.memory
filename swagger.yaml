    - working
    - completed
    - skipped
    - failed
    - input-required
    - cancelled
    - cancelling
    type: string
    x-enum-comments:
      RunStatusCancelling: 'ACP two-step cancel: intent acknowledged, awaiting execution
        stop'
      RunStatusQueued: enqueued, waiting for a worker
    x-enum-descriptions:
    - enqueued, waiting for a worker
    - ""
    - ""
    - ""
    - ""
    - ""
    - ""
