[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emergent-memory"
version = "0.2.0"
description = "Python SDK for the Emergent Memory API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["emergent", "memory", "knowledge-graph", "ai", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "mypy==2.4.0",
    "ruff==0.17.1",
]

[tool.hatch.build.targets.wheel]
packages = ["emergent"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pin the rule selection explicitly. Ruff's floating default set changed over
# time, which is how pyupgrade suggestions (Dict -> dict, Optional -> | None)
# started failing a job that had been green. New rules are adopted on purpose,
# not because a dependency resolved differently in CI.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
# `httpx.Response.json()` returns `Any`, so every method that returns a decoded
# payload would need a cast to satisfy strict `warn_return_any`. The payloads
# are genuinely untyped, and a hundred casts would not add type safety; every
# other strict check remains enabled.
warn_return_any = false

[[tool.mypy.overrides]]
module = ["tests.*"]
# pytest fixtures are injected by parameter name; spelling out every fixture
# type would add noise without catching real defects.
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["emergent"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
# Ratchet: the suite covers the transport, auth, client wiring, SSE parser and
# the projects/search/chat sub-clients. Raise this as sub-client coverage grows;
# it must never be lowered to make a red job green.
fail_under = 50
