name: Mac Release

# Stable channel: tag vX.Y.Z → sign + notarize + DMG, upload to shared release.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build, sign, notarize, package
    runs-on: macos-14
    env:
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
      NOTARIZE_APPLE_ID: ${{ secrets.NOTARIZE_APPLE_ID }}
      NOTARIZE_PASSWORD: ${{ secrets.NOTARIZE_PASSWORD }}
      NOTARIZE_TEAM_ID: ${{ secrets.NOTARIZE_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew list xcodegen &>/dev/null || brew install xcodegen
          brew list create-dmg &>/dev/null || brew install create-dmg

      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "temp-keychain-password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "temp-keychain-password" "$KEYCHAIN_PATH"
          echo "$CERTIFICATE_BASE64" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Build, sign, notarize, package
        working-directory: apps/connector.mac
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          chmod +x Scripts/build-dmg.sh
          ./Scripts/build-dmg.sh --notarize

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: memory-mac-dmg
          path: apps/connector.mac/build/Memory-*.dmg
          retention-days: 7

  release:
    name: Publish to shared release
    runs-on: ubuntu-latest
    needs: build
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download DMG
        uses: actions/download-artifact@v4
        with:
          name: memory-mac-dmg
          path: release-assets

      - name: Publish to release
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" --verify-tag \
            --title "Memory ${{ github.ref_name }}" --generate-notes || true
          gh release upload "${{ github.ref_name }}" release-assets/* --clobber
