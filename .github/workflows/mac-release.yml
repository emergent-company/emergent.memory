name: Mac Release

# Stable channel: tag vX.Y.Z → sign + notarize + DMG, upload to shared release.
# Skipped entirely when apps/connector.mac/** is unchanged since the last tag —
# notarization is the ~10min bottleneck and can't be re-aliased.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force build even if unchanged'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    name: Check if changed
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.c.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diff since last tag
        id: c
        shell: bash
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREV" ] && ! git diff --name-only "$PREV" HEAD -- apps/connector.mac/ | grep -q .; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build, sign, notarize, package
    runs-on: macos-14
    needs: check
    if: needs.check.outputs.changed == 'true'
    env:
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
      NOTARIZE_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      NOTARIZE_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | head -1)
          if [ -n "$XCODE" ]; then
            sudo xcode-select -s "$XCODE"
            xcodebuild -version
          else
            echo "No Xcode 16 found; available:"; ls -d /Applications/Xcode*.app
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: apps/connector.linux/go.sum

      - name: Install tools
        run: |
          brew list xcodegen &>/dev/null || brew install xcodegen
          brew list create-dmg &>/dev/null || brew install create-dmg

      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "temp-keychain-password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "temp-keychain-password" "$KEYCHAIN_PATH"
          echo "$CERTIFICATE_BASE64" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Write App Store Connect API key
        run: |
          mkdir -p /tmp/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY }}" > /tmp/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          chmod 600 /tmp/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Derive version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build, sign, notarize, package
        working-directory: apps/connector.mac
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NOTARIZE_KEY: /tmp/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
        run: |
          chmod +x Scripts/build-dmg.sh
          ./Scripts/build-dmg.sh --notarize

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: memory-mac-dmg
          path: apps/connector.mac/build/Memory-*.dmg
          retention-days: 7

  release:
    name: Publish to shared release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download DMG
        uses: actions/download-artifact@v4
        with:
          name: memory-mac-dmg
          path: release-assets

      - name: Publish to release
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" --verify-tag \
            --title "Memory ${{ github.ref_name }}" --generate-notes || true
          gh release upload "${{ github.ref_name }}" release-assets/* --clobber
