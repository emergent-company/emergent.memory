name: Mac Release

# Stable channel: tag vX.Y.Z → sign + notarize + DMG, upload to shared release.
# Skipped entirely when apps/connector.mac/** is unchanged since the last tag —
# notarization is the ~10min bottleneck and can't be re-aliased.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force build even if unchanged'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    name: Check if changed
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.c.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diff since last tag
        id: c
        shell: bash
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREV" ] && ! git diff --name-only "$PREV" HEAD -- apps/connector.mac/ | grep -q .; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build, sign, notarize, package
    runs-on: [self-hosted, macOS, ARM64, mac]
    needs: check
    if: needs.check.outputs.changed == 'true'
    env:
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
      NOTARIZE_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      NOTARIZE_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (project format 77 requires Xcode 16+)
        run: |
          XCODE=$(ls -d /Applications/Xcode.app 2>/dev/null || ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode found in /Applications"
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
          echo "Selecting $XCODE"
          sudo -n xcode-select -s "$XCODE" 2>/dev/null || true
          xcodebuild -version
          MAJOR=$(xcodebuild -version | awk 'NR==1 {split($2,v,"."); print v[1]}')
          if [ -z "$MAJOR" ] || [ "$MAJOR" -lt 16 ]; then
            echo "::error::Xcode 16 or newer is required (project format 77); selected $XCODE"
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: apps/connector.linux/go.sum

      - name: Install tools
        run: |
          brew list xcodegen &>/dev/null || brew install xcodegen
          brew list create-dmg &>/dev/null || brew install create-dmg

      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "temp-keychain-password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "temp-keychain-password" "$KEYCHAIN_PATH"
          echo "$CERTIFICATE_BASE64" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Write App Store Connect API key
        run: |
          mkdir -p /tmp/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY }}" > /tmp/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          chmod 600 /tmp/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Derive version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW="${{ github.ref_name }}"
          else
            # Parseable X.Y.Z fallback for forced workflow_dispatch builds
            # (build-dmg.sh requires a semver it can encode monotonically).
            RAW="0.0.0"
          fi
          echo "version=$RAW" >> "$GITHUB_OUTPUT"
          # Marketing version = semver without the leading 'v' (matches the DMG
          # filename and CFBundleShortVersionString in build-dmg.sh).
          echo "marketing=${RAW#v}" >> "$GITHUB_OUTPUT"

      - name: Build, sign, notarize, package
        working-directory: apps/connector.mac
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NOTARIZE_KEY: /tmp/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
        run: |
          chmod +x Scripts/build-dmg.sh
          ./Scripts/build-dmg.sh --notarize

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: memory-mac-dmg
          path: apps/connector.mac/build/Memory-*.dmg
          retention-days: 7

      - name: Generate Sparkle appcast
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: apps/connector.mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # Sparkle CLI tools live in the SwiftPM artifacts dir of DerivedData;
          # the DerivedData hash is not stable, so locate them dynamically.
          GENERATE_APPCAST="$(find build/DerivedData -type f -path '*/artifacts/sparkle/Sparkle/bin/generate_appcast' 2>/dev/null | head -n 1 || true)"
          if [ -z "$GENERATE_APPCAST" ]; then
            echo "::error::generate_appcast not found under build/DerivedData"
            exit 1
          fi
          echo "Using generate_appcast: $GENERATE_APPCAST"

          UPDATES_DIR="build/appcast"
          mkdir -p "$UPDATES_DIR"

          # Download previously published archives from the rolling feed release.
          # --skip-existing keeps already-cached DMGs; `|| true` because the
          # first release has no memory-appcast release yet.
          gh release download memory-appcast \
            -p '*.dmg' -p '*.delta' -p 'appcast.xml' \
            -D "$UPDATES_DIR" --skip-existing || true

          # Copy the freshly built (and stapled) DMG into the feed directory.
          DMG="build/Memory-${{ steps.version.outputs.marketing }}.dmg"
          cp "$DMG" "$UPDATES_DIR/"

          # Monotonicity guard: the new CFBundleVersion must be strictly greater
          # than the largest sparkle:version already published. generate_appcast
          # orders updates by sparkle:version, so a non-increasing value would
          # silently reorder the feed and break update detection.
          NEW_VERSION="$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "build/Export/Memory.app/Contents/Info.plist")"
          PREV_APPCAST="$UPDATES_DIR/appcast.xml"
          if [ -f "$PREV_APPCAST" ]; then
            PREV_VERSION="$(grep -o '<sparkle:version>[0-9]*</sparkle:version>' "$PREV_APPCAST" | grep -o '[0-9]*' | sort -n | tail -n 1 || true)"
            if [ -n "$PREV_VERSION" ] && [ "$NEW_VERSION" -le "$PREV_VERSION" ]; then
              echo "::error::CFBundleVersion $NEW_VERSION is not greater than previously published $PREV_VERSION"
              exit 1
            fi
          fi

          # Generate the appcast. The EdDSA private key (base64 of the 32-byte
          # seed) is piped to stdin and must never be echoed. Deltas (if any)
          # are emitted alongside appcast.xml by generate_appcast.
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$GENERATE_APPCAST" \
            --download-url-prefix "https://github.com/emergent-company/emergent.memory/releases/download/memory-appcast/" \
            --ed-key-file - \
            "$UPDATES_DIR"

          echo "Appcast generated at $UPDATES_DIR/appcast.xml"

      - name: Publish Sparkle appcast
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: apps/connector.mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view memory-appcast || gh release create memory-appcast \
            --title "Mac update feed" \
            --notes "Rolling Sparkle feed"
          shopt -s nullglob
          ASSETS=(build/appcast/appcast.xml build/appcast/Memory-*.dmg build/appcast/*.delta)
          gh release upload memory-appcast "${ASSETS[@]}" --clobber

  release:
    name: Publish to shared release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download DMG
        uses: actions/download-artifact@v4
        with:
          name: memory-mac-dmg
          path: release-assets

      - name: Publish to release
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" --verify-tag \
            --title "Memory ${{ github.ref_name }}" --generate-notes || true
          gh release upload "${{ github.ref_name }}" release-assets/* --clobber
