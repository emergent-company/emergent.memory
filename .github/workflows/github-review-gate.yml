name: GitHub review gate

# The bridge between a review-marker comment and the merge guard.
#
# The review agent posts a conversation comment:
#
#     Reviewed-SHA: <40-hex head>
#     Verdict: MERGE | CHANGES_REQUESTED
#
# A review comment cannot re-run `merge-guard` (it triggers on
# `pull_request_target` push/reopen events), and the merge wrapper reads issue
# comments, so this workflow is the only thing that reacts to one.
#
# The two directions are deliberately asymmetric:
#
#   * ARMING is bot-only. `REVIEW_BOT_LOGINS` (repository variable, comma/space
#     separated; the legacy singular `REVIEW_BOT_LOGIN` is read when the list is
#     unset) names the review App. Arming on a human's marker would skip the
#     check list and the marker gate that `scripts/merge-reviewed-pr.sh` applies,
#     so a human MERGE marker is ignored here -- run the wrapper instead.
#
#   * DENYING is honoured from any trusted identity. A rejection grants nothing,
#     which is why the "never trust a human commenter" rule does not apply to it;
#     and the old author filter that ignored every non-bot comment was the hole
#     in #1385 -- product #1036 merged 2m12s after a trusted
#     `CHANGES_REQUESTED` on the same head. Trusted means
#     `author_association` `OWNER`/`COLLABORATOR`, or an immutable user id in
#     `MERGE_GUARD_TRUSTED_USER_IDS` (`MEMBER` alone is org membership, which in
#     these repos is what repository admins also report). Never add a review
#     App's bot id to that list: the allowlist is human identities only, and the
#     policy is that a `Bot` never satisfies it whatever the variable holds
#     (#1290, #1310).
#
# Whether an armed merge can actually land is decided by the required checks
# (`reviewed`, published by the review App; plus `ci`). A bot marker can arm the
# wait; a rejection disarms it here and re-evaluates the guard, which is the
# backstop the gate was missing.
#
# The decision logic lives in `.github/scripts/review-gate.sh` (with
# `review-gate.test.sh`), so the trust rule is a reviewed file rather than a
# `run:` block no test can reach.
on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  gate:
    name: Review gate
    if: ${{ github.event.issue.pull_request != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          # The gate runs reviewed code only: the default branch, never the PR
          # head. `dispatch-release-tag.sh` reads VERSION from this tree.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Arm or disarm from the marker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          BODY: ${{ github.event.comment.body }}
          AUTHOR: ${{ github.event.comment.user.login }}
          AUTHOR_ASSOC: ${{ github.event.comment.author_association }}
          AUTHOR_ID: ${{ github.event.comment.user.id }}
          BOT_LOGINS: ${{ vars.REVIEW_BOT_LOGINS }}
          BOT_LOGIN_LEGACY: ${{ vars.REVIEW_BOT_LOGIN }}
          TRUSTED_IDS: ${{ vars.MERGE_GUARD_TRUSTED_USER_IDS }}
        run: bash .github/scripts/review-gate.sh
