name: Web UI mutations e2e

# Runs the `mutations` Playwright project (every `*-ui.spec.ts` — org/project/
# provider/agent/skill/schedule/token/object/board/document/backup mutations)
# against the persistent dev installation (session-mode gateway + dev Zitadel +
# dev memory). Like the live-LLM scenarios, these specs need the real gateway in
# session mode plus a Zitadel test user, so they are deliberately NOT part of any
# PR gate: they run on the self-hosted `memory` runner via a scheduled +
# manually-dispatchable workflow, and can NEVER gate a PR (no `pull_request`
# trigger, not part of the branch-protection-required `ci` aggregate).
#
# This closes the gap in #1857: until this workflow existed, every `*-ui.spec.ts`
# was authored but never executed anywhere — the PR CI only ever invoked the
# hermetic `js-dom.config.ts` and `datasources.config.ts` projects.
#
# Required repo secrets (same as web-ui-llm-scenarios.yml — no new secrets):
#   E2E_TEST_USER_EMAIL / E2E_TEST_USER_PASSWORD — the Zitadel test user (no MFA)
#     that the `setup` dependency signs in as. `helpers/auth.ts` HARD-FAILS (not
#     skips) when either is unset, so a missing secret degrades to a red run, never
#     a silently-green one.
#
# The specs self-clean (created orgs/projects/objects/board items are removed in
# `afterAll`/`afterEach`), so a run leaves no residue in the shared "E2E Main"
# tenant beyond the reusable bootstrap org/project.
on:
  schedule:
    # 08:43 UTC daily — an hour after the live-LLM chat suite (07:43 UTC), and
    # off the :00/:15 mark to avoid runner congestion. Both suites reuse the
    # same "E2E Main" tenant, so they share a concurrency group below.
    - cron: '43 8 * * *'
  workflow_dispatch:

# Serialize against the live-LLM chat workflow and any concurrent manual run.
# `setup` reuses the stable "E2E Main" tenant, so two session-mode suites running
# at once would race each other on the same org/project. Shared literal group
# (not `${{ github.workflow }}`) so this workflow and web-ui-llm-scenarios.yml
# serialize against each other; never cancel an in-flight run.
concurrency:
  group: web-ui-session-e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mutations:
    name: UI mutations e2e
    runs-on: [self-hosted, linux, x64, memory]
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/web-ui/tests/e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # No `cache:` — see web-ui.yml; setup-node's cache step can red the
          # job before any step runs (#1758), and `npm ci` installs deps
          # regardless.

      - name: Install e2e deps
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('apps/web-ui/tests/e2e/package-lock.json') }}

      - name: Install Playwright Chromium
        # The `memory` self-hosted runner is Arch Linux (mcj-one): it has no
        # apt-get, but the Chromium runtime libs and browser cache are already
        # installed on the host, so `--with-deps` (which shells out to apt)
        # must be skipped there. Keep the dependency install on Debian runners.
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi

      - name: Run UI mutations specs
        env:
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
        # `--project=mutations` runs `setup` (login + tenant bootstrap) as its
        # dependency, then the serial `*-ui.spec.ts` project. The gateway is
        # expected to already be running in session mode on the dev host (same
        # precondition as the live-LLM workflow — see tests/e2e/README.md).
        run: npx playwright test --config=playwright.config.ts --project=mutations
