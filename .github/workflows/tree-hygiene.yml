name: Tree hygiene

# Cheap, always-applicable gate: grep every tracked file for internal hostnames
# and private-repo references and fail with the offending file:line list. Runs
# on every PR and every push to main with no `paths:` filter — a leak can be
# introduced in any file, and the scan costs almost nothing.
#
# Legitimate references that must stay (the preview dispatch workflow and the
# README owned by a parallel lane) are allowlisted in
# .github/tree-hygiene-allowlist.txt. Existing internal dev-host references that
# predate this gate are grandfathered in .github/tree-hygiene-baseline.txt as a
# ratchet — that file may shrink, never grow. The gate never fails on its own
# file, the allowlist, or the baseline.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tree-hygiene:
    name: Scan for internal hostnames
    # Self-hosted (#184): pure bash/grep over tracked files — no toolchain and no
    # secrets. Fork guard keeps PR-controlled workflow/script content off the
    # persistent runner; it is not a required check (branch protection requires
    # only `ci` and `merge-guard`), so a skip on fork PRs blocks nothing.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, memory]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan tracked files
        shell: bash
        run: |
          set -euo pipefail
          ALLOWLIST=".github/tree-hygiene-allowlist.txt"
          BASELINE=".github/tree-hygiene-baseline.txt"
          ALWAYS_EXEMPT=(".github/workflows/tree-hygiene.yml" "$ALLOWLIST" "$BASELINE")

          exempt() {
            local path="$1" p
            for p in "${ALWAYS_EXEMPT[@]}"; do
              [[ "$path" == "$p" ]] && return 0
            done
            # Allowlist = legitimate permanent references. Baseline = pre-existing
            # internal dev-host debt, a ratchet: entries may be removed, never added.
            while IFS= read -r line || [[ -n "$line" ]]; do
              [[ -z "$line" || "$line" == \#* ]] && continue
              p="${line%%#*}"        # drop inline comment
              p="${p//[[:space:]]/}" # drop surrounding whitespace
              p="${p%/}"             # accept a directory prefix with or without a trailing slash
              [[ -z "$p" ]] && continue
              if [[ "$path" == "$p" || "$path" == "$p"/* ]]; then
                return 0
              fi
            done < <(cat "$ALLOWLIST" "$BASELINE" 2>/dev/null || true)
            return 1
          }

          # Raw dev tailnet IPs are not hostnames, so they need their own
          # alternatives. The 100.64.0.0/10 range appears legitimately in SSRF
          # guards/tests; match the specific leaked hosts, not the whole range.
          #
          # Coverage:
          #   - tailnet names / public DNS of our own hosts (.ts.net, dev.emergent-company.ai)
          #   - rig, dev, prod and Mac build host names (`memory-hetzner` = prod,
          #     `memory-dev` = dev) and their addresses
          #   - the agent-rig filesystem layout (~/.paseo, /Users/mcj, and rig checkouts
          #     under /root: emergent, blueprints, workspace-memory, doc-processing, files-memory)
          #   - private repo names that must never be named from the product repo
          #   - a tenant name that leaked once and must not come back
          raw="$(git grep -n -I -E '\.ts\.net\b|emergent-dev|10\.10\.10\.|100\.69\.175\.118|100\.91\.139\.28|emergent\.memory\.infra|\.dev\.emergent-company\.ai|memory-home|memory-hetzner|\bmemory-dev\b|\bmemory-prod\b|mcj-mini|mcj-one|/Users/mcj|\bmcj@|Mac\.banglab|\bbanglab\b|100\.118\.32\.29|100\.119\.120\.71|100\.121\.213\.124|100\.84\.125\.23|100\.67\.61\.62|95\.216\.38\.217|195\.201\.196\.144|46\.4\.253\.156|emergent\.memory\.mac|emergent\.memory\.website|emergent\.memory-archive|/root/(emergent|blueprints|workspace-memory|doc-processing|files-memory)|/opt/emergent-dev|\.paseo/|legalplant' -- . 2>/dev/null || true)"

          violations=""
          while IFS= read -r hit; do
            [[ -z "$hit" ]] && continue
            path="${hit%%:*}"
            if exempt "$path"; then
              continue
            fi
            violations+="${hit}"$'\n'
          done <<< "$raw"

          if [[ -n "$violations" ]]; then
            echo "::error::Internal hostnames / private-repo references found in tracked files:"
            printf '%s' "$violations"
            exit 1
          fi
          echo "Tree hygiene OK — no internal hostnames / private-repo references in tracked files."
