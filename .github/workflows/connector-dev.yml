name: Connector Dev

# Dev channel: push to main touching apps/connector.linux/** → rolling prerelease
# under the fixed tag `dev`, overwritten each build.

on:
  push:
    branches: [master, main]
    paths:
      - 'apps/connector.linux/**'
      - '.github/workflows/connector-dev.yml'
      - 'scripts/gen-manifest.sh'

permissions:
  contents: write

concurrency:
  group: connector-dev
  cancel-in-progress: true

env:
  GO_VERSION: '1.26'

jobs:
  version:
    name: Derive version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Derive
        id: v
        shell: bash
        run: echo "version=0.0.0-dev.$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/connector.linux/go.sum
      - name: Build binary
        working-directory: apps/connector.linux
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ needs.version.outputs.version }}" \
            -o dist/memory-connector ./cmd/memory-connector
      - name: Package archive
        working-directory: apps/connector.linux
        shell: bash
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          NAME="memory-connector_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          tar -C dist -czf "${NAME}.tar.gz" memory-connector
          sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: memory-connector-dev-${{ matrix.goos }}-${{ matrix.goarch }}
          path: apps/connector.linux/*.tar.gz*
          retention-days: 7

  release:
    name: Publish rolling dev release
    runs-on: ubuntu-latest
    needs: build
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: memory-connector-dev-*
          path: release-assets
          merge-multiple: true
      - name: Generate manifest
        shell: bash
        run: |
          cat release-assets/*.sha256 > release-assets/checksums.txt
          scripts/gen-manifest.sh memory-connector dev release-assets \
            "${{ github.repository }}" dev "${{ needs.version.outputs.version }}"
      - name: Publish rolling dev release
        shell: bash
        run: |
          gh release delete dev --cleanup-tag -y || true
          gh release create dev release-assets/* \
            --prerelease \
            --title "memory-connector dev (rolling)" \
            --notes "Rolling dev build. Commit: ${GITHUB_SHA}"
