name: Publish raw files to gh-pages

# `gh-pages` carries no documentation site — the docs are the Astro build in
# `docs-astro/`, served from docs.memory.emergent-company.ai. What it does carry
# is the set of files consumers fetch directly from the branch root: the API spec
# (the docs site's API reference reads `swagger.json`), the `llms*.md` entry
# points, the redirect pages in `deploy/gh-pages/`, and the Sparkle appcast that
# mac-release.yml / mac-dev.yml publish separately.
#
# This is deliberately its own workflow and not a job in docs.yml: it has to run
# when the API changes, which has nothing to do with authoring a page, and it
# must not pay for the Astro build (`npm ci`) to do it. Before the MkDocs site
# was retired the spec was refreshed by the tag-triggered docs deploy, so
# dropping that trigger without this would have frozen the published reference
# at the last docs edit.
#
# Dispatch only for the hand-run case; nothing about a merge makes this run.
on:
  push:
    branches:
      - main
    paths:
      - 'apps/server/**'
      - 'docs/llms*.md'
      - 'deploy/gh-pages/**'
      # The generated spec, its generator wiring (#270 — the spec is build
      # output, never committed) and the push helper.
      - '.github/actions/generate-openapi/**'
      - '.github/scripts/push-gh-pages-with-retry.sh'
      # Self-change so a change here is exercised by its own merge.
      - '.github/workflows/publish-gh-pages-raw.yml'
  workflow_dispatch:

concurrency:
  # Shared with docs.yml and mac-release.yml / mac-dev.yml: every publisher
  # pushes the same branch, and GitHub serializes the runs in one group.
  # cancel-in-progress: false so a release publish is never cancelled by a
  # spec refresh.
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  publish:
    name: Publish spec and raw files
    runs-on: [self-hosted, linux, x64, memory]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The OpenAPI spec is generated, not committed (#270); it is copied to
      # gh-pages below, so it must exist in the checkout first.
      - uses: ./.github/actions/generate-openapi

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync root-level files to gh-pages
        run: |
          # Publish from a LINKED WORKTREE instead of `git checkout gh-pages`
          # in this one (#464). Checking gh-pages out here deleted `.github/`
          # from the workspace, so the runner's post-step for the local
          # `./.github/actions/generate-openapi` action failed with
          # "Can't find 'action.yml'" on every release — a red check on a deploy
          # that had already succeeded. Ordering alone cannot fix it: a
          # composite action's post-step always runs at job end, after any
          # mutation. So do not mutate the primary checkout at all; the local
          # action stays resolvable and the deploy is the only thing that
          # changes.
          set -euo pipefail
          git fetch origin gh-pages
          publish_dir="$(mktemp -d "$RUNNER_TEMP/gh-pages.XXXXXX")"
          # FETCH_HEAD, not origin/gh-pages: actions/checkout installs its own
          # (single-ref) fetch refspec, so only the command-line fetch result is
          # guaranteed to be here. --detach keeps this worktree off any branch
          # name, so two jobs can never contend for one.
          git worktree add --detach "$publish_dir" FETCH_HEAD
          cp apps/server/docs/swagger/swagger.json "$publish_dir/swagger.json"
          cp apps/server/docs/swagger/swagger.yaml "$publish_dir/swagger.yaml"
          cp apps/server/docs/swagger/swagger.json "$publish_dir/openapi.json"
          cp docs/llms.md "$publish_dir/llms.md"
          cp docs/llms-go-sdk.md "$publish_dir/llms-go-sdk.md"
          cp docs/llms-python-sdk.md "$publish_dir/llms-python-sdk.md"
          # The old site's home page and its 404 both redirect to the docs host
          # (see deploy/gh-pages/README.md). They live in the repo so a wipe of
          # the branch does not silently un-redirect old links.
          cp deploy/gh-pages/index.html "$publish_dir/index.html"
          cp deploy/gh-pages/404.html "$publish_dir/404.html"
          git -C "$publish_dir" add swagger.json swagger.yaml openapi.json \
            llms.md llms-go-sdk.md llms-python-sdk.md index.html 404.html
          git -C "$publish_dir" diff --cached --quiet || git -C "$publish_dir" commit -m "docs: sync root-level raw files [skip ci]"
          # Pull-rebase-and-retry, matching publish-appcast.sh: the appcast
          # publisher pushes the same branch and may land first. The helper runs
          # in the worktree and is read from this checkout, which is never
          # switched to gh-pages.
          ( cd "$publish_dir" && bash "$GITHUB_WORKSPACE/.github/scripts/push-gh-pages-with-retry.sh" )
          git worktree remove --force "$publish_dir"
          # The invariant this step exists to keep: the local action the runner
          # resolves its post-step against is still present in this workspace.
          # A checkout that mutates the tree again fails here instead of at the
          # end of the job, where it reads as a deploy failure (#464).
          test -f .github/actions/generate-openapi/action.yml
