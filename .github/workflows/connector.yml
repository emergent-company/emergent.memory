name: Connector CI

# `apps/connector.linux` was built by connector-dev / connector-release but
# linted nowhere in CI, and `apps/connector.mac` (Swift) had no lint coverage at
# all. This workflow supplies both. It is path-filtered like the other app
# workflows (server.yml, cli.yml, web-ui.yml); branch protection's required `ci`
# context is still emitted by the repo-root ci.yml for every PR, and this
# workflow adds a stricter `ci` gate for connector changes.
#
# Lint runs on ubuntu using the Linux release binaries — no macOS runner is
# needed for it. Both tools ratchet to the changed files (see
# apps/connector.mac/Scripts/lint-swift.sh) so pre-existing Swift debt does not
# fail the job, while new drift does.
#
# `mac-build` is the only job that actually compiles the Swift app. Before it
# existed, every job on `apps/connector.mac` was format/lint only, so a type
# error, an API newer than the deployment target, or a broken actor-isolation
# change merged green. It uses the macOS runner label already
# serving mac-release.yml and ios-test.yml, so it needs no new runner. It builds
# for testing (`build-for-testing`) so the unit/UI test sources are compiled too;
# running the suites stays manual (`task connector-mac:test`).

on:
  push:
    branches: [main]
    paths:
      - 'apps/connector.linux/**'
      - 'apps/connector.mac/**'
      # The app embeds the connector engine, built from apps/connector.linux
      # through the repo go.work and the apps/server/pkg/sdk module.
      - 'apps/server/pkg/sdk/**'
      - 'go.work'
      - 'go.work.sum'
      - '.github/workflows/connector.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/connector.linux/**'
      - 'apps/connector.mac/**'
      # The app embeds the connector engine, built from apps/connector.linux
      # through the repo go.work and the apps/server/pkg/sdk module.
      - 'apps/server/pkg/sdk/**'
      - 'go.work'
      - 'go.work.sum'
      - '.github/workflows/connector.yml'
  workflow_dispatch:

# Cancel superseded PR runs; never cancel a default-branch run (a merge to main
# should always finish and report its status).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: '1.26'
  SWIFTLINT_VERSION: '0.65.1'
  SWIFTFORMAT_VERSION: '0.63.0'

jobs:
  linux-lint:
    name: Linux connector lint
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, memory]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # The memory runners are persistent: GOCACHE/GOMODCACHE live on local
          # disk between jobs, so the built-in Actions cache only adds multi-GB
          # uploads that blow the 10 GB repo budget (see runner-cache-hygiene.yml).
          cache: false

      - name: gofmt
        working-directory: apps/connector.linux
        run: |
          files=$(git ls-files '*.go' | xargs gofmt -l)
          if [ -n "$files" ]; then
            echo "gofmt: the following tracked files need formatting:"
            echo "$files"
            exit 1
          fi

      - name: go vet
        working-directory: apps/connector.linux
        run: go vet ./...

      - name: go build
        working-directory: apps/connector.linux
        run: go build ./...

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: golangci-lint
        working-directory: apps/connector.linux
        env:
          GOLANGCI_LINT_CACHE: ${{ runner.temp }}/golangci-lint-cache
        run: golangci-lint run --allow-parallel-runners ./...

  mac-lint:
    name: Mac connector lint
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, memory]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need the merge base with the PR/push base to ratchet to changed files.
          fetch-depth: 0

      - name: Install Swift linters
        run: |
          curl -sSL -o "$RUNNER_TEMP/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat_linux.zip"
          unzip -q "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat"
          curl -sSL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux_amd64.zip"
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 "$RUNNER_TEMP/swiftformat/swiftformat_linux" "$RUNNER_TEMP/bin/swiftformat"
          # Statically linked SwiftLint: the dynamic build needs Swift's
          # libsourcekitdInProc.so, which is absent on some of the self-hosted
          # linux runners, and it aborts (Illegal instruction) there. The static
          # build is self-contained and runs everywhere — mirrors ios.yml.
          install -m 0755 "$RUNNER_TEMP/swiftlint/swiftlint-static" "$RUNNER_TEMP/bin/swiftlint"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/swiftformat" --version
          "$RUNNER_TEMP/bin/swiftlint" version

      - name: swiftformat + swiftlint (changed files)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: apps/connector.mac/Scripts/lint-swift.sh

  # Compile check for the Swift app. Keep the
  # xcodegen/xcodebuild invocation in step with
  # apps/connector.mac/Scripts/mac-build.sh — same project, scheme, ad-hoc
  # signing and derived-data path. That script drives ssh builds and cannot run
  # on a runner that has no ssh target, so the three settings are mirrored here
  # rather than shelled out to it.
  mac-build:
    name: Mac connector build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, mac]
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        id: xcode
        env:
          # Deliberate, reported selection: ACCEPTED_XCODE_PATH pins a known-good
          # bundle so an App Store auto-update cannot swap the toolchain under a
          # build (infra#621). The script already failed the step if nothing is
          # installed, so there is no empty-value guard to keep here.
          ACCEPTED_XCODE_PATH: ${{ vars.ACCEPTED_XCODE_PATH }}
        run: |
          XCODE=$(.github/scripts/select-xcode.sh)
          sudo -n xcode-select -s "$XCODE" 2>/dev/null || true
          xcodebuild -version
          MAJOR=$(xcodebuild -version | awk 'NR==1 {split($2,v,"."); print v[1]}')
          if [ -z "$MAJOR" ] || [ "$MAJOR" -lt 16 ]; then
            echo "::error::Xcode 16 or newer is required (project format 77); selected $XCODE"
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # The app embeds the connector engine, built by the Xcode pre-build
          # phase (MemoryConnector/Scripts/build-engine.sh -> go build).
          go-version: ${{ env.GO_VERSION }}
          # Persistent runner: the toolchain and module cache survive between
          # jobs, so the Actions cache only adds uploads (see
          # runner-cache-hygiene.yml).
          cache: false

      - name: Install xcodegen
        run: |
          brew list xcodegen &>/dev/null || brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        working-directory: apps/connector.mac/MemoryConnector
        run: xcodegen generate --quiet

      - name: Build app and test bundles (ad-hoc signed)
        # `build-for-testing`, not `build`: the app target does not include
        # MemoryConnectorTests / MemoryConnectorUITests, so a plain build leaves a
        # compile error in those 48 files green. Building the test bundles needs
        # no GUI session (running them does) and adds only a few seconds.
        # No certificate: ad-hoc signing is enough to compile, type-check and
        # link. Release signing/notarization stays in mac-release.yml.
        run: |
          xcodebuild \
            -project "$GITHUB_WORKSPACE/apps/connector.mac/MemoryConnector/MemoryConnector.xcodeproj" \
            -scheme MemoryConnector \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- \
            build-for-testing -quiet

  connector-ci:
    name: connector-ci
    runs-on: [self-hosted, linux, x64, memory]
    # Advisory aggregate gate for this path-filtered workflow. NOT a required
    # status check: the required contexts on main are Meta CI's `ci`
    # (.github/workflows/ci.yml) and `merge-guard`
    # (.github/workflows/merge-guard.yml). Renamed from `ci` to `connector-ci` so
    # it no longer collides with the required `ci` context. always() so the gate
    # still
    # reports when a dependency fails (same pattern as cli.yml).
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: [linux-lint, mac-lint, mac-build]
    steps:
      - name: CI gate
        run: |
          failed=0
          for result in "${{ needs.linux-lint.result }}" "${{ needs.mac-lint.result }}" "${{ needs.mac-build.result }}"; do
            echo "dependency result: ${result}"
            case "${result}" in
              success|skipped) ;;
              *) failed=1 ;;
            esac
          done
          if [ "${failed}" -ne 0 ]; then
            echo "CI gate failed: one or more required jobs did not succeed"
            exit 1
          fi
          echo "CI passed"
