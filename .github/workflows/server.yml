name: Server Go CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/server/**'
      - '.github/workflows/server.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/server/**'
      - '.github/workflows/server.yml'
  workflow_dispatch:

env:
  GO_VERSION: '1.25'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the --new-from-rev ratchet

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/server/go.sum

      - name: golangci-lint (new issues only)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: apps/server
          install-mode: binary
          only-new-issues: true

      - name: Architectural debt ratchet
        working-directory: apps/server
        run: ./scripts/lint-ratchet.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/server/go.sum

      - name: Build
        working-directory: apps/server
        run: go build -o dist/server ./cmd/server

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: server-binary
          path: apps/server/dist/server
          retention-days: 1

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/server/go.sum

      - name: Run unit tests
        working-directory: apps/server
        run: |
          go test -short ./internal/... ./pkg/... ./domain/... -v -count=1 \
            -coverprofile=coverage.out \
            -covermode=atomic

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: apps/server/coverage.out
          flags: server-go-unit
          fail_ci_if_error: false

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, build, test-unit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history for git describe

      - name: Get version info
        id: version
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "build_time=$BUILD_TIME" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/self-hosted/Dockerfile.server
          push: false
          tags: memory-server:${{ github.sha }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ steps.version.outputs.commit }}
            BUILD_TIME=${{ steps.version.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get image size
        run: |
          docker images memory-server:${{ github.sha }} --format "{{.Size}}"

  migration-guard:
    name: Migration Immutability
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject changes to existing migrations
        run: |
          set -euo pipefail
          BASE="origin/${{ github.base_ref }}"
          git fetch --no-tags origin "${{ github.base_ref }}" --depth=1
          CHANGED=$(git diff --name-status --diff-filter=MDRT "$BASE"...HEAD -- 'apps/server/migrations/*.sql' || true)
          if [ -n "$CHANGED" ]; then
            echo "::error::Existing migrations must never be modified, renamed, or deleted."
            echo "Create a NEW migration file instead. Renumbering an already-applied migration"
            echo "causes Goose to silently skip it on environments that recorded the old version."
            echo "$CHANGED"
            exit 1
          fi
          echo "OK: only new migration files added."

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [lint, build, test-unit, migration-guard]
    steps:
      - name: CI gate
        run: echo "CI passed"
