name: Web UI CI

# The gateway (`apps/web-ui`) is a separate Go module living inside the
# repo-root `go.work` workspace. `Server Go CI` (server.yml) is path-filtered to
# `apps/server/**`, so `apps/web-ui`-only pull requests produced no PR CI at all
# and never satisfied the required `ci` status check — branch protection left
# them unmergeable. This workflow supplies that check for web-ui changes.
#
# This workflow is path-filtered to `apps/web-ui/**`, so it is NOT a required
# status check: the branch-protection-required contexts on main are Meta CI's
# `ci` (.github/workflows/ci.yml), which is unfiltered and reports for every PR,
# and `merge-guard` (.github/workflows/merge-guard.yml). This workflow's
# aggregate gate is named `web-ui-ci` (advisory).

on:
  push:
    branches: [main]
    paths:
      - 'apps/web-ui/**'
      - '.github/workflows/web-ui.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web-ui/**'
      - '.github/workflows/web-ui.yml'
  workflow_dispatch:

# Cancel superseded PR runs; never cancel a default-branch run (a merge to main
# should always finish and report its status).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: '1.26'

# Least privilege: PR-controlled source runs on the self-hosted runner only
# behind the fork guard; keep the checkout token read-only as defense-in-depth.
permissions:
  contents: read

jobs:
  gateway:
    name: Gateway
    runs-on: [self-hosted, linux, x64, memory]
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # This job is pinned to runs-on: [self-hosted, linux, x64, memory]
          # with no hosted fallback, and the runner is persistent:
          # GOMODCACHE/GOCACHE already survive between jobs on disk, so setup-go's
          # GH cache is redundant — it tries to upload ~10GB and always exceeds
          # the 10GB cache limit.
          cache: false

      # `*_templ.go` is generated and gitignored, so the checkout has no templ
      # output until this runs; `go build ./...` depends on it.
      - name: Generate templ
        working-directory: apps/web-ui/gateway
        run: go run github.com/a-h/templ/cmd/templ generate ./...

      # app.css is generated by `task css` (Tailwind v4 + daisyUI) and is
      # gitignored; `go build ./...` embeds webui/static via go:embed, so the
      # CSS must be compiled before the build.
      - name: Compile CSS
        working-directory: apps/web-ui/gateway
        run: PATH="/root/go/bin:$PATH" task css

      - name: Build
        working-directory: apps/web-ui/gateway
        run: go build ./...

      - name: Vet
        working-directory: apps/web-ui/gateway
        run: go vet ./...

      - name: Test
        working-directory: apps/web-ui/gateway
        run: go test ./...

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: golangci-lint
        working-directory: apps/web-ui/gateway
        env:
          # Per-job cache dir: the self-hosted runner shares HOME across
          # concurrent jobs, which makes the default golangci-lint lock collide.
          GOLANGCI_LINT_CACHE: ${{ runner.temp }}/golangci-lint-cache
        run: golangci-lint run ./...

  # ───────────────────────────────────────────────────────────────────────────
  # js: hermetic JS-wiring gate. The full Playwright suite (tests/e2e) needs a
  # live gateway in session mode + a Zitadel test user + the real memory API, so
  # it cannot run in CI. The DOM specs under tests/e2e/specs/js/ instead load
  # the shipped static JS verbatim into a real Chromium engine and drive its
  # event wiring — no gateway, no auth, no `.env.e2e`. This is the automated
  # guard for the #1216 class (a handler referencing an undefined identifier is
  # a runtime ReferenceError, invisible to `go test` and to `node --check`).
  # ───────────────────────────────────────────────────────────────────────────
  js:
    name: JS wiring (Playwright DOM)
    # Fork PRs must not run on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, memory]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web-ui/tests/e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # No `cache:` here — see the `datasources` job below for the full note.
          # Short version: setup-node's cache step can fail resolving the
          # lockfile glob and red this job before any step runs (#1758), and
          # `npm ci` installs deps regardless.

      - name: Install e2e deps
        run: npm ci

      # Cheap syntax gate first: a malformed static JS file fails fast with a
      # precise message, before the browser install/run.
      - name: Syntax-check static JS
        working-directory: apps/web-ui
        run: |
          for f in gateway/webui/static/js/*.js; do
            node --check "$f"
          done

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('apps/web-ui/tests/e2e/package-lock.json') }}

      - name: Install Playwright Chromium
        # The `memory` self-hosted runner is Arch Linux (mcj-one): it has no
        # apt-get, but the Chromium runtime libs and browser cache are already
        # installed on the host, so `--with-deps` (which shells out to apt)
        # must be skipped there. Keep the dependency install on Debian runners.
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi

      - name: Run DOM wiring specs
        run: npx playwright test --config=js-dom.config.ts

  # ───────────────────────────────────────────────────────────────────────────
  # datasources: hermetic Data Sources (Google Drive) e2e. The specs drive the
  # gateway against the dev-mode mock harness (`datasources.config.ts` boots
  # `bash run-e2e.sh`, which starts mock-memory.mjs + the gateway with
  # AUTH_MODE=dev), so it is credential-free and deterministic — no live Drive,
  # no OIDC session. Unlike the `js` gate it needs the gateway binary, so it
  # also provisions the Go toolchain + `templ` + `task` (the same generated
  # templ/CSS prerequisites as the `gateway` job; run-e2e.sh generates them on
  # a cold tree).
  # ───────────────────────────────────────────────────────────────────────────
  datasources:
    name: Data sources e2e (Playwright)
    # Fork PRs must not run on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, memory]
    timeout-minutes: 20
    # Pinned gateway + mock ports, disjoint from the `share` job below. The
    # runner is shared, so two hermetic lanes can be live at once; `run-e2e.sh`
    # fails fast if a port is already served rather than attaching to the
    # sibling's server. These are the harness defaults, set explicitly to keep
    # the two jobs provably disjoint.
    env:
      MEMORY_PORT: '8097'
      MOCK_PORT: '5301'
    defaults:
      run:
        working-directory: apps/web-ui/tests/e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Add gateway toolchain to PATH
        # run-e2e.sh shells out to `task` (in /root/go/bin) to compile app.css
        # on a cold tree; `templ` is generated via `go run` so needs only Go.
        run: echo "/root/go/bin" >> "$GITHUB_PATH"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # No `cache:` here. setup-node's cache input accepts only a package
          # manager (npm/yarn/pnpm), not a boolean, and its cache step throws
          # "Some specified paths were not resolved, unable to cache
          # dependencies" when `glob.hashFiles(<cache-dependency-path>)` fails
          # to resolve the lockfile in the job workspace — intermittently
          # reddening this job before any step runs (#1758). The exact mechanism
          # is not fully confirmed there (the npm cache root `/srv/cache/npm`
          # does exist), but dropping the input removes the failure mode while
          # `npm ci` still installs deps.

      - name: Install e2e deps
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('apps/web-ui/tests/e2e/package-lock.json') }}

      - name: Install Playwright Chromium
        # The `memory` self-hosted runner is Arch Linux (mcj-one): it has no
        # apt-get, but the Chromium runtime libs and browser cache are already
        # installed on the host, so `--with-deps` (which shells out to apt)
        # must be skipped there. Keep the dependency install on Debian runners.
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi

      - name: Run datasources specs
        run: npx playwright test --config=datasources.config.ts

  # ───────────────────────────────────────────────────────────────────────────
  # share: hermetic agent-public-share e2e. `share.config.ts` boots the same
  # dev-mode mock harness as `datasources` (`bash run-e2e.sh`: mock-memory.mjs +
  # gateway AUTH_MODE=dev), and its spec is anonymous — no OIDC session, no live
  # memory backend — so it belongs in the PR lane. Until #1911 it was authored
  # but never invoked, so the whole surface could regress green. It runs on
  # :8098/:5302 (distinct from `datasources`' :8097/:5301) because both jobs can
  # be live on the shared self-hosted runner at once.
  # ───────────────────────────────────────────────────────────────────────────
  share:
    name: Agent public share e2e (Playwright)
    # Fork PRs must not run on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, memory]
    timeout-minutes: 20
    # Disjoint from `datasources`: this lane's own gateway + mock, so neither job
    # can attach to the other's stateful mock (see run-e2e.sh).
    env:
      MEMORY_PORT: '8098'
      MOCK_PORT: '5302'
    defaults:
      run:
        working-directory: apps/web-ui/tests/e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Add gateway toolchain to PATH
        # run-e2e.sh shells out to `task` (in /root/go/bin) to compile app.css
        # on a cold tree; `templ` is generated via `go run` so needs only Go.
        run: echo "/root/go/bin" >> "$GITHUB_PATH"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # No `cache:` — see the `datasources` job above for the full note.

      - name: Install e2e deps
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('apps/web-ui/tests/e2e/package-lock.json') }}

      - name: Install Playwright Chromium
        # The `memory` self-hosted runner is Arch Linux (mcj-one): it has no
        # apt-get, but the Chromium runtime libs and browser cache are already
        # installed on the host, so `--with-deps` (which shells out to apt)
        # must be skipped there. Keep the dependency install on Debian runners.
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi

      - name: Run share specs
        run: npx playwright test --config=share.config.ts

  web-ui-ci:
    name: web-ui-ci
    # Advisory aggregate gate for this path-filtered workflow; not the required
    # `ci` context (that is Meta CI's `ci` in ci.yml). Renamed from `ci` to
    # `web-ui-ci` so it no longer collides with the required context.
    # Fork PRs must not run on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, memory]
    needs: [gateway, js, datasources, share]
    steps:
      - name: CI gate
        run: echo "CI passed"

  web-ui-ci-status:
    name: web-ui-ci-status
    # Always-run, hosted aggregate so a fork PR (whose self-hosted jobs are
    # skipped by the fork guard) still yields a single satisfiable status check.
    # 'skipped' is treated as pass — guarded jobs are legitimately skipped on
    # fork PRs — so only 'failure'/'cancelled' fail the gate. ubuntu-latest keeps
    # this summary off the self-hosted runner and it needs no secrets.
    runs-on: ubuntu-latest
    if: always()
    needs: [gateway, js, datasources, share]
    steps:
      - name: CI gate
        run: |
          failed=0
          for result in "${{ needs['gateway'].result }}" "${{ needs['js'].result }}" "${{ needs['datasources'].result }}" "${{ needs['share'].result }}"; do
            echo "dependency result: ${result}"
            case "${result}" in
              success|skipped) ;;
              *) failed=1 ;;
            esac
          done
          if [ "${failed}" -ne 0 ]; then
            echo "CI gate failed: one or more required jobs did not succeed"
            exit 1
          fi
          echo "Web UI CI passed"
