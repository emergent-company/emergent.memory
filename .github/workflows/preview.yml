name: Preview Environment

# Thin caller for the reusable per-PR preview workflow owned by
# emergent-company/emergent.memory.infra. All logic (build, provision, health
# gate, teardown, E2E, deployment URL, sticky comment) lives there; this job
# only forwards PR identity and the caller-repo secrets.
#
# Fork PRs are excluded: they get a read-only token and no secrets, so they can
# never provision. Every same-repository PR gets an environment automatically.
#
# A protected `preview` environment with required reviewers MAY be attached to
# the secret-bearing job later if per-PR human approval is wanted (design D11);
# it is intentionally not set here so provisioning is automatic.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  packages: write
  deployments: write
  pull-requests: write

# Per-PR serialization at the caller too: rapid pushes collapse, and a close
# (teardown) is never cancelled by an in-flight update.
concurrency:
  group: preview-caller-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

jobs:
  preview:
    name: Preview environment
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: emergent-company/emergent.memory.infra/.github/workflows/preview.yml@main
    secrets: inherit
    with:
      repo: ${{ github.repository }}
      pr_number: ${{ github.event.pull_request.number }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      action: ${{ github.event.action }}
