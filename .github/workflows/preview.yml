name: Preview Environment

# Thin caller that dispatches a per-PR preview event to the private infra repo
# emergent-company/emergent.memory.infra. This repo is public and cannot `uses:`
# a private repo's reusable workflow, so instead of calling it directly we fire
# a `repository_dispatch` with event_type `pr-preview`. The infra workflow listens
# for that event and runs all the real logic (build, provision, health gate,
# teardown, E2E, deployment URL, sticky comment). This job only forwards PR
# identity and mints the dispatch token.
#
# Client payload keys (contract with the infra workflow):
#   repo       -> github.repository
#   pr_number  -> github.event.pull_request.number
#   head_sha   -> github.event.pull_request.head.sha
#   action     -> github.event.action (opened | synchronize | reopened | closed)
#
# Fork PRs are excluded: they get a read-only token and no secrets, so they can
# never provision. Fork PRs and unlabeled same-repo PRs are never provisioned.
#
# Opt-in: same-repository PRs are provisioned ONLY when a maintainer adds the
# `preview` label — the default is no environment. Adding the label dispatches
# an action=synchronize (provision/redeploy); pushing to an already-labeled PR
# redeploys it; closing the PR always dispatches a teardown. Removing the label
# does NOT tear down; the environment lives until the PR closes or hits the TTL.
#
# Rollout switch: the job only runs when the repository variable
# PREVIEW_ENABLED == 'true'. Set it once the preview host, wildcard DNS/TLS,
# and org secrets exist. Until then the workflow is inert and the check stays
# green (job skipped), so merging this does not make every PR attempt (and fail)
# provisioning.
#
# Dispatch token: the job mints a short-lived installation token for the
# emergent-company/emergent.memory.infra repo using the GitHub App identified by
# secrets GH_APP_ID / GH_APP_PRIVATE_KEY. That App MUST be installed on
# emergent-company/emergent.memory.infra with `contents: write` so the dispatch
# (which creates a `repository_dispatch` event) is accepted. Fallback: if the
# App is not available, use a repo secret named PREVIEW_DISPATCH_TOKEN instead
# (a fine-grained PAT or App token scoped to that repo), e.g.
#   GH_TOKEN: ${{ secrets.PREVIEW_DISPATCH_TOKEN }}
#
# A protected `preview` environment with required reviewers MAY be attached to
# the secret-bearing job later if per-PR human approval is wanted (design D11);
# it is intentionally not set here so provisioning is automatic.

on:
  pull_request:
    branches: [main]
    # `labeled` catches the opt-in moment; the others redeploy an already
    # opted-in PR (or tear it down on close). See the job `if:` for the gate.
    types: [opened, synchronize, reopened, labeled, closed]

# Per-PR serialization at the caller too: rapid pushes collapse, and a close
# (teardown) is never cancelled by an in-flight update.
concurrency:
  group: preview-caller-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

jobs:
  preview:
    name: Preview environment
    # Default = no preview. Provision only for same-repo PRs opted in with the
    # `preview` label; always allow teardown on close (even if the label was
    # since removed) so closing a PR can never strand an environment.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.PREVIEW_ENABLED == 'true' &&
      (github.event.action == 'closed' ||
       contains(github.event.pull_request.labels.*.name, 'preview'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Mint infra dispatch token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: emergent-company
          repositories: emergent.memory.infra
      - name: Dispatch preview event to infra
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # A `labeled` event is an opt-in (or re-opt-in) request: map it to
          # `synchronize`, which the infra workflow treats as provision/redeploy.
          ACTION: ${{ github.event.action == 'labeled' && 'synchronize' || github.event.action }}
        run: |
          gh api repos/emergent-company/emergent.memory.infra/dispatches \
            --method POST \
            -f event_type=pr-preview \
            -f "client_payload[repo]=$REPO" \
            -f "client_payload[pr_number]=$PR_NUMBER" \
            -f "client_payload[head_sha]=$HEAD_SHA" \
            -f "client_payload[action]=$ACTION"
