name: Web UI Build & Publish

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/memory-web-ui

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version info
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          fi
          COMMIT=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On tag pushes, detect whether apps/web-ui/** changed since the last tag.
      - name: Check if changed since last tag
        id: changed
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREV" ] && ! git diff --name-only "$PREV" HEAD -- apps/web-ui/ | grep -q .; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Normal path: build + push (branch pushes always; tag pushes when changed).
      - name: Extract metadata
        id: meta
        if: steps.changed.outputs.changed != 'false'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=dev,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{raw}}
            type=semver,pattern={{version}}

      - name: Build and push
        if: steps.changed.outputs.changed != 'false'
        uses: docker/build-push-action@v5
        with:
          context: apps/web-ui
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ steps.version.outputs.commit }}
          cache-from: type=gha,scope=memory-web-ui
          cache-to: type=gha,mode=max,scope=memory-web-ui

      # Unchanged tag push: re-alias the existing image to the new version tag
      # (no rebuild — seconds instead of ~2min).
      - name: Alias unchanged image to new version
        if: steps.changed.outputs.changed == 'false'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          docker pull "$BASE:latest"
          docker tag "$BASE:latest" "$BASE:v${VERSION}"
          docker tag "$BASE:latest" "$BASE:${VERSION}"
          docker push "$BASE:v${VERSION}"
          docker push "$BASE:${VERSION}"
