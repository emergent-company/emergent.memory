name: Auto-merge

on:
  # Auto-merge is OFF: manual trigger only.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    name: Enable auto-merge
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge (squash)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}" \
            || echo "auto-merge not enabled (already enabled, not mergeable, or required check missing)"
