name: Python SDK CI

on:
  push:
    branches: [master, main]
    paths:
      - 'sdk/python/**'
      - '.github/workflows/python-sdk.yml'
  pull_request:
    branches: [master, main]
    # `ready_for_review` is not a default type; the heavy jobs skip drafts.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'sdk/python/**'
      - '.github/workflows/python-sdk.yml'
  workflow_dispatch:

# Cancel superseded PR runs; never cancel a default-branch run (a merge to main
# should always finish and report its status).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: sdk/python

jobs:
  lint:
    name: Lint
    # Self-hosted: the SDK tests are pure-Python (httpx/pydantic have
    # wheels; no C toolchain needed), so this does not depend on the missing
    # host compiler. The fork guard keeps PR-authored code off the
    # persistent runner for forks, matching every other self-hosted job here.
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, memory]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # actions/setup-python cannot resolve a version on this pool — on the
      # Debian host it reports "not found for this operating system" — so uv
      # installs a managed interpreter and the job installs into an isolated
      # venv — no host Python toolchain required.
      - name: Set up Python 3.12 (uv)
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Create virtualenv
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/venv-3.12"
          echo "$RUNNER_TEMP/venv-3.12/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv-3.12" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: uv pip install -e '.[dev]'

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  typecheck:
    name: Type Check
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, memory]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # actions/setup-python cannot resolve a version on this pool — on the
      # Debian host it reports "not found for this operating system" — so uv
      # installs a managed interpreter and the job installs into an isolated
      # venv — no host Python toolchain required.
      - name: Set up Python 3.12 (uv)
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Create virtualenv
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/venv-3.12"
          echo "$RUNNER_TEMP/venv-3.12/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv-3.12" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: uv pip install -e '.[dev]'

      - name: Mypy
        run: mypy .

  test:
    name: Test (Python ${{ matrix.python-version }})
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, memory]
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }} (uv)
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Create virtualenv
        run: |
          uv venv --python ${{ matrix.python-version }} "$RUNNER_TEMP/venv-${{ matrix.python-version }}"
          echo "$RUNNER_TEMP/venv-${{ matrix.python-version }}/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv-${{ matrix.python-version }}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: uv pip install -e '.[dev]'

      - name: Run tests
        run: pytest -v --tb=short

      - name: Run tests with coverage
        if: matrix.python-version == '3.12'
        run: pytest --cov=emergent --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: sdk/python/coverage.xml
          flags: python-sdk
          fail_ci_if_error: false
