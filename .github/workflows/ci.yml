name: Meta CI

on:
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'docs/**'
      - 'openspec/**'
      - 'sdk/**'
      - 'swift/**'
      - 'site/**'
      - 'tools/**'
      - 'pkg/**'
      - 'bench/**'
      - '*.md'
      - '*.yml'
      - '*.yaml'
      - '*.py'
      - '*.sh'
      - 'go.mod'
      - 'go.work'
      - 'go.work.sum'
  pull_request:
    branches: [main]
    paths:
      - '.github/**'
      - 'docs/**'
      - 'openspec/**'
      - 'sdk/**'
      - 'swift/**'
      - 'site/**'
      - 'tools/**'
      - 'pkg/**'
      - 'bench/**'
      - '*.md'
      - '*.yml'
      - '*.yaml'
      - '*.py'
      - '*.sh'
      - 'go.mod'
      - 'go.work'
      - 'go.work.sum'

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check scripts
        run: python3 -m py_compile .github/scripts/*.py
