name: Meta CI

# NO `paths:` filter on either trigger.
#
# `ci` is a REQUIRED status check on `main`. A path-filtered required check never
# reports for PRs that do not touch the listed paths, so the required check is
# simply absent for those PRs and the whole required-check set becomes
# unenforceable. (Pre-existing defect; fixed here deliberately.)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check scripts
        run: python3 -m py_compile .github/scripts/*.py
      - name: Review gate tests
        run: bash .github/scripts/test_copilot_review_gate.sh
