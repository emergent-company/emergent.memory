name: Meta CI

# NO `paths:` filter on either trigger.
#
# `ci` is a branch-protection-required status check on `dev` and `main`
# (required contexts: `["ci", "verify"]` on `dev`; `["ci", "verify",
# "promotion"]` on `main`; `verify` is the merge-guard job and `promotion` is
# promotion.yml's full-suite gate). A path-filtered required check never reports
# for PRs that do not touch the listed paths, so such a check would simply be
# absent for those PRs and the required-check set would become unenforceable.
# This workflow is therefore unfiltered and MUST run for every PR and every push
# to either branch.
#
# The heavy suites (server unit/DB, E2E, CLI, web-ui, iOS, docker) no longer run
# on feature PRs at all: feature work goes to `dev` for a fast lane, and the
# suites run on the `dev -> main` promotion PR through promotion.yml (which
# calls them as reusable workflows) plus on pushes to `main`. They are not
# individually required — a path-filtered context cannot be required without
# deadlocking unrelated PRs — but `promotion` is, and it fails when any invoked
# suite fails. To make the cheap, always-applicable guards gate every PR, they
# run here in the required `ci` job instead:
#   * migration numbering + immutability (through scripts/preflight/all.sh, which
#     calls migration-number.sh -> migration-immutability.sh --base origin/<base>),
#   * migration workspace hygiene (stray untracked files / duplicate versions),
#   * the route-authority guard,
#   * the swagger raw-JSON guard (#162).
# See emergent-company/emergent.memory#1673.
#
# Fork PRs run a green no-op `ci`: every step is gated on
# `github.event_name != 'pull_request' || head.repo.full_name == repository`, so
# a fork PR cannot execute checked-out (untrusted) code. (That gate was written
# for the persistent self-hosted runner this job used to run on; it is kept
# unchanged now the job is hosted — a fork PR still must not run PR code against
# repo secrets, and the guard is the behaviour under test.) The job still reports
# a real result (success with all steps skipped), satisfying the required
# context; a maintainer must re-run from a trusted ref to actually validate a
# fork.
#
# DRAFT PRS. A feature PR to `dev` already only runs the cheap guards here, so a
# draft costs little; `ci` deliberately keeps running on drafts so the author
# gets feedback before requesting review. `promotion.yml` skips its called suites
# while the promotion/hotfix PR to `main` is a draft and adds
# `ready_for_review` to its `pull_request.types`, so a draft does not occupy the
# heavy runners.
#
# Two of the gated jobs are MATRIX jobs (`cli.yml`'s `Build (${{ matrix.label }})`
# and `python-sdk.yml`'s `Test (Python ${{ matrix.python-version }})`), which the
# docs-only classifier above deliberately does not do. The rule there is about
# *required* contexts: a skipped matrix job reports one check run under the
# unexpanded name, so a required per-leg context would never be reported and the
# PR would block forever (#797). Branch protection on `main` requires the `ci`
# and `verify` contexts, so no per-leg name is required, and on an un-drafted PR
# (`ready_for_review` or any `synchronize`) the legs report normally. Gating a
# matrix job is safe only while that stays true: if a per-leg context is ever
# made required, un-gate it in the same change.
#
# The `merge-guard` Checks-API run still runs as a check but is NOT a required
# context: a required context is pinned to the app that reports it, and a check
# run the guard publishes through the Checks API is never credited to that pin
# (#843). The required context is the guard's `verify` job check, which since
# #181 is red whenever no trusted marker names the head. The `Reviewed-SHA`
# marker is also enforced by scripts/merge-reviewed-pr.sh in the infra repo (and
# by hand on paths that skip it). There is no review bot: a maintainer posts the
# review verdict as a comment, and `verify` reads it.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel superseded PR runs; never cancel a default-branch run (a merge to main
# should always finish and report its status).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: ci
    # HOSTED ON PURPOSE. The queue measurement and the decision live in the
    # control repository (issue #819 there), which the tree-hygiene gate forbids
    # naming from this repo.
    #
    # `ci` is the branch-protection-required context on `main` and it
    # is ~40 s of cheap guards, yet on the 7-slot self-hosted pool
    # (`[self-hosted, linux, x64, memory]`) it queued 171-489 s behind advisory
    # Playwright/E2E work that cannot gate a merge (measured 2026-11-04: PR #54's
    # `ci` job queued 171 s, run 41838166310; the worst queue on the same PR
    # update was 489 s and 15 of 36 checks were waiting). Only `ci`'s queue time
    # is added directly to time-to-merge: every other suite is advisory, and
    # `merge-guard` already runs on `ubuntu-latest`. The repo is public, so
    # standard hosted runners are free and unmetered; the required check stops
    # competing with work that cannot block a merge.
    #
    # Nothing depends on the move except this line. The toolchain is either
    # fetched by a pinned step (`actions/setup-go@v5` from `go.work` for `go`/`gofmt`,
    # and `.github/scripts/install-gitleaks.sh`, which verifies a sha256 of the
    # release tarball) or provided by the image and ASSERTED by the "Verify
    # preflight toolchain" step below — so a hosted image that lacks a binary
    # turns this required check red instead of letting a guard silently no-op.
    #
    # ROLLBACK: revert this one line to
    #   runs-on: [self-hosted, linux, x64, memory]
    # The toolchain assertion passes unchanged on the pool (it only asserts
    # tools both images must have); nothing else in this workflow, the repo, or
    # the runner config refers to where this job runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          # Full history: the preflight/migration guards diff the working tree
          # against the base ref (`--base origin/<base>`) and need the base commit
          # and blob history present in this checkout.
          fetch-depth: 0
      # Repo-wide secret scan (#1917). gitleaks was previously only wired into
      # lefthook.yml — never into a workflow — and each lefthook job silently
      # `exit 0` when the binary was absent, so the required `ci` check could
      # merge a secret-bearing commit while reporting green. Provision a pinned,
      # checksum-verified gitleaks here (never assume the runner's PATH) and run
      # the same invocation the lint group uses. A missing binary is a hard
      # failure, and findings fail the step. Waivers are value-pinned
      # `[[allowlists]]` in `.gitleaks.toml` (issue #2022): a `path:rule:line`
      # fingerprint re-opens the finding whenever lines shift above it.
      - name: Install gitleaks
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: bash .github/scripts/install-gitleaks.sh
      - name: Secrets scan (gitleaks)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: gitleaks dir . --config .gitleaks.toml --no-banner
      # Canonical version guard: root VERSION must equal the `// @version`
      # annotation in apps/server/cmd/server/main.go. A release bumps both
      # together; this fails early when they drift (see #auto-tag dead-path).
      - name: Version drift guard
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          # PR labels feed the release-attribution escape in the guard (#1074):
          # a bump whose PR carries the `release` label is the release PR, even
          # if its commit subjects were rewritten. A push has no PR context, so
          # the list is empty there and commit subjects decide.
          PR_LABELS: ${{ github.event_name == 'pull_request' && join(github.event.pull_request.labels.*.name, ',') || '' }}
        run: bash scripts/preflight/version-drift.sh
      - name: Setup Go
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: false
      # Assert the toolchain every step below assumes, before any guard runs
      # (control-repo issue #819). Two tools are fetched by pinned steps —
      # `go`/`gofmt` by actions/setup-go from `go.work`, `gitleaks` by
      # .github/scripts/install-gitleaks.sh (sha256-verified) — and the rest come
      # from the runner image. Asserting them explicitly is what makes the move to
      # a hosted image safe: this job's worst failure mode is a guard that goes
      # green because the binary it needs was absent and the script swallowed
      # `command not found` (exactly how the required check merged around gitleaks
      # before #1917). A missing tool now reds this step, at the top, naming it.
      - name: Verify preflight toolchain
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          # Inventory: the binaries the steps in this job actually invoke.
          #   git            checkout, every preflight/migration diff, tree-hygiene
          #   bash           every scripts/preflight/*.sh and .github/scripts/*.test.sh
          #   python3        .github/scripts/check-injection.py (stdlib only)
          #   jq             scripts/preflight/swagger-raw-json.sh,
          #                  .github/scripts/release-versions.test.sh
          #   go, gofmt      actions/setup-go; go run ./cmd/*-guard, swag generation,
          #                  `go mod tidy -diff`, and the gofmt step
          #   gitleaks       secret scan + scripts/preflight/gitleaks-env-files.sh
          #   docker         the schema-documentation guard below, which starts a
          #                  throwaway Postgres to introspect
          #   coreutils/gawk/sed/grep/find/tar/curl/install
          #                  preflight scripts, install-gitleaks.sh
          # Nothing here needs `task`, `yq`, `goose`, `swag`, node or npm:
          # swag is `go run github.com/swaggo/swag/cmd/swag@<go.mod version>`, and
          # goose is only embedded in the server binary.
          missing=()
          for cmd in git bash python3 jq go gofmt gitleaks docker \
                     awk sed grep find sort uniq diff xargs mktemp \
                     tar curl sha256sum install; do
            command -v "$cmd" >/dev/null 2>&1 || missing+=("$cmd")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "ERROR: missing tool(s) the required \`ci\` job needs: ${missing[*]}" >&2
            exit 1
          fi
          git --version
          bash --version | head -n 1
          python3 --version
          jq --version
          go version
          echo "gofmt: $(command -v gofmt)"
          gitleaks version
      # Guard against silently-committed unformatted Go. `task lint` from
      # apps/web-ui is scoped to the gateway, so the whole repo is only checked
      # here — over *tracked* files, so generated/untracked artifacts don't
      # produce noise. (See emergent-company/emergent.memory#1058.)
      - name: gofmt (tracked Go files)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          files=$(git ls-files '*.go' | xargs gofmt -l)
          if [ -n "$files" ]; then
            echo "Unformatted tracked Go files:"
            echo "$files"
            echo "Fix with: gofmt -w <file>"
            exit 1
          fi
      # Cheap, always-applicable guards folded into the required `ci` job so they
      # actually gate merges (#1673). The path-filtered server.yml workflow cannot
      # be a required check, so its guards would otherwise only surface after
      # merge. Migration numbering + immutability are already covered by the
      # all.sh step below (migration-number.sh calls
      # migration-immutability.sh --base origin/<base>), so they are deliberately
      # not repeated here.
      - name: Guard migration workspace
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: bash scripts/preflight/migration-workspace.sh
      # Schema documentation drift (#757 in the control repository). The guard
      # exists -- server.yml runs `schema-dbml -check` after migrating a real
      # Postgres -- but it lives in the path-filtered advisory workflow, so #2500
      # merged a migration without regenerating docs/schema.dbml, the job's own
      # run went red on that exact step, and every PR that merged main afterwards
      # inherited the staleness (#2501 had to carry the fix).
      #
      # docs/schema.dbml is produced by INTROSPECTING a migrated database, so
      # this is the only guard in this workflow that needs a live Postgres. That
      # is why it is scoped to the PRs where it can matter: a migration or the
      # document itself changing. Mirrors the db-backed job's sequence verbatim
      # (same pgvector image, because the migration chain creates the `vector`
      # extension).
      #
      # Cost, honestly: the guard's own work is seconds, but this runs on a
      # hosted runner, so it also pulls the 168 MB image and compiles cmd/migrate
      # cold -- ~30-60 s end to end, against the 216-353 s that job's timing
      # showed for the database suite alone. The scope filter is what makes that
      # acceptable: an unrelated PR starts no container, and a migration PR is
      # already waiting 257-330 s on Unit Tests and 216-353 s on DB-backed Tests.
      - name: Detect schema documentation scope
        id: schema-doc-scope
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Three-dot diff: files this branch changed since it diverged from the
          # base, so merging main into the branch does not widen the scope.
          # The generator is in scope too: a change to cmd/schema-dbml can change
          # the document without any migration changing.
          changed=$(git diff --name-only "${BASE_SHA}...HEAD" -- \
            apps/server/migrations apps/server/cmd/schema-dbml docs/schema.dbml)
          if [ -n "$changed" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            printf 'schema documentation is in scope:\n%s\n' "$changed"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Schema documentation is current
        if: steps.schema-doc-scope.outputs.changed == 'true'
        env:
          PG_CONTAINER: schema-doc-pg-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # 127.0.0.1::5432 publishes the container port on a free host port.
          docker run -d --name "$PG_CONTAINER" \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=emergent \
            -p 127.0.0.1::5432 \
            pgvector/pgvector:pg18-trixie
          trap 'docker rm -f "$PG_CONTAINER" >/dev/null 2>&1 || true' EXIT
          HOST_PORT=$(docker port "$PG_CONTAINER" 5432/tcp | head -1 | awk -F: '{print $NF}')
          if [ -z "$HOST_PORT" ]; then
            echo "::error::could not determine the Postgres host port"
            docker logs "$PG_CONTAINER" || true
            exit 1
          fi
          # 60 × 2 s = 120 s of patience, the same as server.yml's DB-backed
          # job; both are the shipped image starting cold on a hosted runner.
          for _ in $(seq 1 60); do
            if docker exec "$PG_CONTAINER" pg_isready -U postgres >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec "$PG_CONTAINER" pg_isready -U postgres \
            || { echo "::error::Postgres did not become ready"; docker logs "$PG_CONTAINER" || true; exit 1; }
          # cmd/migrate gives DATABASE_URL precedence over POSTGRES_* and a
          # DATABASE_URL bypasses the -allow-localhost guard, which is why the
          # flag is still passed: this DSN is the throwaway container.
          export DATABASE_URL="postgres://postgres:postgres@127.0.0.1:${HOST_PORT}/emergent?sslmode=disable"
          cd apps/server
          go run ./cmd/migrate -c up -allow-localhost
          # A migration that changes the schema must regenerate the document in
          # the same PR, or it silently rots.
          go run ./cmd/schema-dbml -check -out ../../docs/schema.dbml
      - name: Guard route authority
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        working-directory: apps/server
        run: |
          # Parses the whole current tree's route table (apps/server/domain) and
          # compares it against the checked-in route-authority.yaml. No base ref
          # needed: an undeclared route, a vanished route, or a drifted tier all
          # fail. Same invocation as server.yml's `route-authority-guard` job.
          go run ./cmd/route-authority-guard
      # Go module file drift guard (#2193). apps/server/go.sum was 40 `/go.mod`
      # hash lines short for months (#2083): a warm module cache hides that,
      # because verification happens at download time, so only the first cold
      # consumer — fresh container, new workstation, `docker build` — failed, with
      # "missing go.sum entry for go.mod file". Nothing checked it; #2057 had
      # papered one instance over with a second `go mod download` inside
      # apps/server/Dockerfile. The script runs `go mod tidy -diff` over the
      # modules that are clean today and fails on any diff, in go.mod or go.sum.
      # It runs here rather than in server.yml because server.yml is
      # path-filtered and advisory, so a guard there cannot gate. Measured cost
      # ~0.2 s per module on a warm module cache (the guards above already warmed
      # it); the first run on a cold runner downloads each graph once (~25 s for
      # connector.linux, ~71 s for apps/server).
      #
      # It must stay *above* the swagger generate step (#312): this guard judges
      # the checked-out tree, and a generated Go file written earlier in the job
      # changes what `go mod tidy` considers part of the module graph.
      - name: Go module file drift guard
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: bash scripts/preflight/go-mod-tidy.sh
      # The generated swagger spec is no longer committed (#270): `task
      # server:swagger` and both Dockerfiles regenerate it at build time, so
      # there is no artifact left to drift from its annotations and the old
      # #2082 drift guard is gone. It is still generated *here* because the
      # swagger raw-JSON guard below reads the spec (spec-level half of #162),
      # and that was previously satisfied as a side effect of the drift guard.
      # Same generator invocation (and go.mod-derived version) as before.
      #
      # ORDER MATTERS (#312): this step sits *below* the go module drift guard
      # and writes JSON/YAML only. When it also emitted docs.go — a package
      # importing github.com/swaggo/swag inside the module — the tidy guard ran
      # on that polluted tree and demanded a direct require that no fresh
      # checkout needs, so the two tidy gates asked for opposite go.mod files.
      # Keep the guard first (it must see a clean tree) and keep
      # `--outputTypes json,yaml` (generation must not import into the module).
      - name: Generate swagger spec
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        working-directory: apps/server
        run: |
          set -euo pipefail
          version="$(go list -m -f '{{.Version}}' github.com/swaggo/swag)"
          if [ -z "$version" ]; then
            echo "ERROR: could not read github.com/swaggo/swag from apps/server/go.mod" >&2
            exit 1
          fi
          mkdir -p docs/swagger
          # `--outputTypes json,yaml` and not the default `go,json,yaml`: the
          # raw-JSON guard below reads swagger.json, and a docs.go would put a
          # github.com/swaggo/swag importer into apps/server for the rest of the
          # job (#312).
          go run "github.com/swaggo/swag/cmd/swag@${version}" \
            init -g cmd/server/main.go -o docs/swagger --parseDependency --parseInternal \
            --outputTypes json,yaml
      # Swagger raw-JSON guard (#162). swag cannot type a json.RawMessage, so
      # without a swaggertype tag it publishes the field as items:{type:integer}
      # and a generated client decodes []int. The same lie was fixed by hand in
      # #156/#158/#159 and reintroduced by #136 and #164 within hours. This
      # guard checks the schema-pack structs at the source level first, so a new
      # raw-JSON field fails while it is being written rather than only when a
      # PR happens to regenerate swagger, then asserts the swagger.json generated
      # by the step above does not render any of those fields as arrays of
      # integers (a present-but-wrong tag must not pass). Waivers are reason-pinned
      # in scripts/preflight/swagger-raw-json.allow. It runs here in the
      # branch-protection-required `ci` job, which is the only place it can gate:
      # server.yml is path-filtered and advisory, so a step there would surface
      # after merge. Cheap (~0.2 s: awk + jq, no Go build) and deliberately not in
      # scripts/preflight/all.sh (run by the step below) so each check runs once.
      - name: Swagger raw-JSON guard
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: bash scripts/preflight/swagger-raw-json.sh
      # Preflight guards: the same checks lanes run locally before pushing —
      # stale base, migration numbering + immutability (goose panics on duplicate
      # versions; migration-number.sh delegates the immutability rule to
      # migration-immutability.sh --base origin/<base>), tracked-file gofmt, skip
      # census, mcp authz, modelref split, and schemadrift. Runs here so the
      # branch-protection-required `ci` check enforces them on merge.
      # (See emergent-company/emergent.memory#1074.)
      - name: Preflight guards
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: bash scripts/preflight/all.sh
      # App Store Connect rejects a build whose app extension has no
      # NSExtensionAttributes > NSExtensionActivationRule (error 90360), but only
      # at the upload — the archive, the export and the simulator run all pass
      # (v0.93.0 shipped that way, #480). The guard exists because nothing else
      # can see the defect. It MUST run in a required context: it shipped in
      # advisory `ios-lint` first and #481 merged with its own guard still QUEUED
      # (#482). It is python3 + plistlib over apps/ios/**/Info.plist, so it costs
      # nothing on a hosted ubuntu runner — do not move it back to ios.yml.
      - name: Extension Info.plist guard
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: python3 .github/scripts/validate-extension-plists.py
      - name: Extension Info.plist guard (self-test)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: bash .github/scripts/validate-extension-plists.test.sh
      # Reject dynamic ${{ ... }} interpolation (refs, inputs, outputs, event
      # payloads) inside shell run:/github-script script: payloads. Runs here so
      # the branch-protection-required `ci` check enforces it repo-wide.
      - name: Workflow injection guard (self-test)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: python3 .github/scripts/check-injection.py --self-test
      - name: Workflow injection guard
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: python3 .github/scripts/check-injection.py .github/workflows
      # auto-tag dispatches the release fan-out itself when no RELEASE_TOKEN is
      # available (#116). Its manifest must equal the set of workflows that
      # actually trigger on a v* tag, or a new/renamed workflow is skipped
      # silently at release time. Checked here as well as in auto-tag so drift
      # fails the PR instead of the next release. `v0.0.0` is a probe tag: the
      # script only reads workflow files, it never creates a tag.
      - name: Release fan-out guard (self-test)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: python3 .github/scripts/check-release-fanout.py --self-test
      - name: Release fan-out guard
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: >-
          python3 .github/scripts/check-release-fanout.py
          .github/workflows .github/release-workflows.txt v0.0.0
      - name: go.work coverage guard
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: .github/scripts/check-go-work-coverage.sh
      # Regression test for the iOS release skip decision (#1612): a genuinely
      # new iOS version must build, a re-run / duplicate must skip, and neither
      # the dual SDK tag series nor a skipped intermediate tag may suppress it.
      - name: iOS release skip-check tests
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: .github/scripts/ios-release-should-build.test.sh
      # Xcode selection: "/Applications/Xcode.app wins" and
      # "sort -V compares paths, not bundles" both meant the newest *installed*
      # Xcode was not the one used, so the auto-update App Store Connect later
      # rejected could not be routed around. Also pins the deliberate-pin path
      # and the fail-closed behaviour when the pin is missing.
      - name: Xcode selection tests
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: .github/scripts/select-xcode.test.sh
      # Same guarantee for the Mac release skip decision (mac-update-channel).
      - name: Mac release skip-check tests
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: .github/scripts/mac-release-should-build.test.sh
      # Hermetic tests for the release version map and the alias assertion
      # (#2111): built vs aliased entries, the 0.88.0 wrong-PREV case, missing
      # previous maps degrading rather than failing.
      - name: Release version map tests
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: .github/scripts/release-versions.test.sh
      # The leak gate's own test (#2343): the scan lived in a workflow run:
      # body, so a pattern change could only be checked by retyping the regex,
      # and three regressions shipped that way (#2145, #2290/#2342, #2336). The
      # fixtures are a temporary tree -- a fake leak inside the scanned tree
      # would fail the gate it is meant to test.
      - name: Tree hygiene tests
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: .github/scripts/tree-hygiene.test.sh
      # #886: the merge-guard verdict is a pair of string comparisons that
      # `bash -n` and a YAML parse cannot check -- a wrong branch in
      # `awaiting_review()` turns a rejection green (a merge the guard exists to
      # stop), and the opposite puts red back on every push. This extracts both
      # `run:` blocks from merge-guard.yml, stubs `gh`, and drives the eight
      # no-marker/stale/approval/rejection cases on both triggers.
      - name: Merge guard awaiting-review tests
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: .github/scripts/merge-guard-awaiting.test.sh
      # Both Swift lint scripts pipe `swiftformat --lint` through
      # scripts/lib/swiftformat-lint.sh, which retries a *crashed* tool (exit
      # 139) and never a real finding (exit 1). `ios-lint` is only advisory on a
      # `dev` PR but runs inside the required `promotion` context, so getting that
      # distinction backwards either fails a release on a tool flake or hides
      # formatting drift behind a retry — both silent. No Swift toolchain is
      # installed here: the test drives a stub binary that exits a scripted
      # status, so it belongs with the other hermetic shell self-tests.
      - name: SwiftFormat crash-retry helper tests
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: bash scripts/lib/swiftformat-lint.test.sh
      # The deploy/self-hosted helpers are shell and run inside image builds,
      # where their failure modes are silent: sleeping after the last attempt
      # only slows a build, a swallowed status reports success after a real
      # failure, and a missing command would skip a build step (#83). There is
      # no deploy-specific CI job, so pin them here with the other hermetic
      # shell self-tests. Runs under dash on this runner; the test also runs
      # under busybox ash (see its header).
      - name: Deploy retry helper tests
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: sh deploy/self-hosted/scripts/retry_test.sh
      - name: Meta checks
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: 'echo "Meta CI: no meta checks remain in this repository."'
