name: Publish Self-Hosted Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build-server:
    name: Build and Push Server Image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version info
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          fi
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "build_time=$BUILD_TIME" >> $GITHUB_OUTPUT

      # On tag pushes, detect whether apps/server/** changed since the last tag.
      - name: Check if changed since last tag
        id: changed
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREV" ] && ! git diff --name-only "$PREV" HEAD -- apps/server/ | grep -q .; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        if: steps.changed.outputs.changed != 'false'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/memory-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push
        if: steps.changed.outputs.changed != 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/self-hosted/Dockerfile.server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ steps.version.outputs.commit }}
            BUILD_TIME=${{ steps.version.outputs.build_time }}
          cache-from: type=gha,scope=memory-server
          cache-to: type=gha,mode=max,scope=memory-server

      # Unchanged tag push: re-tag the previous version's multi-arch manifest list
      # to the new version tags (no rebuild).
      - name: Alias unchanged image to new version
        if: steps.changed.outputs.changed == 'false'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR_MINOR="${VERSION%.*}"
          MAJOR="${VERSION%%.*}"
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null | sed 's/^v//')
          IMG="${{ env.IMAGE_PREFIX }}/memory-server"
          docker buildx imagetools create \
            -t "$IMG:$VERSION" \
            -t "$IMG:$MAJOR_MINOR" \
            -t "$IMG:$MAJOR" \
            -t "$IMG:sha-${{ steps.version.outputs.commit }}" \
            "$IMG:$PREV"

      - name: Image digest
        if: steps.changed.outputs.changed != 'false'
        run: echo ${{ steps.meta.outputs.digest }}

      - name: Mark release as ready
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Docker images built and pushed successfully for $TAG" > images-ready.txt
          echo "Server image: ghcr.io/${{ github.repository_owner }}/memory-server:${TAG#v}" >> images-ready.txt
          echo "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> images-ready.txt

          for i in $(seq 1 30); do
            if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
              echo "Release $TAG found, uploading sentinel..."
              gh release upload "$TAG" images-ready.txt --repo "${{ github.repository }}" --clobber
              echo "✓ Release $TAG marked as ready"
              exit 0
            fi
            echo "Waiting for release $TAG to be created... (attempt $i/30)"
            sleep 10
          done

          echo "⚠️  Release $TAG not found after 5 minutes. Sentinel not uploaded."
          exit 1
