name: Merge guard
run-name: merge-guard PR ${{ inputs.pr || github.event.pull_request.number }}

# Check that binds the merged commit to the reviewed commit. It still runs on
# every PR, but it is NOT a required status check.
#
# Branch protection on `main` requires exactly `["ci"]`. `merge-guard` cannot be
# a required context: a required context is pinned to the app that reports it,
# and this guard publishes through the Checks API, which a pinned context never
# credits (#843). The `Reviewed-SHA` marker is enforced by
# `scripts/merge-reviewed-pr.sh` in the infra repo (and by hand on paths that
# skip it), not by branch protection. Reviews are comment-based (three
# independent agents share one GitHub identity, so GitHub-native approvals are
# unusable), and nothing else prevents a push after review from merging an
# unreviewed tree. A reviewer records the reviewed revision as a PR comment:
#
#     Reviewed-SHA: <40 lowercase hex>
#     Verdict: MERGE
#
# The verdict line is part of the gate, not decoration. A rejection is posted as
# `Verdict: CHANGES_REQUESTED` **with** the SHA it applies to, so matching the
# SHA alone would turn a rejection into an approval; the guard requires the
# latest trusted marker to name the head *and* say `MERGE`.
#
# A rejection is also binding without a SHA line: any trusted verdict comment
# newer than the approving marker that is not `MERGE` blocks the merge, so
# declining without naming a head still stops it. Verdict lines are matched after
# stripping markdown decoration, and any non-MERGE verdict in a comment outranks
# a quoted approval template.
#
# The guard passes only when the most recent TRUSTED marker equals the PR head.
# A marker is trusted only when its author is OWNER/COLLABORATOR or their
# immutable user id is in the MERGE_GUARD_TRUSTED_USER_IDS repository variable
# (MEMBER alone is org membership, not write access). Fork contributors and bots
# cannot mint one.
#
# A push changes the head, so the automatic run has no marker that can name it.
# On that path the published `merge-guard` CHECK RUN stays **neutral** ("awaiting
# review" / "awaiting re-review") so an in-flight PR does not collect a red check
# run, but the `verify` JOB fails: the job conclusion mirrors the verdict. GitHub
# credits a pinned required context to the job's own check (`verify`, app
# `github-actions`), not to the Checks-API run this workflow publishes (#843), so
# failing the job is what lets the platform backstop be restored once branch
# protection pins it. The `workflow_dispatch` run the merge wrapper dispatches
# keeps its stricter semantics: it publishes a failure in both states. See the
# control-repository runbook `docs/merge-guard.md`.
#
# Runs from the base branch (`pull_request_target`) so a PR cannot rewrite the
# verification logic. It also publishes an explicit `merge-guard` check run on
# the PR head so the human-facing verdict output can stay neutral while the job
# fails. The job's own `verify` check is attached to the PR head, not the base
# ref: its `details_url` is `.../actions/runs/<run>/job/<job>`, which is the fact
# #843 relies on. It never checks out or executes pull-request code: it reads
# comments through the API and compares strings.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to verify
        required: true

permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: write

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify the reviewed SHA matches the head
        id: verify
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          HEAD: ${{ github.event.pull_request.head.sha || '' }}
          TRUSTED_IDS: ${{ vars.MERGE_GUARD_TRUSTED_USER_IDS }}
          # `pull_request_target` is the automatic evaluation a push triggers;
          # `workflow_dispatch` is the binding one the merge wrapper runs.
          MODE: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # GITHUB_STEP_SUMMARY is per-step, so this step cannot hand its text to
          # the publish step through it. Write to a file in RUNNER_TEMP and pass
          # the path on as a step output.
          SUMMARY="${RUNNER_TEMP}/merge-guard-summary.md"
          : >"${SUMMARY}"
          echo "summary_path=${SUMMARY}" >>"${GITHUB_OUTPUT}"

          # "No marker yet" and "the marker names an older head" are what a push
          # looks like, not defects. On the automatic run they publish a neutral
          # check run while the job fails (the check run carries the verdict; the
          # job conclusion is what a pinned required context credits); on the
          # dispatched run they publish a failure, because that run only happens
          # when someone is trying to merge.
          awaiting_review() {
            [[ "${MODE}" == "pull_request_target" ]] || return 1
            echo "awaiting=true" >>"${GITHUB_OUTPUT}"
            return 0
          }

          if [[ -z "${HEAD}" ]]; then
            HEAD=$(gh api "repos/${REPO}/pulls/${PR}" --jq '.head.sha')
          fi
          HEAD=$(printf '%s' "${HEAD}" | tr '[:upper:]' '[:lower:]')
          echo "PR #${PR} head: ${HEAD}"

          # `author_association: MEMBER` is org membership, not write access, so
          # MEMBER is trusted only when the immutable user id is in the
          # MERGE_GUARD_TRUSTED_USER_IDS repo variable. OWNER and COLLABORATOR
          # imply an explicit grant. The latest marker's current body counts;
          # post a new comment rather than editing.
          read -r -d '' MARKER_JQ <<'JQ' || true
          ($trusted_ids // "" | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(. != ""))) as $allow
          | [
            .[]
            | select(
                .author_association == "OWNER"
                or .author_association == "COLLABORATOR"
                or ((.user.id | tostring) as $id | ($allow | index($id)) != null)
              )
            | select(.body | test("(?m)^Reviewed-SHA: [0-9a-f]{40}[ \\t\\r]*$"))
            | (.body | split("\n")
                | map(gsub("^[\\s>#*_`•-]+"; "") | gsub("[\\s*_`.,;:!]+$"; ""))
                | map(select(test("^(?i)verdict:[ \\t]*[A-Za-z_ ]+$")))
                | map(capture("^(?i)verdict:[ \\t]*(?<v>[A-Za-z_ ]+)").v | gsub("[ \\t]+$"; ""))
              ) as $verdicts
            | {
                created_at: .created_at,
                sha: (.body | split("\n") | map(select(test("^Reviewed-SHA: [0-9a-f]{40}[ \\t\\r]*$"))) | last | capture("^Reviewed-SHA: (?<sha>[0-9a-f]{40})").sha),
                # A non-MERGE verdict anywhere in the comment outranks a quoted
                # approval template, so a rejection cannot approve by pasting it.
                verdict: (
                  ($verdicts | map(select((ascii_upcase) != "MERGE"))) as $bad
                  | if ($bad | length) > 0 then $bad[0] else ($verdicts | last // "") end
                ),
                url: .html_url
              }
            ]
          | sort_by(.created_at)
          | last
          | if . == null then empty else "\(.sha)\t\(.verdict)\t\(.created_at)\t\(.url)" end
          JQ

          # A reviewer can reject without naming a head: post `Verdict:
          # CHANGES_REQUESTED` on its own. Such a comment carries no
          # `Reviewed-SHA:` line, so the marker projection above never sees it and
          # an earlier approval would stand. Any trusted verdict comment newer
          # than the marker that is not MERGE therefore blocks the merge.
          read -r -d '' BLOCKER_JQ <<'JQ' || true
          ($trusted_ids // "" | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(. != ""))) as $allow
          | [
            .[]
            | select(
                .author_association == "OWNER"
                or .author_association == "COLLABORATOR"
                or ((.user.id | tostring) as $id | ($allow | index($id)) != null)
              )
            | (.body | split("\n")
                | map(gsub("^[\\s>#*_`•-]+"; "") | gsub("[\\s*_`.,;:!]+$"; ""))
                | map(select(test("^(?i)verdict:[ \\t]*[A-Za-z_ ]+$")))
                | map(capture("^(?i)verdict:[ \\t]*(?<v>[A-Za-z_ ]+)").v | gsub("[ \\t]+$"; ""))
              ) as $verdicts
            | {
                created_at: .created_at,
                verdict: ($verdicts | map(select((ascii_upcase) != "MERGE")) | if length > 0 then .[0] else "" end),
                url: .html_url
              }
            | select(.verdict != "")
            | select(.created_at > $after)
            | select((.verdict | ascii_upcase) != "MERGE")
            ]
          | sort_by(.created_at)
          | last
          | if . == null then empty else "\(.verdict)\t\(.created_at)\t\(.url)" end
          JQ

          comments=$(mktemp)
          trap 'rm -f "${comments}"' EXIT
          # Fail closed: no comment list means no review evidence.
          gh api --paginate "repos/${REPO}/issues/${PR}/comments?per_page=100" \
            --jq '.[]' >"${comments}"

          marker=$(jq -s -r --arg trusted_ids "${TRUSTED_IDS:-}" "${MARKER_JQ}" "${comments}")
          if [[ -z "${marker}" ]]; then
            {
              echo "### Merge guard: no trusted review marker"
              echo
              echo "PR #${PR} has no \`Reviewed-SHA:\` comment from a reviewer with write access or on the trust allowlist."
              echo
              echo "A reviewer must comment:"
              echo
              echo '```'
              echo "Reviewed-SHA: ${HEAD}"
              echo "Verdict: MERGE"
              echo '```'
              echo
              echo "then re-run this workflow for the current head."
            } >>"${SUMMARY}"
            if awaiting_review; then
              echo "merge-guard: no marker for ${HEAD} yet; awaiting review"
              exit 0
            fi
            echo "::error::No trusted Reviewed-SHA marker for PR #${PR}."
            exit 1
          fi

          marker_sha=${marker%%$'\t'*}
          marker_rest=${marker#*$'\t'}
          marker_verdict=${marker_rest%%$'\t'*}
          marker_rest=${marker_rest#*$'\t'}
          marker_at=${marker_rest%%$'\t'*}
          marker_url=${marker_rest#*$'\t'}

          if [[ "${marker_sha}" != "${HEAD}" ]]; then
            {
              echo "### Merge guard: stale review marker"
              echo
              echo "The latest trusted marker names \`${marker_sha}\` (${marker_at})."
              echo "The PR head is \`${HEAD}\`."
              echo
              echo "The branch changed after review. Re-review the delta, then comment:"
              echo
              echo '```'
              echo "Reviewed-SHA: ${HEAD}"
              echo "Verdict: MERGE"
              echo '```'
              echo
              echo "and re-run this workflow for the current head."
            } >>"${SUMMARY}"
            if awaiting_review; then
              echo "merge-guard: marker ${marker_sha} predates head ${HEAD}; awaiting re-review"
              exit 0
            fi
            echo "::error::Marker ${marker_sha} does not match head ${HEAD}."
            exit 1
          fi

          if [[ "${marker_verdict^^}" != "MERGE" ]]; then
            {
              echo "### Merge guard: latest trusted marker does not approve this head"
              echo
              echo "The latest trusted marker names \`${marker_sha}\` (${marker_at}), which matches the"
              echo "head, but its verdict is \`${marker_verdict:-<absent>}\` rather than \`MERGE\`."
              echo
              echo "A marker is an approval only when the same comment carries an explicit"
              echo "\`Verdict: MERGE\` line. A reviewer who found problems posts"
              echo "\`Verdict: CHANGES_REQUESTED\` against the same SHA, so matching the SHA"
              echo "alone would count a rejection as approval."
              echo
              echo "Re-review the delta and comment:"
              echo
              echo '```'
              echo "Reviewed-SHA: ${HEAD}"
              echo "Verdict: MERGE"
              echo '```'
              echo
              echo "then re-run this workflow for the current head."
            } >>"${SUMMARY}"
            echo "::error::Marker ${marker_sha} is not an approval (verdict: ${marker_verdict:-absent})."
            exit 1
          fi

          # A rejection posted without a Reviewed-SHA line (reviewers may decline
          # to name a head) must not leave an earlier approval standing.
          blocker=$(jq -s -r --arg trusted_ids "${TRUSTED_IDS:-}" --arg after "${marker_at}" "${BLOCKER_JQ}" "${comments}") || {
            echo "::error::cannot parse PR comments"
            exit 1
          }
          if [[ -n "${blocker}" ]]; then
            blocker_verdict=${blocker%%$'\t'*}
            blocker_rest=${blocker#*$'\t'}
            blocker_at=${blocker_rest%%$'\t'*}
            blocker_url=${blocker_rest#*$'\t'}
            {
              echo "### Merge guard: a later trusted verdict blocks this head"
              echo
              echo "Head \`${HEAD}\` matches the approving marker (${marker_url}), but a trusted"
              echo "review comment at \`${blocker_at}\` says \`${blocker_verdict}\`:"
              echo "${blocker_url}"
              echo
              echo "A rejection does not need a \`Reviewed-SHA:\` line to be binding, so a"
              echo "verdict newer than the approval blocks the merge. Re-review the delta,"
              echo "then comment:"
              echo
              echo '```'
              echo "Reviewed-SHA: ${HEAD}"
              echo "Verdict: MERGE"
              echo '```'
              echo
              echo "and re-run this workflow."
            } >>"${SUMMARY}"
            echo "::error::A trusted comment at ${blocker_at} says ${blocker_verdict}; it is newer than the approving marker."
            exit 1
          fi

          {
            echo "### Merge guard: pass"
            echo
            echo "Head \`${HEAD}\` matches the latest trusted review marker (${marker_url})."
          } >>"${SUMMARY}"
          echo "merge-guard: head ${HEAD} matches marker ${marker_url}"

      - name: Publish the merge-guard check on the PR head
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          HEAD: ${{ github.event.pull_request.head.sha || '' }}
          OUTCOME: ${{ steps.verify.outcome }}
          AWAITING: ${{ steps.verify.outputs.awaiting }}
          SUMMARY_PATH: ${{ steps.verify.outputs.summary_path }}
        run: |
          set -euo pipefail

          if [[ -z "${HEAD}" ]]; then
            HEAD=$(gh api "repos/${REPO}/pulls/${PR}" --jq '.head.sha')
          fi
          HEAD=$(printf '%s' "${HEAD}" | tr '[:upper:]' '[:lower:]')

          # The verify step writes its summary to a file: GITHUB_STEP_SUMMARY is
          # unique per step, so reading it here always yielded the placeholder.
          if [[ -n "${SUMMARY_PATH:-}" && -s "${SUMMARY_PATH}" ]]; then
            summary=$(head -c 60000 "${SUMMARY_PATH}")
            cat "${SUMMARY_PATH}" >>"${GITHUB_STEP_SUMMARY}"
          else
            summary="merge-guard failed before producing a summary; read the 'Verify the reviewed SHA matches the head' step log."
          fi
          [[ -n "${summary}" ]] || summary="merge-guard produced an empty summary."

          conclusion=success
          title="merge-guard: pass"
          if [[ "${AWAITING:-}" == "true" ]]; then
            # Neutral, not skipped: the check has an opinion ("nothing to
            # enforce yet"), and `skipped` reads as "never ran".
            conclusion=neutral
            title="merge-guard: awaiting review"
          elif [[ "${OUTCOME}" != "success" ]]; then
            conclusion=failure
            title="merge-guard: ${OUTCOME}"
          fi

          jq -n \
            --arg name "merge-guard" \
            --arg sha "${HEAD}" \
            --arg conclusion "${conclusion}" \
            --arg title "${title}" \
            --arg summary "${summary}" \
            --arg details "https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID}" \
            --arg external "${GITHUB_RUN_ID}" \
            '{name: $name, head_sha: $sha, status: "completed", conclusion: $conclusion,
              details_url: $details, external_id: $external,
              output: {title: $title, summary: $summary}}' \
            | gh api -X POST "repos/${REPO}/check-runs" --input - >/dev/null

          echo "merge-guard: published ${conclusion} on ${HEAD}"
          # The check run may be neutral ("awaiting review"), but the JOB must
          # fail: a pinned required context credits the job's own check, not this
          # Checks-API run (#843). Exit non-zero for any verdict that is not a
          # pass, neutral included. `continue-on-error: true` on the verify step
          # keeps this step running.
          if [[ "${conclusion}" != "success" ]]; then
            echo "::error::merge-guard verdict for ${HEAD} is ${conclusion}; see the check run."
            exit 1
          fi
