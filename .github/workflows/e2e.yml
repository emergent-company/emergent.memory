name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      TEST_RUN:
        description: "Optional -run filter (e.g. TestCLIInstalled_Version)"
        required: false
        default: ""

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # integration: full Docker Compose stack (server + CLI test runner)
  # ───────────────────────────────────────────────────────────────────────────
  integration:
    name: CLI Install Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: e2e

    env:
      MEMORY_SERVER_IMAGE: memory-server:ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build memory-server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/self-hosted/Dockerfile.server
          load: true
          push: false
          tags: memory-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run CLI install tests
        env:
          TEST_RUN: ${{ inputs.TEST_RUN }}
        run: ./run_tests.sh

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: e2e/test-logs/
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # api: run HTTP API tests (tests/api/) against a fresh Docker Compose stack.
  # ───────────────────────────────────────────────────────────────────────────
  # api: run HTTP API tests (tests/api/) against the dev server (account mode).
  # Dev is Zitadel-backed; the standalone Docker server can't satisfy the
  # account-mode tests (scope enforcement, global skills, MCP registry, etc.).
  # ───────────────────────────────────────────────────────────────────────────
  api:
    name: API Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: e2e

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: e2e/go.mod

      - name: Run API tests (against dev)
        env:
          MEMORY_TEST_SERVER: https://api.dev.emergent-company.ai
          MEMORY_TEST_TOKEN: ${{ secrets.MEMORY_DEV_TEST_TOKEN }}
          MEMORY_AUTH_MODE: account
        run: go test -v ./tests/api/... -timeout 15m

