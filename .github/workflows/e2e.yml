name: E2E Tests

# Path-filtered: E2E builds the server image (and the CLI inside it) from
# apps/server/** and apps/cli/** (plus deploy/**, e2e/**, and the root
# .dockerignore), then runs the compose stack in e2e/**.
# It is NOT a required check, so a path filter cannot wedge unrelated PRs the
# way an unfiltered required check would.
on:
  push:
    branches: [main]
    paths:
      - 'apps/server/**'
      - 'apps/cli/**'
      - 'deploy/**'
      - 'e2e/**'
      - 'go.work'
      - 'VERSION'
      - '.github/workflows/e2e.yml'
      - '.dockerignore'
  pull_request:
    paths:
      - 'apps/server/**'
      - 'apps/cli/**'
      - 'deploy/**'
      - 'e2e/**'
      - 'go.work'
      - 'VERSION'
      - '.github/workflows/e2e.yml'
      - '.dockerignore'
  workflow_dispatch:
    inputs:
      TEST_RUN:
        description: "Optional -run filter (e.g. TestCLIInstalled_Version)"
        required: false
        default: ""

# Cancel superseded PR runs; never cancel a default-branch run (a merge to main
# should always finish and report its status).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # integration: full Docker Compose stack (server + CLI test runner)
  # ───────────────────────────────────────────────────────────────────────────
  integration:
    name: CLI Install Tests
    # Fork PRs must never execute on the self-hosted runner (read-only token,
    # no org hardware). Same-repo PRs and main pushes run normally.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, memory]
    timeout-minutes: 30

    defaults:
      run:
        working-directory: e2e

    env:
      MEMORY_SERVER_IMAGE: memory-server:ci
      # e2e is a standalone module with its own workspace (e2e/go.work), so the
      # root build list cannot perturb it: runlog pins an older
      # google.golang.org/adk whose telemetry does not compile against the
      # otel/log version adk/v2 selects. GOWORK=off keeps CI independent of the
      # workspace files entirely.
      GOWORK: "off"
      # Unique per run/job so concurrent jobs sharing one self-hosted Docker
      # daemon never collide on container names, the default network, or host
      # ports. Paired with ephemeral loopback port bindings in docker-compose.
      COMPOSE_PROJECT_NAME: e2e-${{ github.run_id }}-integration

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build memory-server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/self-hosted/Dockerfile.server
          load: true
          push: false
          tags: memory-server:ci
          # Mirror server.yml: PR runs only consume the cache; the default
          # branch writes it. `mode=max` on every PR ref is what filled the
          # shared 10 GB Actions cache budget with ~7 GB of buildkit blobs.
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=min,ignore-error=true' || '' }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Distinct infrastructure step: an image-pull failure must read as
      # infrastructure, not as a failing test (issue #23). The server image is
      # built locally (memory-server:ci) and the test client/registry services
      # are built, so pull only the registry-backed services.
      - name: "Preflight: pull stack images"
        run: docker compose pull test-db seaweedfs mailpit

      # Distinct infrastructure step: the test image build fetches the pinned
      # opencode release binary (issue #944). A fetch failure must read as
      # infrastructure, not as a failing test, so build the image here and let
      # the test step below reuse the cached layer.
      - name: "Preflight: build test image (fetches opencode)"
        run: ./run_tests.sh --build-only

      - name: Run CLI install tests
        env:
          TEST_RUN: ${{ inputs.TEST_RUN }}
        run: ./run_tests.sh

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: e2e/test-logs/
          retention-days: 7

      # Distinct teardown step so a cancelled/killed test run cannot leak the
      # per-run `e2e-<runid>-integration_default` network (#1876). Mirrors the
      # `api` and `mailgun` jobs' `Stop server stack` step.
      - name: Stop server stack
        if: always()
        run: docker compose down -v --remove-orphans

  # ───────────────────────────────────────────────────────────────────────────
  # api: run HTTP API tests (tests/api/) against a fresh Docker Compose stack.
  # ───────────────────────────────────────────────────────────────────────────
  api:
    name: API Tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, memory]
    timeout-minutes: 30

    defaults:
      run:
        working-directory: e2e

    env:
      MEMORY_SERVER_IMAGE: memory-server:ci
      # e2e is a standalone module with its own workspace (e2e/go.work), so the
      # root build list cannot perturb it: runlog pins an older
      # google.golang.org/adk whose telemetry does not compile against the
      # otel/log version adk/v2 selects. GOWORK=off keeps CI independent of the
      # workspace files entirely.
      GOWORK: "off"
      # Unique per run/job so concurrent jobs sharing one self-hosted Docker
      # daemon never collide on container names, the default network, or host
      # ports. Paired with ephemeral loopback port bindings in docker-compose.
      COMPOSE_PROJECT_NAME: e2e-${{ github.run_id }}-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build memory-server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/self-hosted/Dockerfile.server
          load: true
          push: false
          tags: memory-server:ci
          # Mirror server.yml: PR runs only consume the cache; the default
          # branch writes it. `mode=max` on every PR ref is what filled the
          # shared 10 GB Actions cache budget with ~7 GB of buildkit blobs.
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=min,ignore-error=true' || '' }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: e2e/go.mod
          # The memory runners are persistent: GOCACHE/GOMODCACHE live on local
          # disk between jobs, so the built-in Actions cache only adds multi-GB
          # uploads that blow the 10 GB repo budget (see runner-cache-hygiene.yml).
          cache: false

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Distinct infrastructure step: an image-pull failure must read as
      # infrastructure, not as a failing test (issue #23). The server image is
      # built locally (memory-server:ci) and the test client/registry services
      # are built, so pull only the registry-backed services.
      - name: "Preflight: pull stack images"
        run: docker compose pull test-db seaweedfs mailpit

      - name: Start server stack
        run: |
          set -euo pipefail
          cp .env.example .env 2>/dev/null || true
          docker compose up -d
          # Ephemeral loopback bindings: discover the assigned host ports and
          # export them for the host-run tests (and the health wait below).
          SERVER_PORT=$(docker compose port test-emergent-server 3002 | head -1 | awk -F: '{print $NF}' || true)
          MAILPIT_PORT=$(docker compose port mailpit 8025 | head -1 | awk -F: '{print $NF}' || true)
          GITHUB_STUB_PORT=$(docker compose port github-stub 8080 | head -1 | awk -F: '{print $NF}' || true)
          if [ -z "$SERVER_PORT" ] || [ -z "$MAILPIT_PORT" ] || [ -z "$GITHUB_STUB_PORT" ]; then
            echo "::error::could not resolve published host ports (server='$SERVER_PORT' mailpit='$MAILPIT_PORT' github-stub='$GITHUB_STUB_PORT')"
            docker compose ps
            exit 1
          fi
          {
            echo "MEMORY_TEST_SERVER=http://127.0.0.1:${SERVER_PORT}"
            echo "MAILPIT_BASE_URL=http://127.0.0.1:${MAILPIT_PORT}"
            echo "GITHUB_STUB_URL=http://127.0.0.1:${GITHUB_STUB_PORT}"
          } >> "$GITHUB_ENV"
          echo "Resolved server=http://127.0.0.1:${SERVER_PORT} mailpit=127.0.0.1:${MAILPIT_PORT} github-stub=127.0.0.1:${GITHUB_STUB_PORT}"
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:${SERVER_PORT}/health" > /dev/null 2>&1; then
              echo "Server is healthy"
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done

      - name: Run API tests
        env:
          # MEMORY_TEST_SERVER / MAILPIT_BASE_URL come from $GITHUB_ENV (the ports
          # are ephemeral, so they cannot be hard-coded).
          MEMORY_TEST_TOKEN: e2e-test-user
          MEMORY_AUTH_MODE: standalone
        run: go test -v ./tests/api/... -timeout 15m

      - name: Show server logs on failure
        if: failure()
        run: |
          docker compose logs --tail=100
          echo "=== email-worker / SMTP logs ==="
          docker compose logs test-emergent-server --tail=1000 2>/dev/null | grep -iE "email|smtp|template|enqueue|dequeue" || echo "(no email-related server log lines)"

      - name: Stop server stack
        if: always()
        run: docker compose down -v --remove-orphans

  # ───────────────────────────────────────────────────────────────────────────
  # mailgun: run the same e2e stack with the Mailgun email transport pointed at
  # the local mailgun-stub (no real creds, no egress). The default `api` job
  # above keeps the SMTP/Mailpit stack and is unchanged.
  # ───────────────────────────────────────────────────────────────────────────
  mailgun:
    name: Mailgun Transport Test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, memory]
    timeout-minutes: 30

    defaults:
      run:
        working-directory: e2e

    env:
      MEMORY_SERVER_IMAGE: memory-server:ci
      # e2e is a standalone module with its own workspace (e2e/go.work), so the
      # root build list cannot perturb it: runlog pins an older
      # google.golang.org/adk whose telemetry does not compile against the
      # otel/log version adk/v2 selects. GOWORK=off keeps CI independent of the
      # workspace files entirely.
      GOWORK: "off"
      # Switch the stack's email transport from SMTP/Mailpit to Mailgun and
      # point the Mailgun SDK base URL at the local stub. The override includes
      # the /v3 path segment because Mailgun's SetAPIBase replaces the whole
      # base URL (the default already ends in /v3).
      E2E_EMAIL_TRANSPORT: mailgun
      E2E_MAILGUN_DOMAIN: test.example.com
      E2E_MAILGUN_API_KEY: test-key
      E2E_MAILGUN_API_BASE: http://mailgun-stub:8080/v3
      E2E_MAILGUN_REGION: us
      E2E_MAILGUN_STUB_URL: http://mailgun-stub:8080
      # Unique per run/job so concurrent jobs sharing one self-hosted Docker
      # daemon never collide on container names, the default network, or host
      # ports. Paired with ephemeral loopback port bindings in docker-compose.
      COMPOSE_PROJECT_NAME: e2e-${{ github.run_id }}-mailgun

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build memory-server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/self-hosted/Dockerfile.server
          load: true
          push: false
          tags: memory-server:ci
          # Mirror server.yml: PR runs only consume the cache; the default
          # branch writes it. `mode=max` on every PR ref is what filled the
          # shared 10 GB Actions cache budget with ~7 GB of buildkit blobs.
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=min,ignore-error=true' || '' }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: e2e/go.mod
          cache: false

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Distinct infrastructure step: an image-pull failure must read as
      # infrastructure, not as a failing test (issue #23). The server image is
      # built locally (memory-server:ci) and the mailgun stub is built from
      # source, so pull only the registry-backed services.
      - name: "Preflight: pull stack images"
        run: docker compose pull test-db seaweedfs

      - name: Start server stack (Mailgun transport)
        run: |
          set -euo pipefail
          cp .env.example .env 2>/dev/null || true
          docker compose --profile mailgun up -d --build mailgun-stub test-emergent-server
          # Ephemeral loopback bindings: discover the assigned host ports and
          # export them for the host-run test (and the health wait below).
          SERVER_PORT=$(docker compose --profile mailgun port test-emergent-server 3002 | head -1 | awk -F: '{print $NF}' || true)
          STUB_PORT=$(docker compose --profile mailgun port mailgun-stub 8080 | head -1 | awk -F: '{print $NF}' || true)
          if [ -z "$SERVER_PORT" ] || [ -z "$STUB_PORT" ]; then
            echo "::error::could not resolve published host ports (server='$SERVER_PORT' stub='$STUB_PORT')"
            docker compose --profile mailgun ps
            exit 1
          fi
          {
            echo "MEMORY_TEST_SERVER=http://127.0.0.1:${SERVER_PORT}"
            echo "MAILGUN_STUB_URL=http://127.0.0.1:${STUB_PORT}"
          } >> "$GITHUB_ENV"
          echo "Resolved server=127.0.0.1:${SERVER_PORT} mailgun-stub=127.0.0.1:${STUB_PORT}"
          healthy=0
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:${SERVER_PORT}/health" > /dev/null 2>&1; then
              echo "Server is healthy"
              healthy=1
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done
          if [ "$healthy" -ne 1 ]; then
            echo "::error::server did not become healthy within 60s; failing instead of letting the only Mailgun test skip"
            docker compose --profile mailgun logs --tail=100 test-emergent-server || true
            exit 1
          fi

      - name: Run Mailgun transport test
        env:
          # MEMORY_TEST_SERVER / MAILGUN_STUB_URL come from $GITHUB_ENV (the ports
          # are ephemeral, so they cannot be hard-coded).
          MEMORY_TEST_TOKEN: e2e-test-user
          MEMORY_AUTH_MODE: standalone
        run: go test -v ./tests/api/... -run 'TestInvite_EmailDeliveredViaMailgunTransport' -timeout 15m

      - name: Show server logs on failure
        if: failure()
        run: |
          docker compose --profile mailgun logs --tail=100
          echo "=== email-worker / Mailgun logs ==="
          docker compose --profile mailgun logs test-emergent-server --tail=1000 2>/dev/null | grep -iE "email|mailgun|template|enqueue|dequeue" || echo "(no email-related server log lines)"

      - name: Stop server stack
        if: always()
        run: docker compose --profile mailgun down -v --remove-orphans

