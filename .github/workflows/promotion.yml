name: Promotion Gate

# The single REQUIRED full-suite gate on `main`.
#
# Why a separate workflow: feature work merges to `dev` with fast checks only.
# `dev -> main` (and `fix/* -> main` hotfixes) is the promotion gate, and it must
# prove the full suite. A required check cannot be one of the path-filtered app
# workflows — a required check that never runs for a PR which misses its `paths:`
# filter deadlocks the merge (see ci.yml's header). This workflow has NO `paths:`
# filter, so the `promotion` job always reports, and it calls the app suites as
# reusable workflows instead of re-implementing them.
#
# Called suites: server (lint/build/unit/DB/docker/guards), web-ui (build +
# Playwright), cli, connector, iOS lint + simulator tests, the Python and Go SDKs,
# and the CLI e2e compose suite. Each runs on the same runners and with the same
# environment it would have used on a main-targeting PR.
on:
  pull_request:
    branches: [main]
    # Drafts are not mergeable; `ready_for_review` is not a default type, so it
    # must be listed or the gate would only appear on the next push.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to verify (workflow_dispatch only; informational)"
        required: false
        default: ""

permissions:
  contents: read
  packages: read

concurrency:
  group: promotion-${{ github.ref }}
  # A superseded promotion run is safe to cancel; the new head is what matters.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    name: server
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    uses: ./.github/workflows/server.yml
    secrets: inherit

  web-ui:
    name: web-ui
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    uses: ./.github/workflows/web-ui.yml
    secrets: inherit

  cli:
    name: cli
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    uses: ./.github/workflows/cli.yml
    secrets: inherit

  connector:
    name: connector
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    uses: ./.github/workflows/connector.yml
    secrets: inherit

  ios:
    name: ios
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    uses: ./.github/workflows/ios.yml
    secrets: inherit

  ios-test:
    name: ios-test
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    uses: ./.github/workflows/ios-test.yml
    secrets: inherit

  python-sdk:
    name: python-sdk
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    uses: ./.github/workflows/python-sdk.yml
    secrets: inherit

  server-sdk:
    name: server-sdk
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    uses: ./.github/workflows/server-sdk.yml
    secrets: inherit

  e2e:
    name: e2e
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  # The required context. Always runs (even when the calls above are skipped on a
  # draft), so branch protection never waits on an "Expected" check that never
  # appears. A suite that failed or was cancelled fails the gate; a skipped suite
  # (draft, or a suite that chose not to run) does not.
  promotion:
    name: promotion
    if: always()
    needs: [server, web-ui, cli, connector, ios, ios-test, python-sdk, server-sdk, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require every promotion suite
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r 'to_entries[]
            | select(.value.result == "failure" or .value.result == "cancelled")
            | .key')
          if [ -n "$bad" ]; then
            echo "::error::promotion suite(s) did not pass: $(echo $bad | tr '\n' ' ')"
            exit 1
          fi
          echo "promotion: every invoked suite passed or was skipped"
