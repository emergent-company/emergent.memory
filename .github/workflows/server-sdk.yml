name: Go SDK CI

on:
  push:
    branches: [master, main]
    paths:
      - 'apps/server/pkg/sdk/**'
      - '.github/workflows/server-sdk.yml'
    tags:
      - 'v*'
  pull_request:
    branches: [master, main]
    paths:
      - 'apps/server/pkg/sdk/**'
      - '.github/workflows/server-sdk.yml'
  workflow_dispatch:

env:
  GO_VERSION: '1.26'

jobs:
  lint:
    name: Lint
    runs-on: [self-hosted, linux, x64, memory]
    timeout-minutes: 30
    if: "!startsWith(github.ref, 'refs/tags/')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/server/pkg/sdk/go.sum
      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-


      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: golangci-lint
        working-directory: apps/server/pkg/sdk
        run: golangci-lint run ./...

  test:
    name: Test
    runs-on: [self-hosted, linux, x64, memory]
    timeout-minutes: 30
    if: "!startsWith(github.ref, 'refs/tags/')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/server/pkg/sdk/go.sum
      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-


      - name: Run tests
        working-directory: apps/server/pkg/sdk
        run: go test -v -race ./...

      - name: Generate coverage
        working-directory: apps/server/pkg/sdk
        # Go 1.24 emits benign 'covdata' warnings to stderr for packages without
        # test files when using -coverprofile with ./... — filter those specific
        # lines while preserving real errors.
        run: |
          go test -coverprofile=coverage.out -covermode=atomic ./... 2>&1 \
            | grep -v 'covdata' \
            | cat; true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: apps/server/pkg/sdk/coverage.out
          flags: go-sdk
          fail_ci_if_error: false

  build-examples:
    name: Build Examples
    runs-on: [self-hosted, linux, x64, memory]
    timeout-minutes: 30
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/server/pkg/sdk/go.sum
      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-


      - name: Build basic example
        working-directory: apps/server/pkg/sdk/examples/basic
        run: go build -o basic .

      - name: Build documents example
        working-directory: apps/server/pkg/sdk/examples/documents
        run: go build -o documents .

      - name: Build search example
        working-directory: apps/server/pkg/sdk/examples/search
        run: go build -o search .

      - name: Build projects example
        working-directory: apps/server/pkg/sdk/examples/projects
        run: go build -o projects .

  create-sdk-tag:
    name: Create SDK Module Tag
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # RELEASE_TOKEN must be a PAT (classic) with `repo` + `workflow` scope,
          # or the GitHub App must be granted the `workflows` permission; otherwise
          # the fallback GITHUB_TOKEN push will still be rejected for modifying .github/workflows/.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Create SDK module tag
        run: |
          SDK_TAG="apps/server/pkg/sdk/${GITHUB_REF#refs/tags/}"
          echo "Creating SDK module tag: $SDK_TAG"
          if git rev-parse "$SDK_TAG" >/dev/null 2>&1; then
            echo "Tag $SDK_TAG already exists, skipping"
          else
            git tag "$SDK_TAG"
            git push origin "$SDK_TAG"
          fi
