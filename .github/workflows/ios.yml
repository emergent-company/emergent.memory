name: iOS Lint

# `apps/ios` ships .swiftlint.yml / .swiftformat but nothing ran them, so the
# iOS app had no lint coverage (issue #1152). This workflow supplies it,
# mirroring the Mac connector's ratcheted coverage (#1146/#1151): SwiftLint runs
# over the whole apps/ios tree against apps/ios/.swiftlint.baseline (only NEW
# violations fail), and SwiftFormat ratchets to the files changed vs the base
# (touched files must be format-clean; pre-existing format debt is left alone).
# See apps/ios/Scripts/lint-swift.sh for the ratchet rationale.
#
# The check is deliberately named `ios-lint`, NOT `ci`: the repo already emits
# several distinct checks literally named `ci` (ci.yml, server.yml, cli.yml,
# web-ui.yml, connector.yml); another one would make check results ambiguous
# and blocking. Swift tooling runs on ubuntu with the Linux release binaries —
# no macOS runner is needed for lint.
on:
  push:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ios.yml'
  # No `pull_request` trigger: feature PRs go to `dev` for a fast lane. Runs on
  # the `dev -> main` promotion/hotfix PR via promotion.yml and on pushes to main.
  workflow_call:
  workflow_dispatch:

# Cancel superseded PR runs; never cancel a default-branch run (a merge to main
# should always finish and report its status).
concurrency:
  group: ios-lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SWIFTLINT_VERSION: '0.65.1'
  SWIFTFORMAT_VERSION: '0.63.0'

jobs:
  ios-lint:
    name: ios-lint
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, memory]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need the merge base with the PR/push base to ratchet SwiftFormat.
          fetch-depth: 0

      - name: Install Swift linters
        run: |
          # `-f` plus retries: without them an upstream 5xx writes its error
          # page into the zip and `unzip` fails on a "corrupt" archive, hiding
          # the HTTP failure and forcing a manual re-run.
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
            -o "$RUNNER_TEMP/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat_linux.zip"
          unzip -q "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat"
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
            -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux_amd64.zip"
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 "$RUNNER_TEMP/swiftformat/swiftformat_linux" "$RUNNER_TEMP/bin/swiftformat"
          # Statically linked SwiftLint: the dynamic build needs a newer glibc
          # than some hosts expose, the static build runs everywhere.
          install -m 0755 "$RUNNER_TEMP/swiftlint/swiftlint-static" "$RUNNER_TEMP/bin/swiftlint"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/swiftformat" --version
          "$RUNNER_TEMP/bin/swiftlint" version

      - name: swiftformat + swiftlint
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: apps/ios/Scripts/lint-swift.sh

      # The extension Info.plist guard (App Store Connect 90360) used to live
      # here. This workflow is advisory — `ios-lint` is not a required context —
      # so #481 merged with the guard still QUEUED and nothing gated it (#482).
      # It now runs in the required `ci` job (.github/workflows/ci.yml) as
      # `.github/scripts/validate-extension-plists.py`, which needs no Swift
      # toolchain and no macOS. Keep this job to style only; do not re-add a
      # second copy of the plist logic here.
