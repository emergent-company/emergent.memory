name: iOS Release (TestFlight)

# Stable channel: tag vX.Y.Z → archive VoiceAgent, export IPA, upload to TestFlight.
#
# The skip decision diffs apps/ios/** against the last commit that was actually
# uploaded (an `ios-release-uploaded/vX.Y.Z` marker tag written by the build job
# on success), falling back to the previous `vX.Y.Z` app tag before any marker
# exists. This is deliberately *not* `git describe HEAD^` against the nearest
# tag: both `vX.Y.Z` and `apps/server/pkg/sdk/vX.Y.Z` are pushed per release, so
# the nearest-tag choice is nondeterministic, and diffing against the immediate
# predecessor lets an unbuilt tag "consume" a change forever. (See #1612.)
# Logic: .github/scripts/ios-release-should-build.sh (unit-tested in meta CI).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force build even if unchanged'
        type: boolean
        default: false
      version:
        description: 'Release version X.Y.Z. Required when dispatching from a branch; ignored for v* tag refs.'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  check:
    name: Check if changed
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.c.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diff since last uploaded build
        id: c
        shell: bash
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: .github/scripts/ios-release-should-build.sh >> "$GITHUB_OUTPUT"

  build:
    name: Build & upload to TestFlight
    runs-on: [self-hosted, macOS, ARM64, mac]
    needs: check
    if: needs.check.outputs.changed == 'true'
    # contents: write is needed only to push the ios-release-uploaded/* marker
    # tag that records a successful upload (used by the next run's skip check).
    permissions:
      contents: write
    # Team comes from a secret when set; the scripts below fall back to this
    # repo's team (74LC88G9SC) so forks only set the secret.
    env:
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (iOS 26 SDK required)
        run: |
          XCODE=$(ls -d /Applications/Xcode.app 2>/dev/null || ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode found in /Applications"
            exit 1
          fi
          echo "Selecting $XCODE"
          sudo -n xcode-select -s "$XCODE" 2>/dev/null || true
          xcodebuild -version

      - name: Derive version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            MARKETING="${GITHUB_REF_NAME#v}"
          else
            MARKETING="${INPUT_VERSION:-}"
          fi
          # A branch dispatch used to silently produce MARKETING_VERSION=0.0.0.
          # Require a real version: dispatch from a v* tag ref, or pass the
          # `version` input.
          if [[ ! "$MARKETING" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::No release version resolved (ref=${GITHUB_REF}). Dispatch from a v* tag, or pass the 'version' input (X.Y.Z)."
            exit 1
          fi
          echo "marketing=$MARKETING" >> "$GITHUB_OUTPUT"
          echo "build_number=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Write App Store Connect API key
        run: |
          mkdir -p /tmp/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY }}" > /tmp/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          chmod 600 /tmp/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Import signing certificate
        env:
          APPLE_DIST_CERT_BASE64: ${{ secrets.APPLE_DIST_CERT_BASE64 }}
          APPLE_DIST_CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/ios-signing.keychain-db
          security create-keychain -p "temp-keychain-password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "temp-keychain-password" "$KEYCHAIN_PATH"
          echo "$APPLE_DIST_CERT_BASE64" | base64 --decode -o "$RUNNER_TEMP/ios-dist.p12"
          security import "$RUNNER_TEMP/ios-dist.p12" -P "$APPLE_DIST_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Archive
        working-directory: apps/ios
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.marketing }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          xcodebuild archive \
            -project VoiceAgent.xcodeproj \
            -scheme VoiceAgent \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/VoiceAgent.xcarchive \
            DEVELOPMENT_TEAM="${DEVELOPMENT_TEAM:-74LC88G9SC}" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_VERSION=5 \
            MARKETING_VERSION="${MARKETING_VERSION}" \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}"

      - name: Export IPA
        working-directory: apps/ios
        run: |
          # xcodebuild -exportOptionsPlist cannot read the environment, so render
          # a resolved copy of the tracked template with the configured team
          # (defaults to this repo's team so forks only set the secret).
          DEVELOPMENT_TEAM="${DEVELOPMENT_TEAM:-74LC88G9SC}"
          mkdir -p build
          cp ExportOptions.plist build/ExportOptions.plist
          plutil -replace teamID -string "$DEVELOPMENT_TEAM" build/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/VoiceAgent.xcarchive \
            -exportPath build/Export \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath /tmp/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: memory-ios-${{ github.sha }}
          path: apps/ios/build/Export/*.ipa
          retention-days: 14

      - name: Upload to TestFlight
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY }}" > ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          IPA=$(find apps/ios/build/Export -name "*.ipa" -type f | head -1)
          [ -z "$IPA" ] && { echo "::error::No IPA found"; exit 1; }
          xcrun altool --upload-app \
            -f "$IPA" \
            -t ios \
            --apiKey "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            --output-format xml

      - name: Record upload marker
        # Only meaningful for tag releases; marks this commit as uploaded so the
        # next tag's skip check diffs against it instead of the nearest tag.
        # Best-effort: a missing marker only costs one redundant rebuild later.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          MARKETING: ${{ steps.version.outputs.marketing }}
        run: |
          tag="ios-release-uploaded/v${MARKETING}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Marker $tag already exists; nothing to do."
            exit 0
          fi
          git tag "$tag"
          if git push origin "refs/tags/$tag"; then
            echo "Recorded upload marker $tag"
          else
            echo "::warning::Could not push upload marker $tag; the next release will fall back to the previous app tag."
          fi
