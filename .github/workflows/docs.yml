name: Docs

# The docs site is `docs-astro/` (Astro + Starlight) and it is the only docs
# system: there is no MkDocs tree to build and no versioned deploy here. The
# site itself is published by the infra repo (`scripts/deploy-docs.sh` →
# `.github/workflows/deploy-docs.yml`), so what this workflow owns is the build
# gate — that a page compiles before it can reach production.
#
# Publishing the files that still live on the `gh-pages` branch root (the API
# spec, the `llms*.md` entry points, the redirect pages) is a separate workflow,
# `publish-gh-pages-raw.yml`: it has to run when the API changes rather than
# when a page does, and it must not pay for this build.
#
# No tag trigger: versioned docs are gone with mike, so a release has no docs
# work to do. `docs.yml` was in `.github/release-workflows.txt` for the mike
# deploy; it is not any more, and check-release-fanout.py keeps the manifest
# equal to the workflows a release tag actually starts.
on:
  push:
    branches:
      - main
    paths:
      - 'docs-astro/**'
      # Self-change so a runner/build migration is exercised by its own PR and
      # by the merge, instead of silently waiting for the next docs edit.
      - '.github/workflows/docs.yml'
  # Kept for a hand-run build. It is no longer part of auto-tag's release
  # fan-out: the manifest that enforces that (`.github/release-workflows.txt`)
  # lists only workflows a release tag starts, and this one no longer does.
  workflow_dispatch:
  # Docs build on promotion/hotfix PRs (`dev -> main`, `fix -> main`): that is
  # the gate before the site's source reaches production. Feature PRs to `dev`
  # skip it to keep the fast lane fast — the MkDocs workflow this replaces was
  # `main`-only in exactly the same way.
  pull_request:
    branches: [main]
    paths:
      - 'docs-astro/**'
      - '.github/workflows/docs.yml'

jobs:
  build:
    name: Build docs
    # Self-hosted: the Astro build is PR-triggered on every docs-astro/** change
    # and pulls a node_modules tree — one of the largest recurring hosted-minute
    # consumers. Fork guard as everywhere else.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, memory]
    permissions:
      contents: read
    defaults:
      run:
        working-directory: docs-astro
    steps:
      - uses: actions/checkout@v4

      # Astro 7's floor is node >= 22.23.4 and @scalar/astro's is >= 22, so the
      # 22 line is the minimum that builds this tree. The product's own copy is
      # pinned by `docs-astro/package-lock.json`, which `npm ci` requires to be
      # in sync — a dependency bump without a lock refresh fails here.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      # The whole gate. `astro build` fails on a broken component, a page whose
      # frontmatter is invalid, a missing asset import and an MDX syntax error —
      # which is what `mkdocs build --strict` used to cover for the other tree.
      - name: Build site
        run: npm run build
