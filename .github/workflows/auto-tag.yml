name: Auto-Tag on Version Bump

on:
  push:
    branches: [main]
    paths: ['VERSION']

permissions:
  contents: write
  actions: write   # required for the `gh workflow run` dispatch fallback below

jobs:
  tag:
    name: Create Release Tag
    runs-on: [self-hosted, linux, x64, memory]
    # A VERSION bump does not always mean "cut a release now". `[skip release]`
    # anywhere in the pushed commit message lands the bump without tagging,
    # which is what a snapshot push (new repository, tag created after secrets
    # are restored) and a re-landed bump after a failed release both need.
    # Ordinary bumps still tag — the marker has to be deliberate.
    #
    # `contains()` matches the whole message, so a commit body that merely
    # quotes the marker also skips the release. That fails safe (no tag, no
    # release) and the skip shows in the check list; tag manually with
    # `git tag -a vX.Y.Z && git push origin vX.Y.Z` if it was unintended.
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Push the tag with a PAT, not GITHUB_TOKEN: events caused by
          # GITHUB_TOKEN do not create workflow runs, so a GITHUB_TOKEN tag
          # push silently starts no release pipeline. RELEASE_TOKEN must be a
          # classic PAT with `repo` + `workflow` scopes.
          #
          # The fallback is not "give up": with no RELEASE_TOKEN the tag is
          # still created, and `Dispatch release workflows` below starts the
          # fan-out explicitly through the Actions API (which is what the
          # `actions: write` permission on this job is for). Do not remove one
          # path without the other — a tag that exists on origin while nothing
          # runs is the failure mode this file exists to avoid (#116).
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Verify GitHub CLI
        run: |
          if ! command -v gh &>/dev/null; then
            echo "ERROR: gh CLI is not installed on the runner." >&2
            exit 1
          fi
          echo "gh version: $(gh --version | head -1)"

      - name: Read VERSION
        id: version
        run: |
          set -euo pipefail
          VERSION=$(tr -d ' \n\r' < VERSION)
          if [ -z "$VERSION" ]; then
            echo "ERROR: VERSION file is empty or contains only whitespace." >&2
            exit 1
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){2}$'; then
            echo "ERROR: VERSION '$VERSION' is not a valid semver (expected MAJOR.MINOR.PATCH, e.g. 1.2.3)." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Read version: $VERSION"

      - name: Check if tag already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo ${{ github.repository }} > /dev/null 2>&1; then
            echo "Tag $TAG already exists as a release — skipping"
            echo "exists=true" >> $GITHUB_OUTPUT
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "Tag $TAG already exists on origin — skipping"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Tag $TAG does not exist — will create"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # Fails *before* the tag is created if the fan-out manifest has drifted
      # from the workflows that actually trigger on this tag. Without this, a
      # renamed or newly added `on: push: tags: v*` workflow would leave the
      # tag in place with one release workflow never started — the exact
      # half-state #116 exists to prevent. The manifest is the single source of
      # truth read by both the dispatch step and the final verification.
      - name: Check release fan-out coverage
        if: steps.check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 .github/scripts/check-release-fanout.py \
            .github/workflows .github/release-workflows.txt "v${VERSION}"

      # One credential decision, made once and then referenced by every later
      # step, so the log names the path that actually ran.
      - name: Resolve release credential
        id: cred
        if: steps.check.outputs.exists == 'false'
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -n "${RELEASE_TOKEN:-}" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            echo "RELEASE_TOKEN is set — the tag push itself triggers the release workflows."
          else
            echo "mode=dispatch" >> "$GITHUB_OUTPUT"
            echo "::notice::RELEASE_TOKEN is not set — a GITHUB_TOKEN tag push starts no runs, so the release fan-out is dispatched explicitly."
          fi

      - name: Configure git
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "Created and pushed tag: $TAG"

      # Starts the release fan-out when the tag push could not (#116). Equivalent
      # in effect to the push-triggered runs: each workflow is dispatched **on
      # the tag ref**, because they derive the version and the changelog base
      # from `github.ref_name` — dispatching on `main` would build the wrong tree
      # or no-op. The list lives in .github/release-workflows.txt so this step
      # and the coverage check above cannot disagree; each entry must accept
      # `workflow_dispatch` (that is why docs.yml and connector-release.yml
      # declare it).
      #
      # python-sdk-release.yml is deliberately absent from the manifest: it
      # triggers on `python-sdk/v*`, not on a release tag.
      - name: Dispatch release workflows
        if: steps.check.outputs.exists == 'false' && steps.cred.outputs.mode == 'dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -uo pipefail
          TAG="v${VERSION}"
          MANIFEST=".github/release-workflows.txt"

          mapfile -t ENTRIES < <(
            sed -e 's/[[:space:]]#.*$//' "$MANIFEST" | grep -vE '^[[:space:]]*(#|$)'
          )
          if [ "${#ENTRIES[@]}" -eq 0 ]; then
            echo "ERROR: $MANIFEST has no entries; refusing to skip the fan-out." >&2
            exit 1
          fi

          failed=()
          for entry in "${ENTRIES[@]}"; do
            # `@TAG@` is substituted here, not left to the shell: a value read
            # from a file is never re-expanded for parameter substitution.
            entry="${entry//@TAG@/$TAG}"
            wf="${entry%%|*}"
            extra="${entry#*|}"
            if [ "$extra" = "$entry" ]; then extra=""; fi
            echo "::group::dispatch ${wf} on ${TAG}"
            # `extra` is a deliberate argument list, so it stays unquoted.
            if gh workflow run "${wf}" --repo "${GITHUB_REPOSITORY}" --ref "${TAG}" ${extra}; then
              echo "dispatched ${wf}"
            else
              echo "::error::dispatch failed: ${wf}"
              if [ -z "$extra" ]; then failed+=("$wf"); else failed+=("$wf $extra"); fi
            fi
            echo "::endgroup::"
          done

          # Attempt every dispatch before failing. The tag now exists, so a
          # re-run of this job takes the `exists=true` path and never retries
          # these — a partial fan-out would need a human regardless, and the run
          # must say exactly which workflows are missing.
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "ERROR: ${#failed[@]} release workflow(s) were not dispatched: ${failed[*]}" >&2
            echo "The tag ${TAG} already exists, so re-running this job skips dispatch." >&2
            echo "Start the missing workflow(s) by hand:" >&2
            for f in "${failed[@]}"; do
              echo "  gh workflow run ${f} --repo ${GITHUB_REPOSITORY} --ref ${TAG}" >&2
            done
            exit 1
          fi
          echo "Dispatched the release fan-out for ${TAG}."

      - name: Verify release workflows started
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          MODE: ${{ steps.cred.outputs.mode }}
        run: |
          set -uo pipefail
          TAG="v${VERSION}"
          MANIFEST=".github/release-workflows.txt"

          mapfile -t EXPECTED < <(
            sed -e 's/[[:space:]]#.*$//' "$MANIFEST" \
              | grep -vE '^[[:space:]]*(#|$)' | cut -d'|' -f1
          )
          if [ "${#EXPECTED[@]}" -eq 0 ]; then
            echo "ERROR: $MANIFEST has no entries; there is nothing to verify." >&2
            exit 1
          fi

          # Whichever path ran — the tag push (mode=token) or the explicit
          # dispatch (mode=dispatch) — a run must now exist for **every**
          # workflow in the manifest. Counting >=1 would let a partial fan-out
          # read as success; the manifest is the declared complete set.
          missing=()
          for attempt in 1 2 3 4 5 6 7 8 9; do
            RUN_PATHS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
              --jq "[.workflow_runs[] | select(.head_branch == \"${TAG}\") | .path] | unique | .[]" \
              2>/dev/null || true)
            missing=()
            for wf in "${EXPECTED[@]}"; do
              if ! grep -Fxq ".github/workflows/${wf}" <<< "$RUN_PATHS"; then
                missing+=("$wf")
              fi
            done
            COUNT=$(printf '%s\n' "$RUN_PATHS" | grep -c '^\.github/workflows/' || true)
            echo "attempt $attempt: ${COUNT} workflow(s) started for $TAG; not started: ${missing[*]-none}"
            if [ "${#missing[@]}" -eq 0 ]; then
              echo "Release workflows for $TAG: all ${#EXPECTED[@]} started (credential mode: $MODE)."
              exit 0
            fi
            sleep 10
          done

          echo "ERROR: ${#missing[@]}/${#EXPECTED[@]} release workflow(s) did not start for $TAG (credential mode: $MODE):" >&2
          for wf in "${missing[@]}"; do
            echo "  - ${wf}" >&2
          done
          if [ "$MODE" = "token" ]; then
            echo "The tag was pushed with RELEASE_TOKEN, so the push itself should have" >&2
            echo "started these workflows. Check that RELEASE_TOKEN is a user/App token" >&2
            echo "and not a GITHUB_TOKEN: events caused by GITHUB_TOKEN never start runs." >&2
          else
            echo "No RELEASE_TOKEN was set, so the fan-out was dispatched explicitly and" >&2
            echo "the dispatch step reported success. Re-run this job once the Actions API" >&2
            echo "settles; if runs still do not appear, check the workflow files against" >&2
            echo "$MANIFEST (a renamed workflow file silently stops being dispatched)." >&2
          fi
          echo "Start the missing workflow(s) by hand:" >&2
          for wf in "${missing[@]}"; do
            extra=""
            if [ "$wf" = "release-versions.yml" ]; then extra="--field tag=${TAG}"; fi
            echo "  gh workflow run ${wf} --repo ${GITHUB_REPOSITORY} --ref ${TAG} ${extra}" >&2
          done
          echo "Do not leave the tag in place: a tag that exists on origin with an" >&2
          echo "incomplete fan-out is the half-state #116 exists to prevent." >&2
          exit 1
