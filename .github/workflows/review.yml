name: AI Code Review

on:
  # pull_request_target: the workflow (and the review script) load from the BASE
  # branch, so a PR cannot rewrite it to exfiltrate GH_TOKEN/LITELLM_API_KEY.
  # Only the PR diff (untrusted data) is ever read, never executed as code.
  pull_request_target:
    types: [opened, synchronize, reopened]

# One review run per PR at a time; cancel stale runs on new push.
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review
    permissions:
      contents: read
      pull-requests: write
    runs-on: [self-hosted, linux, x64, memory]
    timeout-minutes: 15
    steps:
      - name: Checkout base (trusted script)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Fetch PR head
        run: git fetch --no-tags origin "+pull/${{ github.event.pull_request.number }}/head:refs/heads/pr-head"

      - name: Review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GH_APP_INSTALLATION_ID: ${{ secrets.GH_APP_INSTALLATION_ID }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_BASE_URL: http://litellm.tail0358fa.ts.net:4000/v1
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # Post as the App identity (emergent-code-reviewer) when configured;
          # otherwise stay github-actions[bot].
          if [ -n "$GH_APP_PRIVATE_KEY" ]; then
            export GH_TOKEN="$(python3 .github/scripts/gh_app_token.py)"
          fi
          python3 .github/scripts/ai_review.py
