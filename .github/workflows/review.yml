name: AI Code Review

on:
  # Reviewer bot is OFF: manual trigger only. To re-enable auto-review, restore
  # `pull_request_target` (base-branch scripts + diff-only) below.
  workflow_dispatch:

# One review run per PR at a time; cancel stale runs on new push.
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review
    permissions:
      contents: read
      pull-requests: write
    runs-on: [self-hosted, linux, x64, memory]
    timeout-minutes: 15
    steps:
      - name: Checkout base (trusted script)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Fetch PR head
        run: git fetch --no-tags origin "+pull/${{ github.event.pull_request.number }}/head:refs/heads/pr-head"

      - name: Review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GH_APP_INSTALLATION_ID: ${{ secrets.GH_APP_INSTALLATION_ID }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_BASE_URL: http://litellm.tail0358fa.ts.net:4000/v1
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # Post as the App identity (emergent-code-reviewer) when configured;
          # otherwise stay github-actions[bot].
          if [ -n "$GH_APP_PRIVATE_KEY" ]; then
            GH_TOKEN="$(python3 .github/scripts/gh_app_token.py)"
            if [ -z "$GH_TOKEN" ]; then
              echo "mint failed: empty App token" >&2
              exit 1
            fi
            echo "::add-mask::$GH_TOKEN"
            export GH_TOKEN
          fi
          python3 .github/scripts/ai_review.py
