name: AI Code Review

on:
  # pull_request_target: the workflow (and the review/fix scripts) load from the
  # BASE branch, so a PR cannot rewrite them to exfiltrate GH_TOKEN/LITELLM_API_KEY.
  # Only the PR *diff* (untrusted data) is ever read, never executed as code.
  pull_request_target:
    types: [opened, synchronize, reopened]

# Permissions are scoped per-job below (review only reads; fix writes).

# One review/fix run per PR at a time; cancel stale runs on new push.
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  mint:
    name: Mint token
    runs-on: ubuntu-latest
    outputs:
      token: ${{ steps.mint.outputs.token }}
    steps:
      - name: Checkout base (trusted script)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Mint
        id: mint
        env:
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GH_APP_INSTALLATION_ID: ${{ secrets.GH_APP_INSTALLATION_ID }}
        run: |
          # Use the App identity (emergent-code-reviewer) when the key is
          # configured; otherwise fall back to github-actions[bot].
          if [ -n "$GH_APP_PRIVATE_KEY" ]; then
            echo "token=$(python3 .github/scripts/gh_app_token.py)" >> "$GITHUB_OUTPUT"
          else
            echo "token=$GITHUB_TOKEN" >> "$GITHUB_OUTPUT"
          fi

  review:
    name: Review
    needs: mint
    permissions:
      contents: read
      pull-requests: write
    runs-on: [self-hosted, linux, x64, memory]
    timeout-minutes: 15
    steps:
      - name: Checkout base (trusted scripts)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Fetch PR head
        run: git fetch --no-tags origin "+pull/${{ github.event.pull_request.number }}/head:refs/heads/pr-head"

      - name: Review
        env:
          GH_TOKEN: ${{ needs.mint.outputs.token }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_BASE_URL: http://litellm.tail0358fa.ts.net:4000/v1
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/ai_review.py

  fix:
    name: Auto-fix
    needs: [mint, review]
    permissions:
      contents: write
      pull-requests: write
      issues: write
    # Only fix same-repo PRs (GITHUB_TOKEN can't push to fork branches).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, memory]
    timeout-minutes: 45
    steps:
      - name: Checkout base (trusted scripts)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Stash trusted script + checkout PR head
        run: |
          cp .github/scripts/ai_fix.py /tmp/ai_fix_trusted.py
          git fetch --no-tags origin "+pull/${{ github.event.pull_request.number }}/head:refs/heads/pr-head"
          git checkout pr-head

      - name: Auto-fix
        env:
          GH_TOKEN: ${{ needs.mint.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 /tmp/ai_fix_trusted.py
