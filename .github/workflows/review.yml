name: AI Code Review

on:
  workflow_run:
    workflows: ["Server Go CI"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review
    # Only review PR-triggered runs whose CI fully passed (the `ci` gate).
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: [self-hosted, linux, x64, memory]
    timeout-minutes: 15
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_BASE_URL: http://litellm.tail0358fa.ts.net:4000/v1
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: python3 .github/scripts/ai_review.py
