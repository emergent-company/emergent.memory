name: Feature request
description: Suggest an enhancement or new capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The problem or gap this feature would address.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: A clear and concise description of what you want to happen.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative approaches or workarounds you have considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other context, links, or screenshots.
