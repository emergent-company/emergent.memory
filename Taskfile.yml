version: '3'

dotenv:
  - .env
  - .env.local

includes:
  server:
    taskfile: apps/server/Taskfile.yml
    dir: apps/server

  connector-mac:
    taskfile: apps/connector.mac/Taskfile.yml
    dir: apps/connector.mac

tasks:
  build:
    desc: Build the Go server binary
    cmds:
      - task: server:build

  test:
    desc: Run backend unit tests
    cmds:
      - task: server:test

  test:e2e:
    desc: Run API e2e suites (e2e/tests/api, runlog)
    cmds:
      # Match the CI budget (.github/workflows/e2e.yml `api` job). Without an
      # explicit -timeout this inherits Go's 10m default and fails sooner than CI.
      - cd e2e && GOWORK=off go test ./tests/api/... -v -count=1 -timeout 25m {{.CLI_ARGS}}

  test:integration:
    desc: Run backend integration tests
    cmds:
      - task: server:test:integration

  hooks:install:
    desc: Install git hooks via lefthook (run once per checkout)
    cmds:
      - lefthook install

  lint:
    desc: Run all linters via lefthook (server, CLI, web UI, connector)
    cmds:
      - lefthook run lint

  brand:build:
    desc: Regenerate every brand artefact from brand/tokens/memory.tokens.json
    cmds:
      - python3 brand/build.py

  brand:check:
    desc: Verify brand artefacts, contrast pairs and the logo grid contract
    cmds:
      - bash scripts/preflight/brand.sh

  brand:preview:
    desc: Open the logo preview page in the default browser
    cmds:
      - xdg-open brand/logo/preview.html || open brand/logo/preview.html

  migrate:up:
    desc: Run database migrations up
    cmds:
      - task: server:migrate:up

  migrate:down:
    desc: Run database migrations down
    cmds:
      - task: server:migrate:down

  migrate:status:
    desc: Show migration status
    cmds:
      - task: server:migrate:status

  swagger:
    desc: Generate swagger docs
    cmds:
      - task: server:swagger

  dev:
    desc: Start server with hot reload (air, foreground)
    cmds:
      - task: server:dev

  start:
    desc: Build and start server in background
    cmds:
      - task: server:start

  stop:
    desc: Stop background server
    cmds:
      - task: server:stop

  status:
    desc: Check server status
    cmds:
      - task: server:status

  cli:gen-docs:
    desc: Regenerate the embedded CLI reference skill (memory-cli-reference/SKILL.md)
    dir: apps/cli
    cmds:
      - go generate ./cmd/...

  cli:install:
    desc: Build and install the memory CLI to ~/.memory/bin/memory
    dir: apps/cli
    cmds:
      - go generate ./cmd/...
      - mkdir -p ~/.memory/bin
      - go build -o ~/.memory/bin/memory ./cmd/main.go
      - echo "Installed memory CLI → ~/.memory/bin/memory"

  traces:list:
    desc: List recent traces from Tempo (memory traces list)
    cmds:
      - memory traces list {{.CLI_ARGS}}

  traces:get:
    desc: Fetch a full trace by ID (memory traces get <traceID>)
    cmds:
      - memory traces get {{.CLI_ARGS}}

  release:
    desc: "Cut a release: bump VERSION, commit, tag, push. Usage: task release VERSION=0.X.Y"
    requires:
      vars: [VERSION]
    cmds:
      - task: cli:gen-docs
      - |
        echo "Releasing v{{.VERSION}}"
        echo "{{.VERSION}}" > VERSION
        sed -i "s|// @version .*|// @version {{.VERSION}}|" apps/server/cmd/server/main.go
        sed -i "s|MARKETING_VERSION = .*;|MARKETING_VERSION = {{.VERSION}};|" apps/ios/VoiceAgent.xcodeproj/project.pbxproj
      - task: server:swagger
      - |
        # The commit carries the version carriers only. SKILL.md is generated
        # from the CLI help text and has no version of its own (its frontmatter
        # is `version: "1.0"`), so staging it would fold an unrelated generated
        # diff into the release commit. `scripts/preflight/cli-skill-pin.sh`
        # decides whether it is in sync.
        git add VERSION apps/server/cmd/server/main.go apps/ios/VoiceAgent.xcodeproj/project.pbxproj
        git status
        # The subject must be one the release-attribution rule in
        # scripts/preflight/version-drift.sh recognises, or CI rejects the bump:
        #   chore: release vX.Y.Z (this), a `[skip release]` marker, or the PR's
        #   `release` label. Offline coverage: version-drift.test.sh.
        git commit -m "chore: release v{{.VERSION}}"
        git tag v{{.VERSION}}
        git push origin HEAD
        git push origin v{{.VERSION}}
        echo "Tag v{{.VERSION}} pushed — CI will build binaries and create the GitHub Release."
        echo "Monitor: gh run list --workflow=memory-cli.yml"
        echo "After CI: verify images-ready.txt is uploaded to the release."
