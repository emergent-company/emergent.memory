# lefthook.yml — git hooks and lint tasks for emergent.memory server.
#
# Install hooks:   lefthook install
# Run lint only:   lefthook run lint
# Run pre-commit:  lefthook run pre-commit
#
# Override locally in lefthook-local.yml (not committed).

pre-commit:
  parallel: true
  jobs:
    - name: gofmt
      glob: "*.go"
      run: |
        files=$(gofmt -l {staged_files})
        if [ -n "$files" ]; then
          echo "gofmt: the following files need formatting:"
          echo "$files"
          exit 1
        fi

    - name: go-vet
      run: go vet ./apps/server/...

    - name: go-build
      run: go build ./apps/server/...

    - name: lint-ratchet
      glob: "*.go"
      run: |
        cd apps/server && ./scripts/lint-ratchet.sh

lint:
  parallel: true
  jobs:
    - name: gofmt
      run: |
        files=$(git ls-files '*.go' | xargs gofmt -l)
        if [ -n "$files" ]; then
          echo "gofmt: the following tracked files need formatting:"
          echo "$files"
          exit 1
        fi

    - name: go-vet
      run: go vet ./apps/server/...

    - name: go-build
      run: go build ./apps/server/...
