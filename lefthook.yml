# lefthook.yml — repo-wide git hooks + lint for the Memory monorepo.
#
# Lefthook loads exactly ONE config, from the git repo root: git hooks are
# repo-global and per-directory configs are NOT auto-discovered. Scope each job
# with `root:` (its CWD) and `glob:` (matched relative to `root` when set, else
# relative to the repo root).
#
# Install hooks:    lefthook install        (or: task hooks:install)
# Run pre-commit:   lefthook run pre-commit
# Run lint (all):   lefthook run lint
# Run web-ui lint:  lefthook run lint-webui
#
# Local overrides go in lefthook-local.yml (not committed).
# lefthook v2: https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  jobs:
    # ── Server — apps/server ─────────────────────────────────────────────────
    - name: server-gofmt
      root: apps/server
      glob: "**/*.go"
      run: |
        files=$(gofmt -l {staged_files})
        if [ -n "$files" ]; then
          echo "gofmt: the following files need formatting:"
          echo "$files"
          exit 1
        fi

    - name: server-go-vet
      root: apps/server
      glob: "**/*.go"
      run: go vet ./...

    - name: server-go-build
      root: apps/server
      glob: "**/*.go"
      run: go build ./...

    - name: server-lint-ratchet
      root: apps/server
      glob: "**/*.go"
      run: ./scripts/lint-ratchet.sh

    - name: server-swagger-annotations
      root: apps/server
      glob: "**/handler*.go"
      exclude:
        - "**/*_test.go"
      run: |
        fail=0
        for file in {staged_files}; do
          if ! grep -q '^// @Router' "$file"; then
            echo "ERROR: missing Swagger @Router annotation in $file"
            echo "  Handler files must document routes; see apps/server/domain/chunks/handler.go"
            fail=1
          fi
        done
        exit $fail

    - name: server-golangci-config
      root: apps/server
      glob: ".golangci.y*ml"
      run: golangci-lint config verify

    - name: server-untracked-imports
      glob:
        - "apps/server/*.go"
        - "apps/server/**/*.go"
      run: |
        staged=$(git diff --cached --name-only --diff-filter=ACMR | grep -E '^apps/server/.*\.go$' || true)
        imports=$(echo "$staged" | xargs grep -oh '"github\.com/emergent-company/emergent\.memory/[^"]*"' 2>/dev/null | tr -d '"' | sort -u || true)
        fail=0
        for imp in $imports; do
          rel="${imp#github.com/emergent-company/emergent.memory/}"
          case "$rel" in
            apps/server/*) dir="$rel" ;;
            *) dir="apps/server/$rel" ;;
          esac
          count=$(git ls-files --cached -- "$dir" | grep -c '\.go$' || true)
          if [ "$count" -eq 0 ]; then
            echo "ERROR: import \"$imp\" references untracked package ($dir)"
            echo "  Add the package files with 'git add $dir' before committing."
            fail=1
          fi
        done
        exit $fail

    - name: server-migrations
      glob:
        - "apps/server/migrations/*.sql"
        - "apps/server/migrations/**/*.sql"
      run: |
        fail=0
        for file in {staged_files}; do
          if grep -q '^\\' "$file"; then
            echo "ERROR: backslash metacommand in $file"
            grep -n '^\\' "$file" || true
            fail=1
          fi
          if grep -q '\$ \$' "$file"; then
            echo "ERROR: spaced dollar quotes in $file (use \$\$ not \$ \$)"
            grep -n '\$ \$' "$file" | head -5 || true
            fail=1
          fi
        done
        exit $fail

    # ── CLI — apps/cli ───────────────────────────────────────────────────────
    - name: cli-gofmt
      root: apps/cli
      glob: "**/*.go"
      run: |
        files=$(gofmt -l {staged_files})
        if [ -n "$files" ]; then
          echo "gofmt: the following files need formatting:"
          echo "$files"
          exit 1
        fi

    - name: cli-golangci-lint
      root: apps/cli
      glob: "**/*.go"
      run: golangci-lint run ./...

    # ── Web UI — apps/web-ui ─────────────────────────────────────────────────
    - name: webui-ruff
      root: apps/web-ui
      glob: "**/*.py"
      run: |
        if ! command -v ruff >/dev/null 2>&1; then
          echo "ruff not installed, skipping (install: pipx install ruff)"; exit 0
        fi
        ruff check {staged_files}

    - name: webui-gofmt
      root: apps/web-ui/gateway
      glob: "**/*.go"
      run: |
        files=$(gofmt -l {staged_files})
        if [ -n "$files" ]; then
          echo "gofmt: the following files need formatting:"
          echo "$files"
          exit 1
        fi

    - name: webui-go-vet
      root: apps/web-ui/gateway
      glob: "**/*.go"
      run: go vet ./...

    - name: webui-go-build
      root: apps/web-ui/gateway
      glob: "**/*.go"
      run: go build ./...

    - name: webui-templ
      root: apps/web-ui/gateway
      glob:
        - "*.templ"
        - "**/*.templ"
      run: templ generate -check

    - name: secrets
      run: |
        if ! command -v gitleaks >/dev/null 2>&1; then
          echo "gitleaks not installed, skipping secrets scan"; exit 0
        fi
        gitleaks git --staged --config .gitleaks.toml --no-banner

    - name: webui-no-generated
      run: |
        bad=$(git diff --cached --name-only --diff-filter=ACM \
          | grep -E 'webui/static/css/app\.css$|_templ\.go$' || true)
        if [ -n "$bad" ]; then
          echo "Generated files staged (gitignored — regenerate via task build/css):"
          echo "$bad"
          exit 1
        fi

    # ── Linux connector — apps/connector.linux ───────────────────────────────
    - name: connector-gofmt
      root: apps/connector.linux
      glob: "**/*.go"
      run: |
        files=$(gofmt -l {staged_files})
        if [ -n "$files" ]; then
          echo "gofmt: the following files need formatting:"
          echo "$files"
          exit 1
        fi

    - name: connector-go-vet
      root: apps/connector.linux
      glob: "**/*.go"
      run: go vet ./...

# Full lint across every tree. `task lint` (repo root) runs this group.
lint:
  parallel: true
  jobs:
    # ── Server ───────────────────────────────────────────────────────────────
    - name: server-gofmt
      root: apps/server
      run: |
        files=$(git ls-files '*.go' | xargs gofmt -l)
        if [ -n "$files" ]; then
          echo "gofmt: the following tracked files need formatting:"
          echo "$files"
          exit 1
        fi

    - name: server-go-vet
      root: apps/server
      run: go vet ./...

    - name: server-go-build
      root: apps/server
      run: go build ./...

    - name: server-golangci-lint
      root: apps/server
      run: golangci-lint run ./...

    # ── CLI ──────────────────────────────────────────────────────────────────
    - name: cli-gofmt
      root: apps/cli
      run: |
        files=$(gofmt -l $(find . -name "*.go" -not -path "*/vendor/*"))
        if [ -n "$files" ]; then
          echo "gofmt: the following files need formatting:"
          echo "$files"
          exit 1
        fi

    - name: cli-go-vet
      root: apps/cli
      run: go vet ./...

    - name: cli-golangci-lint
      root: apps/cli
      run: golangci-lint run ./...

    # ── Web UI ───────────────────────────────────────────────────────────────
    - name: webui-ruff
      root: apps/web-ui
      run: |
        if ! command -v ruff >/dev/null 2>&1; then
          echo "ruff not installed, skipping (install: pipx install ruff)"; exit 0
        fi
        ruff check .

    - name: webui-gofmt
      root: apps/web-ui/gateway
      run: |
        files=$(gofmt -l $(find . -name "*.go" -not -path "*/vendor/*"))
        if [ -n "$files" ]; then
          echo "gofmt: the following files need formatting:"
          echo "$files"
          exit 1
        fi

    - name: webui-go-vet
      root: apps/web-ui/gateway
      run: go vet ./...

    - name: webui-go-test
      root: apps/web-ui/gateway
      run: go test ./...

    - name: webui-golangci-lint
      root: apps/web-ui/gateway
      run: golangci-lint run ./...

    - name: webui-templ
      root: apps/web-ui/gateway
      run: templ generate -check

    - name: secrets
      run: |
        if ! command -v gitleaks >/dev/null 2>&1; then
          echo "gitleaks not installed, skipping secrets scan"; exit 0
        fi
        gitleaks dir . --config .gitleaks.toml --no-banner

    # ── Connector ────────────────────────────────────────────────────────────
    - name: connector-gofmt
      root: apps/connector.linux
      run: |
        files=$(gofmt -l $(find . -name "*.go" -not -path "*/vendor/*"))
        if [ -n "$files" ]; then
          echo "gofmt: the following files need formatting:"
          echo "$files"
          exit 1
        fi

    - name: connector-go-vet
      root: apps/connector.linux
      run: go vet ./...

    - name: connector-go-test
      root: apps/connector.linux
      run: go test ./...

    - name: connector-golangci-lint
      root: apps/connector.linux
      run: golangci-lint run ./...

