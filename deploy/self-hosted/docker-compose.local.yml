# Memory Minimal Standalone Deployment (Local Testing)
# Simplified version without Tailscale for local CLI testing
#
# Quick Start:
#   1. docker compose -f docker-compose.local.yml up -d
#   2. Configure CLI: export MEMORY_SERVER_URL=http://localhost:3002
#   3. Configure API key: export MEMORY_ACCOUNT_API_KEY=your-key-from-env

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: memory-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emergent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-emergent}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-emergent} -d ${POSTGRES_DB:-emergent}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - memory

  kreuzberg:
    # Pinned: Kreuzberg v4 LTS (GHCR). Keep in sync with KreuzbergImage in apps/cli/internal/installer/templates.go.
    image: ghcr.io/kreuzberg-dev/kreuzberg-full:4.10.3
    container_name: memory-kreuzberg
    restart: unless-stopped
    ports:
      - '${KREUZBERG_PORT:-8000}:8000'
    environment:
      - LOG_LEVEL=${KREUZBERG_LOG_LEVEL:-info}
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    networks:
      - memory

  seaweedfs:
    image: chrislusf/seaweedfs@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    container_name: memory-seaweedfs
    restart: unless-stopped
    # Single node: master + volume + filer + S3 in one process. S3 API on 8333.
    command: server -dir=/data -s3
    environment:
      # Fallback admin credentials. With these set, the installer-generated
      # secret is authoritative and unmatched access keys are rejected.
      AWS_ACCESS_KEY_ID: ${OBJECT_STORE_ACCESS_KEY:-emergent}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_KEY:-changeme}
    ports:
      - '${OBJECT_STORE_API_PORT:-9000}:8333'
    volumes:
      - object_store_data:/data
    healthcheck:
      # Master cluster-status endpoint (returns {"IsLeader":true}) — the S3
      # port alone does not indicate a ready cluster. 127.0.0.1 is used
      # explicitly because localhost resolves to IPv6 in the image.
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:9333/cluster/status']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - memory

  storage-init:
    image: memory-server:latest
    container_name: memory-storage-init
    # One-shot bucket bootstrap from the server image (same S3 client).
    entrypoint: ['/usr/local/bin/emergent-storage-init']
    restart: 'no'
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      STORAGE_PROVIDER: seaweedfs
      STORAGE_ENDPOINT: http://seaweedfs:8333
      STORAGE_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY:-emergent}
      STORAGE_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY:-changeme}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET_DOCUMENTS: documents
      STORAGE_BUCKET_TEMP: document-temp
    networks:
      - memory

  server:
    image: memory-server:latest
    build:
      context: ../..
      dockerfile: deploy/self-hosted/Dockerfile.server
      args:
        PG_CLIENT_MAJOR: ${PG_CLIENT_MAJOR:-17}
    container_name: memory-server
    restart: unless-stopped
    network_mode: host
    volumes:
      - memory_cli_config:/root/.memory
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/memory/firecracker:/var/lib/memory/firecracker
      - /var/lib/memory/firecracker/firecracker:/usr/local/bin/firecracker:ro
    devices:
      - /dev/kvm:/dev/kvm
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    environment:
      STANDALONE_MODE: 'true'
      STANDALONE_API_KEY: ${STANDALONE_API_KEY:-test-api-key-12345}
      STANDALONE_USER_EMAIL: ${STANDALONE_USER_EMAIL:-admin@localhost}
      STANDALONE_ORG_NAME: ${STANDALONE_ORG_NAME:-Default Organization}
      STANDALONE_PROJECT_NAME: ${STANDALONE_PROJECT_NAME:-Default Project}

      POSTGRES_HOST: localhost
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-emergent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-emergent}

      SERVER_PORT: ${SERVER_PORT:-3002}
      GO_ENV: production

      KREUZBERG_SERVICE_URL: http://localhost:${KREUZBERG_PORT:-8000}
      KREUZBERG_SERVICE_TIMEOUT: 300000
      KREUZBERG_ENABLED: 'true'

      STORAGE_PROVIDER: seaweedfs
      STORAGE_ENDPOINT: http://localhost:${OBJECT_STORE_API_PORT:-9000}
      STORAGE_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY:-emergent}
      STORAGE_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY:-changeme}
      STORAGE_BUCKET_DOCUMENTS: documents
      STORAGE_BUCKET_TEMP: document-temp
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_USE_SSL: 'false'

      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}

      DB_AUTOINIT: 'true'
      LLM_ENCRYPTION_KEY: ${LLM_ENCRYPTION_KEY:-}

      # Workspace configuration
      WORKSPACE_WARM_POOL_SIZE: ${WORKSPACE_WARM_POOL_SIZE:-2}
      WORKSPACE_DEFAULT_IMAGE: ${WORKSPACE_DEFAULT_IMAGE:-memory-workspace:latest}
      WORKSPACE_DEFAULT_PROVIDER: ${WORKSPACE_DEFAULT_PROVIDER:-gvisor}
    depends_on:
      seaweedfs:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O /dev/null http://localhost:${SERVER_PORT:-3002}/health',
        ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  object_store_data:
    driver: local
  memory_cli_config:
    driver: local

networks:
  memory:
    driver: bridge
