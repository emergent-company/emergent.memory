name: webpage-feedback
version: "1.0.0"
description: >
  Webpage feedback triage. Issue is a single report captured by
  emergent.feedback (or imported from GitHub/manual entry); IssueGroup is a
  recurring problem that links two or more similar Issues. The triage agent
  owns status/severity/category/triage_notes; the capture source owns
  capture_status.

objectTypes:
  - name: Issue
    label: Issue
    description: >
      A single webpage feedback report. Captured by emergent.feedback, with a
      page URL, reproduction context, and an app version/environment. A single
      report is triaged on its own; it only gets an IssueGroup when a second
      similar report appears.
    boardEnabled: true
    allowedStatuses: [new, triaged, needs-info, wont-fix]
    properties:
      title:
        type: string
        required: true
        description: Short human-readable summary of the report.
      description:
        type: string
        required: true
        description: What the reporter said, including what they expected.
      page_url:
        type: string
        title: Page URL
        description: The page where the feedback was captured.
      repo:
        type: string
        description: GitHub repository in "owner/name" form.
      source:
        type: string
        enum: [emergent.feedback, github, manual]
        default: emergent.feedback
        description: Where the Issue originated.
      source_id:
        type: string
        title: Source ID
        description: Stable id in the source system (feedback row id).
      source_url:
        type: string
        title: Source URL
        description: Deep link back to the original report.
      capture_status:
        type: string
        title: Capture status
        enum: [open, resolved, dismissed]
        default: open
        description: Lifecycle owned by the capture source, not the triage agent.
      severity:
        type: string
        enum: [blocker, high, medium, low, unknown]
        default: unknown
        description: Impact estimated during triage.
      category:
        type: string
        enum: [bug, ux, performance, content, feature, question, other]
        default: other
        description: Problem category estimated during triage.
      confidence:
        type: number
        minimum: 0
        maximum: 1
        description: Triage confidence in the classification, 0.0–1.0.
      reporter:
        type: string
        description: Reporter login, when the source provides one.
      app_version:
        type: string
        title: App version
        description: Application version the reporter was using.
      environment:
        type: string
        description: Environment name (production, staging, preview, …).
      branch:
        type: string
        description: Git branch the page was served from.
      viewport:
        type: string
        description: Viewport at capture time, e.g. 1440x900.
      triage_notes:
        type: string
        title: Triage notes
        description: Why the agent classified it this way; missing information.
      group_key:
        type: string
        title: Group key
        description: IssueGroup key when this report belongs to a recurring problem.
      created_at:
        type: string
        title: Created at
        description: ISO 8601 capture timestamp.
    labels:
      - feedback
    ui:
      icon: "🐞"
      color: "#E11D48"

  - name: IssueGroup
    label: Issue Group
    description: >
      A recurring problem that links two or more similar Issues. Created by the
      issue-triager only when a second similar report appears; a single report
      is never grouped.
    properties:
      title:
        type: string
        required: true
        description: Short name for the recurring problem.
      summary:
        type: string
        description: What the reports have in common and the likely root cause.
      category:
        type: string
        enum: [bug, ux, performance, content, feature, question, other]
        default: other
        description: Category shared by the grouped Issues.
      severity:
        type: string
        enum: [blocker, high, medium, low, unknown]
        default: unknown
        description: Highest severity among the grouped Issues.
      status:
        type: string
        enum: [open, triaged, resolved, wont-fix]
        default: open
        description: Overall state of the recurring problem.
      issue_count:
        type: number
        title: Issue count
        minimum: 1
        default: 1
        description: Number of Issues linked to this group.
      first_seen:
        type: string
        title: First seen
        description: ISO 8601 timestamp of the earliest linked Issue.
      last_seen:
        type: string
        title: Last seen
        description: ISO 8601 timestamp of the latest linked Issue.
      root_cause_hypothesis:
        type: string
        title: Root cause hypothesis
        description: Agent's current hypothesis for the underlying cause.
      suggested_fix:
        type: string
        title: Suggested fix
        description: Suggested next step or fix.
    labels:
      - issue-group
    ui:
      icon: "🧩"
      color: "#7C3AED"

relationshipTypes:
  - name: BELONGS_TO_GROUP
    label: Belongs To Group
    description: The Issue is an instance of the recurring problem.
    sourceType: Issue
    targetType: IssueGroup
