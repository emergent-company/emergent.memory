[project]
name = "memory"
version = "0.1.0"
description = "LiveKit-based voice agent with Home Assistant integration"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents>=1.6.0",
    "livekit-plugins-deepgram>=1.6.0",
    "livekit-plugins-cartesia>=1.6.0",
    "livekit-plugins-silero>=1.6.0",
    "livekit-plugins-turn-detector>=1.6.0",
    "sounddevice>=0.5.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

# Test-only dependencies (#773). The deployed image installs with
# `uv sync --locked --no-dev` (Dockerfile), so nothing here can reach the voice
# agent's runtime stack. `pytest` is the only import memory_bridge/tests needs
# that the runtime does not already provide: the suite is plain functions over
# stdlib + httpx + livekit.agents, and test_runtime_stack.py only builds the
# objects the entrypoint builds. Keep this list test-only — the CI job asserts
# pytest is NOT importable from the `--no-dev` install.
[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["memory_bridge/tests"]
# The image runs `uv sync --locked --no-dev --no-install-project` and imports
# memory_bridge from the WORKDIR, so the tests must not depend on the project
# being installed into site-packages: put the checkout root on sys.path and
# `memory_bridge` resolves exactly as it does at runtime.
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv", "node_modules", ".ruff_cache", ".opencode", "gateway"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["E501"]
