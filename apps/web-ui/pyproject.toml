[project]
name = "memory"
version = "0.1.0"
description = "LiveKit-based voice agent with Home Assistant integration"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents>=1.6.0",
    "livekit-plugins-deepgram>=1.6.0",
    "livekit-plugins-cartesia>=1.6.0",
    "livekit-plugins-silero>=1.6.0",
    "livekit-plugins-turn-detector>=1.6.0",
    "livekit-wakeword>=0.1.0",
    "pvporcupine>=4.0.0",
    "sounddevice>=0.5.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv", "node_modules", ".ruff_cache", ".opencode", "gateway"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["E501"]
