# lefthook.yml — git hooks + lint for Memory (Python agent/ + Go gateway/).
#
# Install hooks:   lefthook install
# Run pre-commit:  lefthook run pre-commit
# Run lint:        lefthook run lint
#
# NOTE: lefthook (v2.x) resolves the repo-root lefthook.yml regardless of the
# directory it is invoked from, and runs jobs from the git root by default.
# `apps/web-ui/Taskfile.yml` points lefthook here via LEFTHOOK_CONFIG, and each
# `lint` job sets `root: apps/web-ui` so its relative paths (gateway/,
# pyproject.toml, .gitleaks.toml) resolve against this directory.

pre-commit:
  parallel: true
  jobs:
    - name: ruff-check
      glob: "**/*.py"
      run: ruff check {staged_files}

    - name: gofmt
      glob: "gateway/**/*.go"
      run: |
        files=$(gofmt -l {staged_files})
        if [ -n "$files" ]; then
          echo "gofmt needed:"; echo "$files"; exit 1
        fi

    - name: go-vet
      glob: "gateway/**/*.go"
      run: cd gateway && go vet ./...

    - name: go-build
      glob: "gateway/**/*.go"
      run: cd gateway && go build ./...

    - name: templ-generate
      glob: "gateway/**/*.templ"
      run: cd gateway && templ generate -check

    - name: no-secrets
      run: gitleaks protect --staged --config .gitleaks.toml --no-banner

    - name: no-generated
      run: |
        bad=$(git diff --cached --name-only --diff-filter=ACM \
          | grep -E 'webui/static/css/app\.css$|_templ\.go$' || true)
        if [ -n "$bad" ]; then
          echo "Generated files staged (gitignored — regenerate via task build/css):"
          echo "$bad"
          exit 1
        fi

lint:
  parallel: true
  jobs:
    - name: ruff-check
      root: apps/web-ui
      run: ruff check .

    - name: golangci-lint
      root: apps/web-ui
      run: cd gateway && golangci-lint run ./...

    - name: gofmt
      root: apps/web-ui
      run: |
        files=$(gofmt -l $(find gateway -name "*.go" -not -path "*/vendor/*"))
        if [ -n "$files" ]; then
          echo "gofmt needed:"; echo "$files"; exit 1
        fi

    - name: go-vet
      root: apps/web-ui
      run: cd gateway && go vet ./...

    - name: go-test
      root: apps/web-ui
      run: cd gateway && go test ./...

    - name: templ-generate
      root: apps/web-ui
      run: cd gateway && templ generate -check

    - name: no-secrets
      root: apps/web-ui
      run: gitleaks dir . --config .gitleaks.toml --no-banner
