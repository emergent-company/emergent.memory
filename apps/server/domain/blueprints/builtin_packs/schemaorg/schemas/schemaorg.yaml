name: schemaorg
version: 1.0.0
taxonomy: true
description: >
  Base common-entity taxonomy derived from schema.org and adjusted to Memory's
  supported property types. Discovery aligns proposed types against this set
  before inventing new ones, so general entities (people, organizations,
  places, events, creative works, media) converge on one canonical name and
  property shape. Domain packs (e.g. tv-movies) add narrower types; shared type
  names are deduplicated in favour of this base pack.
author: Emergent
license: CC-BY-SA-3.0

objectTypeSchemas:

  - name: Thing
    label: Thing
    description: >
      The most general entity kind: anything that can be named or described.
      Use only when no more specific type applies.
    category: knowledge
    labels:
      - thing
      - entity
      - concept
    ui:
      icon: "tabler--box"
      color: "#64748B"
    properties:
      name:
        type: string
        description: "A short human-readable name."
      description:
        type: string
        description: "A one-paragraph description."
      url:
        type: url
        description: "Canonical URL for the entity."
      same_as:
        type: array
        title: Same as
        description: "URLs identifying the same entity elsewhere (cross-reference)."
        items:
          type: url
      identifier:
        type: string
        description: "An external stable identifier, if one is known."
    required: [name]

  - name: Person
    label: Person
    description: >
      A real, specific human being named in the content — not a fictional
      character and not an organization.
    category: identity
    parent: Thing
    labels:
      - person
      - human
      - individual
    ui:
      icon: "tabler--user"
      color: "#4F46E5"
    properties:
      name:
        type: string
        description: "The person's full name."
      given_name:
        type: string
        title: Given name
        description: "First name."
      family_name:
        type: string
        title: Family name
        description: "Last name."
      email:
        type: email
        description: "Contact email address."
      phone:
        type: phone
        description: "Contact phone number."
      job_title:
        type: string
        title: Job title
        description: "Role or occupation, e.g. 'Director'."
      url:
        type: url
        description: "Profile or homepage URL."
      birth_date:
        type: date
        title: Birth date
        description: "Date of birth (YYYY-MM-DD)."
      death_date:
        type: date
        title: Death date
        description: "Date of death (YYYY-MM-DD), if applicable."
    required: [name]

  - name: Organization
    label: Organization
    description: >
      A company, institution, or other organized group named in the content —
      studio, network, university, non-profit, government body.
    category: organization
    parent: Thing
    labels:
      - organization
      - company
      - institution
      - business
    ui:
      icon: "tabler--building"
      color: "#0EA5E9"
    properties:
      name:
        type: string
        description: "The organization's name."
      legal_name:
        type: string
        title: Legal name
        description: "Registered legal name, if different."
      url:
        type: url
        description: "Official website."
      email:
        type: email
        description: "Contact email address."
      phone:
        type: phone
        description: "Contact phone number."
      founding_date:
        type: date
        title: Founding date
        description: "Date founded (YYYY-MM-DD)."
      number_of_employees:
        type: integer
        title: Employees
        description: "Approximate employee count."
        minimum: 0
      description:
        type: string
        description: "What the organization does."
    required: [name]

  - name: Place
    label: Place
    description: >
      A physical place or venue — city, building, museum, coffeehouse, region.
    category: place
    parent: Thing
    labels:
      - place
      - location
      - venue
    ui:
      icon: "tabler--map-pin"
      color: "#10B981"
    properties:
      name:
        type: string
        description: "The place's name."
      address:
        type: string
        description: "Street address or human-readable location."
      latitude:
        type: number
        description: "WGS84 latitude."
        minimum: -90
        maximum: 90
      longitude:
        type: number
        description: "WGS84 longitude."
        minimum: -180
        maximum: 180
      url:
        type: url
        description: "Reference URL."
    required: [name]

  - name: Event
    label: Event
    description: >
      Something that happens at a time and place — conference, concert,
      meeting, launch, ceremony.
    category: event
    parent: Thing
    labels:
      - event
      - happening
      - occurrence
    ui:
      icon: "tabler--calendar-event"
      color: "#F59E0B"
    properties:
      name:
        type: string
        description: "The event's name."
      start_date:
        type: date
        title: Start date
        description: "Start date (YYYY-MM-DD)."
      end_date:
        type: date
        title: End date
        description: "End date (YYYY-MM-DD)."
      event_status:
        type: string
        title: Status
        description: "Lifecycle status."
        enum: [scheduled, cancelled, postponed, moved_online]
      attendance_mode:
        type: string
        title: Attendance mode
        description: "How attendees participate."
        enum: [in_person, online, hybrid]
      location_name:
        type: string
        title: Location
        description: "Human-readable place name for the event."
      url:
        type: url
        description: "Event page or registration URL."
    required: [name]

  - name: CreativeWork
    label: Creative Work
    description: >
      A creative or informational work — article, book, film, video, image,
      web page. The general parent for media and documents.
    category: creative
    parent: Thing
    labels:
      - creative_work
      - work
      - content
      - document
    ui:
      icon: "tabler--file-text"
      color: "#6366F1"
    properties:
      name:
        type: string
        description: "Title of the work."
      headline:
        type: string
        description: "Short headline or one-line title."
      description:
        type: string
        description: "Summary of the work."
      url:
        type: url
        description: "Canonical URL for the work."
      date_created:
        type: date
        title: Created
        description: "Creation date (YYYY-MM-DD)."
      date_modified:
        type: date
        title: Modified
        description: "Last modification date (YYYY-MM-DD)."
      keywords:
        type: array
        description: "Topic keywords or tags."
        items:
          type: string
      license:
        type: url
        description: "License URL, if declared."
      author_name:
        type: string
        title: Author
        description: "Name of the creator or author."
    required: [name]

  - name: Article
    label: Article
    description: >
      A written article, news story, blog post, or other prose piece.
    category: creative
    parent: CreativeWork
    labels:
      - article
      - news
      - post
      - story
    ui:
      icon: "tabler--article"
      color: "#8B5CF6"
    properties:
      headline:
        type: string
        description: "Article headline."
      article_body:
        type: string
        title: Body
        description: "Article text or summary."
      date_published:
        type: date
        title: Published
        description: "Publication date (YYYY-MM-DD)."
      section:
        type: string
        description: "Section or category, e.g. 'Technology'."
      author_name:
        type: string
        title: Author
        description: "Byline author name."
    required: [headline]

  - name: Book
    label: Book
    description: >
      A book, novel, or other bound publication.
    category: creative
    parent: CreativeWork
    labels:
      - book
      - novel
      - publication
    ui:
      icon: "tabler--book"
      color: "#7C3AED"
    properties:
      name:
        type: string
        title: Title
        description: "Book title."
      isbn:
        type: string
        description: "ISBN-10 or ISBN-13."
      number_of_pages:
        type: integer
        title: Pages
        description: "Page count."
        minimum: 0
      book_format:
        type: string
        title: Format
        description: "Binding/format."
        enum: [hardcover, paperback, ebook, audiobook]
    required: [name]

  - name: Movie
    label: Movie
    description: >
      A feature-length motion picture — a film or movie title.
    category: media
    parent: CreativeWork
    labels:
      - movie
      - film
      - motion_picture
    ui:
      icon: "tabler--movie"
      color: "#DB2777"
    properties:
      name:
        type: string
        title: Title
        description: "Movie title."
      duration:
        type: integer
        title: Duration (min)
        description: "Runtime in whole minutes."
        minimum: 0
      content_rating:
        type: string
        title: Content rating
        description: "Age rating, e.g. 'PG-13'."
      date_published:
        type: date
        title: Released
        description: "Release date (YYYY-MM-DD)."
      genre:
        type: array
        title: Genres
        description: "Genres (drama, comedy, ...)."
        items:
          type: string
    required: [name]

  - name: TVSeries
    label: TV Series
    description: >
      A television series or show: an ordered set of seasons and episodes.
    category: media
    parent: CreativeWork
    labels:
      - tv_series
      - television_series
      - tv_show
    ui:
      icon: "tabler--device-tv"
      color: "#EC4899"
    properties:
      name:
        type: string
        title: Title
        description: "Series title."
      number_of_seasons:
        type: integer
        title: Seasons
        description: "Number of seasons."
        minimum: 0
      number_of_episodes:
        type: integer
        title: Episodes
        description: "Number of episodes."
        minimum: 0
    required: [name]

  - name: VideoObject
    label: Video
    description: >
      A video recording or clip — a standalone video, not necessarily a film
      or series.
    category: media
    parent: CreativeWork
    labels:
      - video
      - clip
      - footage
    ui:
      icon: "tabler--video"
      color: "#F43F5E"
    properties:
      name:
        type: string
        title: Title
        description: "Video title."
      duration:
        type: integer
        title: Duration (min)
        description: "Runtime in whole minutes."
        minimum: 0
      content_url:
        type: url
        title: Content URL
        description: "URL of the video file or page."
      thumbnail_url:
        type: url
        title: Thumbnail URL
        description: "URL of a thumbnail image."
    required: [name]

  - name: ImageObject
    label: Image
    description: >
      A single image or photograph.
    category: media
    parent: CreativeWork
    labels:
      - image
      - picture
      - photo
    ui:
      icon: "tabler--photo"
      color: "#F97316"
    properties:
      name:
        type: string
        title: Title
        description: "Image title or caption."
      content_url:
        type: url
        title: Content URL
        description: "URL of the image file."
      width:
        type: integer
        description: "Pixel width."
        minimum: 0
      height:
        type: integer
        description: "Pixel height."
        minimum: 0
    required: [name]

  - name: WebPage
    label: Web Page
    description: >
      A single web page — an article page, product page, profile page, etc.
    category: web
    parent: CreativeWork
    labels:
      - web_page
      - page
      - webpage
    ui:
      icon: "tabler--browser"
      color: "#3B82F6"
    properties:
      name:
        type: string
        description: "Page name or title."
      url:
        type: url
        description: "Page URL."
    required: [name]

  - name: WebSite
    label: Web Site
    description: >
      A website: a set of pages under one domain.
    category: web
    parent: CreativeWork
    labels:
      - website
      - site
      - web_presence
    ui:
      icon: "tabler--world-www"
      color: "#2563EB"
    properties:
      name:
        type: string
        description: "Site name."
      url:
        type: url
        description: "Site URL."
    required: [name]

  - name: Product
    label: Product
    description: >
      A physical or digital product that can be bought, sold, or reviewed.
    category: commerce
    parent: Thing
    labels:
      - product
      - item
      - merchandise
    ui:
      icon: "tabler--package"
      color: "#EA580C"
    properties:
      name:
        type: string
        description: "Product name."
      sku:
        type: string
        description: "Stock-keeping unit or internal product code."
      gtin:
        type: string
        description: "Global trade item number (barcode)."
      description:
        type: string
        description: "Product description."
      color:
        type: string
        description: "Product color."
      material:
        type: string
        description: "Primary material."
      weight:
        type: number
        description: "Product weight in kilograms."
        minimum: 0
      brand_name:
        type: string
        title: Brand
        description: "Brand name."
      manufacturer_name:
        type: string
        title: Manufacturer
        description: "Manufacturer name."
    required: [name]

  - name: Offer
    label: Offer
    description: >
      A price and availability offer for a product or service.
    category: commerce
    parent: Thing
    labels:
      - offer
      - price
      - deal
    ui:
      icon: "tabler--tag"
      color: "#D97706"
    properties:
      price:
        type: number
        description: "Offer price."
        minimum: 0
      price_currency:
        type: currency
        title: Currency
        description: "ISO 4217 currency code."
      availability:
        type: string
        description: "Stock availability."
        enum: [in_stock, out_of_stock, preorder, discontinued]
      valid_from:
        type: date
        title: Valid from
        description: "Offer start date (YYYY-MM-DD)."
      valid_through:
        type: date
        title: Valid through
        description: "Offer end date (YYYY-MM-DD)."
      url:
        type: url
        description: "Offer or checkout URL."
    required: [price]

  - name: Brand
    label: Brand
    description: >
      A brand or trademark under which products or services are sold.
    category: commerce
    parent: Thing
    labels:
      - brand
      - label
      - trademark
    ui:
      icon: "tabler--trademark"
      color: "#B45309"
    properties:
      name:
        type: string
        description: "Brand name."
      logo_url:
        type: url
        title: Logo URL
        description: "URL of the brand logo."
      url:
        type: url
        description: "Brand website."
    required: [name]

  - name: Review
    label: Review
    description: >
      A review or critique of a product, work, or service, with an optional
      rating.
    category: commerce
    parent: CreativeWork
    labels:
      - review
      - critique
      - feedback
    ui:
      icon: "tabler--message-star"
      color: "#EAB308"
    properties:
      review_body:
        type: string
        title: Review
        description: "Review text or summary."
      review_rating:
        type: integer
        title: Rating
        description: "Numeric rating, typically 1-5."
        minimum: 1
        maximum: 10
      date_published:
        type: date
        title: Published
        description: "Publication date (YYYY-MM-DD)."
      author_name:
        type: string
        title: Author
        description: "Reviewer name."
      item_name:
        type: string
        title: Item reviewed
        description: "Name of the reviewed item."

  - name: AggregateRating
    label: Aggregate Rating
    description: >
      A summary rating aggregated across many reviews.
    category: commerce
    parent: Thing
    labels:
      - aggregate_rating
      - rating_summary
    ui:
      icon: "tabler--star-half"
      color: "#CA8A04"
    properties:
      rating_value:
        type: number
        title: Rating value
        description: "Average rating."
        minimum: 0
      review_count:
        type: integer
        title: Reviews
        description: "Number of reviews aggregated."
        minimum: 0
    required: [rating_value]

  - name: Recipe
    label: Recipe
    description: >
      A recipe: ingredients, steps, and timings for preparing a dish.
    category: food
    parent: CreativeWork
    labels:
      - recipe
      - dish
      - cooking
    ui:
      icon: "tabler--chef-hat"
      color: "#16A34A"
    properties:
      name:
        type: string
        description: "Recipe name."
      recipe_ingredient:
        type: array
        title: Ingredients
        description: "Ingredient lines."
        items:
          type: string
      cook_time:
        type: integer
        title: Cook time (min)
        description: "Cooking time in whole minutes."
        minimum: 0
      prep_time:
        type: integer
        title: Prep time (min)
        description: "Preparation time in whole minutes."
        minimum: 0
      recipe_yield:
        type: string
        title: Yield
        description: "Number of servings or quantity produced."
      recipe_category:
        type: array
        title: Categories
        description: "Recipe categories, e.g. dessert, main course."
        items:
          type: string
      instructions:
        type: string
        description: "Preparation instructions."
    required: [name]

  - name: LocalBusiness
    label: Local Business
    description: >
      A specific business at a physical location — shop, restaurant, clinic,
      studio.
    category: organization
    parent: Organization
    labels:
      - local_business
      - business
      - store
    ui:
      icon: "tabler--building-store"
      color: "#059669"
    properties:
      name:
        type: string
        description: "Business name."
      price_range:
        type: string
        title: Price range
        description: "Relative price range, e.g. '$$'."
      phone:
        type: phone
        description: "Contact phone number."
      address:
        type: string
        description: "Street address."
      url:
        type: url
        description: "Business website."
    required: [name]

  - name: SoftwareApplication
    label: Software Application
    description: >
      A software program or app — desktop, mobile, web, or service.
    category: software
    parent: CreativeWork
    labels:
      - software_application
      - app
      - program
    ui:
      icon: "tabler--app-window"
      color: "#14B8A6"
    properties:
      name:
        type: string
        description: "Application name."
      application_category:
        type: string
        title: Application category
        description: "Category, e.g. productivity, game, developer tool."
      operating_system:
        type: string
        title: Operating system
        description: "Supported operating systems."
      software_version:
        type: string
        title: Version
        description: "Version string."
      url:
        type: url
        description: "Download or homepage URL."
    required: [name]

  - name: SoftwareSourceCode
    label: Source Code
    description: >
      A source-code artifact — repository, package, or code snippet.
    category: software
    parent: CreativeWork
    labels:
      - source_code
      - code
      - repository
    ui:
      icon: "tabler--code"
      color: "#0D9488"
    properties:
      name:
        type: string
        description: "Project or artifact name."
      programming_language:
        type: string
        title: Programming language
        description: "Primary language."
      code_repository:
        type: url
        title: Repository
        description: "Repository URL."
      code_sample:
        type: string
        title: Code sample
        description: "A representative code snippet."
    required: [name]

  - name: JobPosting
    label: Job Posting
    description: >
      A job vacancy or employment opportunity.
    category: work
    parent: Thing
    labels:
      - job_posting
      - vacancy
      - position
      - opening
    ui:
      icon: "tabler--id-badge"
      color: "#0891B2"
    properties:
      title:
        type: string
        description: "Job title."
      description:
        type: string
        description: "Job description."
      date_posted:
        type: date
        title: Posted
        description: "Date posted (YYYY-MM-DD)."
      employment_type:
        type: string
        title: Employment type
        description: "Employment type."
        enum: [full_time, part_time, contract, temporary, internship]
      base_salary:
        type: number
        title: Base salary
        description: "Annual base salary."
        minimum: 0
      salary_currency:
        type: currency
        title: Currency
        description: "ISO 4217 currency code."
      url:
        type: url
        description: "Application URL."
      hiring_organization_name:
        type: string
        title: Hiring organization
        description: "Name of the hiring organization."
      job_location_name:
        type: string
        title: Job location
        description: "Human-readable job location."
    required: [title]

  - name: Course
    label: Course
    description: >
      A course or class of study offered by an organization.
    category: education
    parent: CreativeWork
    labels:
      - course
      - class
      - training
    ui:
      icon: "tabler--school"
      color: "#9333EA"
    properties:
      name:
        type: string
        description: "Course name."
      description:
        type: string
        description: "Course description."
      provider_name:
        type: string
        title: Provider
        description: "Name of the offering organization."
    required: [name]

  - name: HowTo
    label: How To
    description: >
      A set of instructions for accomplishing a task.
    category: knowledge
    parent: CreativeWork
    labels:
      - how_to
      - guide
      - tutorial
    ui:
      icon: "tabler--list-check"
      color: "#64748B"
    properties:
      name:
        type: string
        description: "Title of the guide."
      step:
        type: array
        title: Steps
        description: "Ordered instruction steps."
        items:
          type: string
      total_time:
        type: integer
        title: Total time (min)
        description: "Total time required in whole minutes."
        minimum: 0
    required: [name]

  - name: MedicalEntity
    label: Medical Entity
    description: >
      A medical concept or entity — condition, procedure, or healthcare topic.
    category: health
    parent: Thing
    labels:
      - medical_entity
      - medical
      - health
    ui:
      icon: "tabler--stethoscope"
      color: "#E11D48"
    properties:
      name:
        type: string
        description: "Name of the medical entity."
      description:
        type: string
        description: "Description."
    required: [name]

  - name: Drug
    label: Drug
    description: >
      A pharmaceutical drug or medication.
    category: health
    parent: MedicalEntity
    labels:
      - drug
      - medication
      - medicine
    ui:
      icon: "tabler--pill"
      color: "#BE123C"
    properties:
      name:
        type: string
        description: "Drug name."
      active_ingredient:
        type: string
        title: Active ingredient
        description: "Active ingredient."
      dosage_form:
        type: string
        title: Dosage form
        description: "Form, e.g. tablet, capsule, liquid."
    required: [name]

# Candidate relationship types (schema.org object-valued properties, adjusted).
# These are NOT materialized wholesale: the catalog projector activates a pair
# only when both endpoint types are installed/requested, and leaves the rest
# deferred. Plural sourceTypes/targetTypes expand to concrete pairs.
relationshipTypeSchemas:

  - name: authored_by
    label: Authored by
    description: The work was authored or created by a person or organization.
    sourceTypes: [CreativeWork, Article, Book, Recipe, Course, HowTo]
    targetTypes: [Person, Organization]

  - name: directed_by
    label: Directed by
    description: The production was directed by a person.
    sourceTypes: [Movie, TVSeries]
    targetTypes: [Person]

  - name: featured_actor
    label: Featured actor
    description: A person performs in the production.
    sourceTypes: [Movie, TVSeries]
    targetTypes: [Person]

  - name: produced_by
    label: Produced by
    description: The production was produced by an organization.
    sourceTypes: [Movie, TVSeries]
    targetTypes: [Organization]

  - name: part_of_site
    label: Part of site
    description: The page belongs to a website.
    sourceTypes: [WebPage]
    targetTypes: [WebSite]

  - name: works_for
    label: Works for
    description: The person is employed by or works for the organization.
    sourceTypes: [Person]
    targetTypes: [Organization]

  - name: member_of
    label: Member of
    description: The person is a member of the organization.
    sourceTypes: [Person]
    targetTypes: [Organization]

  - name: located_at
    label: Located at
    description: The event or business is located at a place.
    sourceTypes: [Event, LocalBusiness]
    targetTypes: [Place]

  - name: organized_by
    label: Organized by
    description: The event is organized by a person or organization.
    sourceTypes: [Event]
    targetTypes: [Person, Organization]

  - name: parent_organization
    label: Parent organization
    description: The organization is a subsidiary or child of another.
    sourceTypes: [Organization]
    targetTypes: [Organization]

  - name: has_offer
    label: Has offer
    description: The product is offered under this price/availability offer.
    sourceTypes: [Product]
    targetTypes: [Offer]

  - name: made_by
    label: Made by
    description: The product is manufactured by an organization.
