projectInfo: |
  # TV & Movies Taxonomy Blueprint

  A canonical entity taxonomy for television and film content: the common
  entity kinds a transcript, review or production note describes. Auto-discovery
  aligns a proposed type against this set first and only invents a new type when
  nothing matches, so the same real-world concept keeps one canonical name and
  schema across runs.

  Key design decisions:
  - "Character" (fictional) and "Person" (real human) are deliberately distinct:
    the cast of a show is a Character, a real public figure is a Person. The
    descriptions and labels are the signal auto-discovery uses to tell them apart.
  - Every type carries labels so the taxonomy can be filtered and matched by tag.
