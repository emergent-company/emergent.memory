name: schemaorg
objectTypeSchemas:
- name: Movie
  label: Movie
  description: 'A feature-length motion picture — a film or movie title.

    '
  category: media
  parent: CreativeWork
  labels:
  - movie
  - film
  - motion_picture
  ui:
    icon: tabler--movie
    color: '#DB2777'
  properties:
    name:
      type: string
      title: Title
      description: Movie title.
    duration:
      type: integer
      title: Duration (min)
      description: Runtime in whole minutes.
      minimum: 0
    content_rating:
      type: string
      title: Content rating
      description: Age rating, e.g. 'PG-13'.
    date_published:
      type: date
      title: Released
      description: Release date (YYYY-MM-DD).
    genre:
      type: array
      title: Genres
      description: Genres (drama, comedy, ...).
      items:
        type: string
  required:
  - name
- name: TVSeries
  label: TV Series
  description: 'A television series or show: an ordered set of seasons and episodes.

    '
  category: media
  parent: CreativeWork
  labels:
  - tv_series
  - television_series
  - tv_show
  - show
  ui:
    icon: tabler--device-tv
    color: '#EC4899'
  properties:
    name:
      type: string
      title: Title
      description: Series title.
    number_of_seasons:
      type: integer
      title: Seasons
      description: Number of seasons.
      minimum: 0
    number_of_episodes:
      type: integer
      title: Episodes
      description: Number of episodes.
      minimum: 0
  required:
  - name
- name: Episode
  label: Episode
  description: 'A single episode of a series — a TV, radio, or podcast episode.'
  category: media
  parent: CreativeWork
  labels:
  - episode
  - tv_episode
  ui:
    icon: tabler--player-play
    color: '#0EA5E9'
  properties:
    name:
      type: string
      title: Title
      description: Episode title.
    episode_number:
      type: integer
      title: Episode number
      description: Position within its season.
      minimum: 1
    season_number:
      type: integer
      title: Season number
      description: Season the episode belongs to.
      minimum: 1
  required:
  - name
- name: VideoObject
  label: Video
  description: 'A video recording or clip — a standalone video, not necessarily a film or series.

    '
  category: media
  parent: CreativeWork
  labels:
  - video
  - clip
  - footage
  ui:
    icon: tabler--video
    color: '#F43F5E'
  properties:
    name:
      type: string
      title: Title
      description: Video title.
    duration:
      type: integer
      title: Duration (min)
      description: Runtime in whole minutes.
      minimum: 0
    content_url:
      type: url
      title: Content URL
      description: URL of the video file or page.
    thumbnail_url:
      type: url
      title: Thumbnail URL
      description: URL of a thumbnail image.
  required:
  - name
- name: ImageObject
  label: Image
  description: 'A single image or photograph.

    '
  category: media
  parent: CreativeWork
  labels:
  - image
  - picture
  - photo
  ui:
    icon: tabler--photo
    color: '#F97316'
  properties:
    name:
      type: string
      title: Title
      description: Image title or caption.
    content_url:
      type: url
      title: Content URL
      description: URL of the image file.
    width:
      type: integer
      description: Pixel width.
      minimum: 0
    height:
      type: integer
      description: Pixel height.
      minimum: 0
  required:
  - name
- name: MusicRecording
  label: Music Recording
  description: A song or recorded track.
  category: media
  parent: CreativeWork
  labels:
  - song
  - track
  - recording
  ui:
    icon: tabler--music
    color: '#DB2777'
  properties:
    name:
      type: string
      description: The track's title.
    duration:
      type: integer
      description: Runtime in minutes.
      minimum: 0
    isrc:
      type: string
      description: ISRC code.
    genre:
      type: array
      description: Genres.
      items:
        type: string
  required:
  - name
- name: MusicAlbum
  label: Music Album
  description: 'An album or record: a collection of tracks.'
  category: media
  parent: CreativeWork
  labels:
  - album
  - record
  ui:
    icon: tabler--album
    color: '#BE185D'
  properties:
    name:
      type: string
      description: The album's title.
    release_date:
      type: date
      description: Release date (YYYY-MM-DD).
      title: Release Date
    track_count:
      type: integer
      description: Number of tracks.
      minimum: 0
      title: Track Count
    genre:
      type: array
      description: Genres.
      items:
        type: string
  required:
  - name
- name: PodcastSeries
  label: Podcast Series
  description: 'A podcast show: an ordered set of episodes.'
  category: media
  parent: CreativeWork
  labels:
  - podcast
  ui:
    icon: tabler--microphone
    color: '#8B5CF6'
  properties:
    name:
      type: string
      description: The podcast's title.
    author_name:
      type: string
      description: Host or author.
      title: Author Name
    episode_count:
      type: integer
      description: Number of episodes.
      minimum: 0
      title: Episode Count
    url:
      type: url
      description: Show URL.
  required:
  - name
- name: VisualArtwork
  label: Visual Artwork
  description: A painting, drawing, sculpture or other visual art piece.
  category: creative
  parent: CreativeWork
  labels:
  - art
  - artwork
  - painting
  ui:
    icon: tabler--palette
    color: '#F97316'
  properties:
    name:
      type: string
      description: The work's title.
    artform:
      type: string
      description: Kind of artwork.
      enum:
      - painting
      - drawing
      - sculpture
      - digital
      - photography
    medium:
      type: string
      description: Materials or medium.
    date_created:
      type: date
      description: Creation date (YYYY-MM-DD).
      title: Date Created
  required:
  - name
