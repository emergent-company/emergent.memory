name: schemaorg
objectTypeSchemas:
- name: Recipe
  label: Recipe
  description: 'A recipe: ingredients, steps, and timings for preparing a dish.

    '
  category: food
  parent: CreativeWork
  labels:
  - recipe
  - dish
  - cooking
  ui:
    icon: tabler--chef-hat
    color: '#16A34A'
  properties:
    name:
      type: string
      description: Recipe name.
    recipe_ingredient:
      type: array
      title: Ingredients
      description: Ingredient lines.
      items:
        type: string
    cook_time:
      type: integer
      title: Cook time (min)
      description: Cooking time in whole minutes.
      minimum: 0
    prep_time:
      type: integer
      title: Prep time (min)
      description: Preparation time in whole minutes.
      minimum: 0
    recipe_yield:
      type: string
      title: Yield
      description: Number of servings or quantity produced.
    recipe_category:
      type: array
      title: Categories
      description: Recipe categories, e.g. dessert, main course.
      items:
        type: string
    instructions:
      type: string
      description: Preparation instructions.
  required:
  - name
- name: Restaurant
  label: Restaurant
  description: A restaurant or eatery.
  category: food
  parent: LocalBusiness
  labels:
  - restaurant
  - eatery
  - dining
  ui:
    icon: tabler--tools-kitchen-2
    color: '#16A34A'
  properties:
    name:
      type: string
      description: The restaurant's name.
    cuisine:
      type: array
      description: Cuisines served.
      items:
        type: string
    price_range:
      type: string
      description: Relative price range, e.g. '$$'.
      title: Price Range
    phone:
      type: phone
      description: Contact phone number.
    address:
      type: string
      description: Street address.
  required:
  - name
- name: MenuItem
  label: Menu Item
  description: One dish or item on a menu.
  category: food
  parent: Thing
  labels:
  - menu_item
  - dish
  ui:
    icon: tabler--tools-kitchen-2
    color: '#CA8A04'
  properties:
    name:
      type: string
      description: The item's name.
    price:
      type: number
      description: Price.
      minimum: 0
    currency:
      type: currency
      description: ISO 4217 currency code.
    dietary:
      type: array
      description: Dietary labels (vegetarian, vegan, gluten-free).
      items:
        type: string
    description:
      type: string
      description: Short description.
  required:
  - name
